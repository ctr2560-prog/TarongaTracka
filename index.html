    const { useState, useEffect, useRef } = React;

    const TarongaTracka = () => {
      const loadProgress = () => {
        try {
          const saved = localStorage.getItem('tarongaTrackaProgress');
          if (saved) return JSON.parse(saved);
        } catch (err) {}
        return null;
      };

      const savedProgress = loadProgress();

      const [currentScreen, setCurrentScreen] = useState(savedProgress?.currentScreen || 'home');
      const [userLocation, setUserLocation] = useState(null);
      const [locationEnabled, setLocationEnabled] = useState(savedProgress?.locationEnabled || false);

      const [observation, setObservation] = useState('');
      const [totalPoints, setTotalPoints] = useState(savedProgress?.totalPoints || 0);
      const [badges, setBadges] = useState(savedProgress?.badges || []);
      const [isProcessingAnswer, setIsProcessingAnswer] = useState(false);

      // Step 1 – Teacher/Student state
      const [studentName, setStudentName] = useState(() => { try { return JSON.parse(localStorage.getItem('tarongaStudentName')) || ''; } catch(e) { return ''; } });
      const [classCode, setClassCode] = useState(() => { try { return JSON.parse(localStorage.getItem('tarongaClassCode')) || ''; } catch(e) { return ''; } });
      const [teacherEmail, setTeacherEmail] = useState('');
      const [adminAccessCode, setAdminAccessCode] = useState('');
      const [adminStats, setAdminStats] = useState({ totalTeachers: 0, totalClasses: 0, totalStudents: 0, totalCompleted: 0 });
      const [adminLoading, setAdminLoading] = useState(false);
      const [selectedAdminClass, setSelectedAdminClass] = useState(null);
      const [adminClassData, setAdminClassData] = useState(null);
      const [adminClassStudents, setAdminClassStudents] = useState([]);
      const [adminClassLoading, setAdminClassLoading] = useState(false);

      // Step 2 – Class creation state
      const [teacherClasses, setTeacherClasses] = useState([]);
      const [studentJoinError, setStudentJoinError] = useState('');
      const [lookedUpClass, setLookedUpClass] = useState(null);
      const [newYearGroup, setNewYearGroup] = useState('');
      const [newClassName, setNewClassName] = useState('');
      const [selectedClass, setSelectedClass] = useState(null);

      // Step 4 – Activity completion
      const [activityCompleted, setActivityCompleted] = useState(savedProgress?.activityCompleted || false);
      const [isSubmittingActivity, setIsSubmittingActivity] = useState(false);

      // Step 5 – Firestore live student data for teacher classDetails
      const [firestoreStudents, setFirestoreStudents] = useState([]);
      const [firestoreLoading, setFirestoreLoading] = useState(true);
      const [observationsModal, setObservationsModal] = useState(null);

      useEffect(() => { localStorage.setItem('tarongaStudentName', JSON.stringify(studentName)); }, [studentName]);
      useEffect(() => { localStorage.setItem('tarongaClassCode', JSON.stringify(classCode)); }, [classCode]);

      // Firestore listener: load teacher's classes when dashboard opens
      useEffect(() => {
        if (currentScreen !== 'teacherDashboard' || !teacherEmail.trim()) {
          return;
        }

        const unsubscribe = window.db.collection('teachers').doc(teacherEmail)
          .collection('classes')
          .onSnapshot((snapshot) => {
            const classes = snapshot.docs.map(doc => {
              const d = doc.data();
              return {
                classCode: d.classCode || doc.id,
                className: d.className || "",
                yearGroup: d.yearGroup || "",
                teacherEmail: d.teacherEmail || teacherEmail,
                archived: d.archived || false,
                students: [] // Keep for local student join tracking
              };
            });
            setTeacherClasses(classes);
          }, (err) => {
            console.error('Firestore teacher classes listener error:', err);
            setTeacherClasses([]);
          });

        return () => unsubscribe();
      }, [currentScreen, teacherEmail]);

      // Firestore class-code lookup: drives the live preview banner as the student types
      useEffect(() => {
        if (currentScreen !== 'studentJoin') { setLookedUpClass(null); return; }
        const code = normaliseCode(classCode);
        if (code.length !== 6) { setLookedUpClass(null); return; }
        let cancelled = false;
        window.db.collection('classes').doc(code).get().then((doc) => {
          if (cancelled) return;
          if (doc.exists) {
            const d = doc.data();
            setLookedUpClass({ className: d.className, yearGroup: d.yearGroup });
          } else {
            setLookedUpClass(null);
          }
        }).catch(() => { if (!cancelled) setLookedUpClass(null); });
        return () => { cancelled = true; };
      }, [classCode, currentScreen]);

      // Admin stats: fetch when dashboard loads
      useEffect(() => {
        if (currentScreen !== 'adminDashboard') return;

        const fetchAdminStats = async () => {
          setAdminLoading(true);
          try {
            const classesSnapshot = await window.db.collection('classes').get();
            const teacherEmails = new Set();
            let totalStudents = 0;
            let totalCompleted = 0;

            for (const classDoc of classesSnapshot.docs) {
              const classData = classDoc.data();
              if (classData.teacherEmail) teacherEmails.add(classData.teacherEmail);

              const studentsSnapshot = await window.db.collection('classes')
                .doc(classDoc.id)
                .collection('students')
                .get();

              totalStudents += studentsSnapshot.size;
              studentsSnapshot.docs.forEach(studentDoc => {
                const studentData = studentDoc.data();
                if (studentData.completed === true) totalCompleted++;
              });
            }

            setAdminStats({
              totalTeachers: teacherEmails.size,
              totalClasses: classesSnapshot.size,
              totalStudents: totalStudents,
              totalCompleted: totalCompleted
            });
          } catch (err) {
            console.error('Failed to fetch admin stats:', err);
          } finally {
            setAdminLoading(false);
          }
        };

        fetchAdminStats();
      }, [currentScreen]);

      // Admin class view: fetch class details and students
      useEffect(() => {
        if (!selectedAdminClass || currentScreen !== 'adminClassView') {
          setAdminClassData(null);
          setAdminClassStudents([]);
          return;
        }

        const fetchClassData = async () => {
          setAdminClassLoading(true);
          try {
            // Fetch class document
            const classDoc = await window.db.collection('classes').doc(selectedAdminClass).get();
            if (classDoc.exists) {
              setAdminClassData({ id: classDoc.id, ...classDoc.data() });
            }

            // Fetch students subcollection
            const studentsSnapshot = await window.db.collection('classes')
              .doc(selectedAdminClass)
              .collection('students')
              .get();

            const students = studentsSnapshot.docs.map(doc => {
              const d = doc.data();
              return {
                name: d.name || doc.id,
                totalPoints: d.totalPoints || 0,
                badges: d.badges || [],
                completed: d.completed || false,
                completedAt: d.completedAt ? d.completedAt.toDate() : null
              };
            });

            setAdminClassStudents(students);
          } catch (err) {
            console.error('Failed to fetch class data:', err);
          } finally {
            setAdminClassLoading(false);
          }
        };

        fetchClassData();
      }, [selectedAdminClass, currentScreen]);

      // Step 5 – Real-time listener: fetch students from Firestore when teacher opens a class
      useEffect(() => {
        if (!selectedClass || currentScreen !== 'classDetails') {
          setFirestoreStudents([]);
          setFirestoreLoading(true);
          return;
        }

        setFirestoreLoading(true);
        const unsubscribe = window.db.collection('classes').doc(selectedClass)
          .collection('students')
          .onSnapshot((snapshot) => {
            const students = snapshot.docs.map(doc => {
              const d = doc.data();
              return {
                name: d.name || doc.id,
                totalPoints: d.totalPoints || 0,
                badges: d.badges || [],
                completed: d.completed || false,
                completedAt: d.completedAt ? d.completedAt.toDate() : null
              };
            });
            setFirestoreStudents(students);
            setFirestoreLoading(false);
          }, (err) => {
            console.error('Firestore listener error:', err);
            setFirestoreStudents([]);
            setFirestoreLoading(false);
          });

        return () => unsubscribe();
      }, [selectedClass, currentScreen]);

      const normaliseCode = (code) => code.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 6);

      const generateClassCode = () => {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let code = '';
        for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
        return code;
      };

      const createClass = () => {
        if (!newYearGroup.trim() || !newClassName.trim()) return;
        let code = generateClassCode();
        while (teacherClasses.some(c => normaliseCode(c.classCode) === normaliseCode(code))) {
          code = generateClassCode();
        }

        // Write to Firestore: teachers/{teacherEmail}/classes/{classCode}
        window.db.collection('teachers').doc(teacherEmail)
          .collection('classes').doc(code)
          .set({
            classCode: code,
            yearGroup: newYearGroup.trim(),
            className: newClassName.trim(),
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            archived: false
          })
          .then(() => {
            setNewYearGroup('');
            setNewClassName('');
          })
          .catch((err) => console.error('Failed to create class:', err));

        // Also write to classes/{code} for student join validation
        window.db.collection('classes').doc(code).set({
          classCode: code,
          yearGroup: newYearGroup.trim(),
          className: newClassName.trim(),
          teacherEmail: teacherEmail,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch((err) => console.error('Failed to save class to Firestore:', err));
      };

      const geoWatchIdRef = useRef(null);
      const hasEnteredMapRef = useRef(false);

      useEffect(() => {
        const progress = {
          currentScreen,
          locationEnabled,
          foundAnimals: Array.from(foundAnimals),
          totalPoints,
          badges,
          activityCompleted
        };
        localStorage.setItem('tarongaTrackaProgress', JSON.stringify(progress));
      }, [currentScreen, foundAnimals, totalPoints, badges, locationEnabled, activityCompleted]);

      // Sync student progress back into teacherClasses for the teacher dashboard
      useEffect(() => {
        if (!studentName || !classCode) return;
        const code = classCode.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 6);
        setTeacherClasses(prev => prev.map(cls => {
          if (cls.classCode.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 6) !== code) return cls;
          const idx = cls.students.findIndex(s => s.name === studentName);
          if (idx === -1) return cls;
          const updated = [...cls.students];
          updated[idx] = { ...updated[idx], progress: { ...updated[idx].progress, badges: badges, quizScore: totalPoints } };
          return { ...cls, students: updated };
        }));
      }, [badges, totalPoints]);

      useEffect(() => {
        return () => {
          if (geoWatchIdRef.current !== null) {
            navigator.geolocation.clearWatch(geoWatchIdRef.current);
            geoWatchIdRef.current = null;
          }
        };
      }, []);

      useEffect(() => {
        if (currentScreen === 'animal' || currentScreen === 'observation') {
          const handleBackButton = (e) => {
            e.preventDefault();
            if (window.confirm('Leave and go back to map?')) {
              setCurrentScreen('map');
            } else {
              window.history.pushState(null, '', window.location.href);
            }
          };
          const handleEscape = (e) => {
            if (e.key === 'Escape') {
              if (window.confirm('Leave and go back to map?')) {
                setCurrentScreen('map');
              }
            }
          };
          window.history.pushState(null, '', window.location.href);
          window.addEventListener('popstate', handleBackButton);
          window.addEventListener('keydown', handleEscape);
          return () => {
            window.removeEventListener('popstate', handleBackButton);
            window.removeEventListener('keydown', handleEscape);
          };
        }
      }, [currentScreen]);

      useEffect(() => {
        if (currentScreen === 'badge' && badges.length > 0) {
          const lastBadge = badges[badges.length - 1];
          const audio = new Audio(`images/sound-${lastBadge.animalId}.mp3`);
          audio.play().catch(() => {});
        }
      }, [currentScreen]);

      // ---------- DATA ----------
      const animals = [
        {
          id: 'chimpanzee', name: 'Chimpanzee', scientificName: 'Pan troglodytes',

            { q: 'How similar is chimpanzee DNA to human DNA?',
              options: ['50%', '75%', '98-99%', '100%'],

            { q: 'What is a group of chimpanzees called?',

          ],
          observationPrompt: 'Observe the chimpanzees for 2 minutes. What behaviors did you see?',
          pointValue: 50
        },
        {
          id: 'gorilla', name: 'Western Lowland Gorilla', scientificName: 'Gorilla gorilla gorilla',
          image: 'images/gorilla.jpg', latitude: -33.8443, longitude: 151.2413,

          ],

          pointValue: 50
        },
        {

            { q: 'How many Sumatran tigers are left in the wild?',
              options: ['Over 10,000', '5,000-7,000', 'Fewer than 400', 'They are extinct'],
              correct: 2, fact: 'Estimates often place the wild population at fewer than 400.' },
            { q: 'What makes Sumatran tigers different from other tigers?',
              options: ['They are the smallest tiger subspecies', 'They are the largest', 'They can fly', 'They are herbivores'],

      ];

      // ---------- HELPERS ----------
      const calculateDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371e3;
        const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2)*Math.sin(dp/2) + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      };

      const enableLocation = () => {
        const video = document.getElementById('bgVideo');
        if (video) { video.muted = true; video.playsInline = true; video.play().catch(() => {}); }

        if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
          alert('Desktop browsers require HTTPS for location. Host this page on HTTPS (GitHub Pages/Netlify) or run locally.');
          return;
        }

        if (!('geolocation' in navigator)) { alert('Geolocation not supported.'); return; }
        if (geoWatchIdRef.current !== null) return;

        const startWatch = () => {
          geoWatchIdRef.current = navigator.geolocation.watchPosition(
            (position) => {
              setUserLocation({ latitude: position.coords.latitude, longitude: position.coords.longitude, accuracy: position.coords.accuracy });
              setLocationEnabled(true);
              if (!hasEnteredMapRef.current) {
                hasEnteredMapRef.current = true;
                setCurrentScreen(prev => (prev === 'home' ? 'map' : prev));
              }
            },
            (error) => {
              alert('Unable to get location. Please enable location services.');
              if (geoWatchIdRef.current !== null) { navigator.geolocation.clearWatch(geoWatchIdRef.current); geoWatchIdRef.current = null; }
            },
            { enableHighAccuracy: true, maximumAge: 5000 }
          );
        };

        if (navigator.permissions) {
          navigator.permissions.query({ name: 'geolocation' }).then(result => {
            if (result.state === 'denied') {
              alert('Location permission was denied. Please allow location access in your browser settings for the app to work.');
              return;
            }
            startWatch();
          });
        } else {
          startWatch();
        }
      };

      const checkAnimalProximity = (animal) => {
        if (!userLocation) return { nearby: false, distance: null };
        const distance = calculateDistance(userLocation.latitude, userLocation.longitude, animal.latitude, animal.longitude);
        return { nearby: distance <= animal.radius, distance: Math.round(distance) };
      };

      const discoverAnimal = (animal, event) => {
        if (event) event.stopPropagation();
        if (activityCompleted) return;
        if (foundAnimals.has(animal.id)) return;
        if (!checkAnimalProximity(animal).nearby) return;

        setCurrentAnimal(animal);
        setQuizAnswers({});
        setFirstAttemptResults({});
        setCurrentQuestionIndex(0);
        setShowResult(false);
        setIsCorrect(false);
        setObservation('');
        setIsProcessingAnswer(false);
        setCurrentScreen('animal');
        setTimeout(() => window.scrollTo({ top: 0, behavior: 'instant' }), 0);
      };

      const handleQuizAnswer = (questionIndex, answerIndex) => {
        if (isProcessingAnswer) return;
        setIsProcessingAnswer(true);

        const correct = answerIndex === currentAnimal.questions[questionIndex].correct;
        setIsCorrect(correct);
        setShowResult(true);

        // Lock in first-attempt result — never overwritten if already set
        setFirstAttemptResults(prev => {
          if (prev[questionIndex] !== undefined) return prev;
          return { ...prev, [questionIndex]: correct };
        });

        if (correct) {
          setQuizAnswers(prev => ({ ...prev, [questionIndex]: answerIndex }));
          const audio = new Audio('images/ding.mp3');
          audio.play().catch(() => {});
        }
      };

      const handleNextQuestion = () => {
        setIsProcessingAnswer(false);
        setShowResult(false);
        if (currentQuestionIndex < currentAnimal.questions.length - 1) {
          setCurrentQuestionIndex(i => i + 1);
        } else {
          setCurrentScreen('observation');
        }
      };

      const submitObservation = () => {
        if (activityCompleted) return;
        const wc = observation.trim().split(/\s+/).filter(Boolean).length;
        if (wc < 10) { alert(`Your observation needs at least 10 words. You have ${wc}.`); return; }

        // Quiz score = questions correct on first attempt only
        let correctCount = 0;
        const totalQuestions = currentAnimal.questions.length;
        const quizResults = currentAnimal.questions.map((q, i) => {
          const wasCorrect = firstAttemptResults[i] === true;
          if (wasCorrect) correctCount++;
          return { question: q.question, correctOnFirstAttempt: wasCorrect };
        });
        const quizPoints = correctCount * 10;

        const text = observation.trim();
        const lower = text.toLowerCase();

        const behaviorWords = ['sleeping','eating','walking','climbing','jumping','playing','sitting','running','resting','moving','looking','watching','grooming','scratching','lying','standing','hanging','swinging','chewing','drinking','hiding','stretching','yawning','sniffing','touching','holding','grabbing'];
        let behaviorCount = 0;
        behaviorWords.forEach(w => { if (lower.includes(w)) behaviorCount++; });
        const behaviorBonus = Math.min(behaviorCount * 5, 25);

        const detailWords = ['fur','color','eyes','ears','tail','paws','claws','nose','mouth','teeth','stripes','spots','pattern','size','big','small','long','short','thick','thin','soft','rough','dark','light','brown','black','white','orange','grey','gray','quietly','slowly','quickly'];
        let detailCount = 0;
        detailWords.forEach(w => { if (lower.includes(w)) detailCount++; });
        const detailBonus = Math.min(detailCount * 3, 15);

        let literacyBonus = 0;
        if (/^[A-Z]/.test(text)) literacyBonus += 3;
        if (/[.!?]$/.test(text)) literacyBonus += 2;
        if (text.split(/[.!?]+/).filter(s => s.trim().length > 0).length >= 2) literacyBonus += 3;
        const words = lower.split(/\s+/).filter(Boolean);
        if (words.length > 0 && new Set(words).size / words.length > 0.6) literacyBonus += 2;

        const totalEarned = quizPoints + 30 + behaviorBonus + detailBonus + literacyBonus + currentAnimal.pointValue;

        setTotalPoints(p => p + totalEarned);
        setFoundAnimals(prev => new Set([...prev, currentAnimal.id]));
        setBadges(prev => ([...prev, {
          animalId: currentAnimal.id, animal: currentAnimal.name, points: totalEarned,
          behaviorScore: behaviorBonus, detailScore: detailBonus, literacyScore: literacyBonus,
          quizResults: quizResults,
          observation: text,
          timestamp: new Date().toISOString()
        }]));
        setCurrentScreen('badge');
      };

      // Step 4 – Submit activity to Firestore
      const completeActivity = async () => {
        if (!studentName || !classCode) return;
        if (activityCompleted) return;
        if (!window.confirm('Submit your activity results to your teacher?\n\nYou will not be able to earn more badges after this.')) return;

        setIsSubmittingActivity(true);
        const code = normaliseCode(classCode);
        const safeStudentId = studentName.trim().replace(/[\/#\.\$\[\]]/g, "_");

        // Debug: log submission details
        console.log("📤 Submitting to Firestore:", {
          classCode: classCode,
          normalisedCode: code,
          studentName: studentName,
          safeStudentId: safeStudentId,
          database: firebase.app().options.databaseURL || "(default)"
        });

        // Sanitize badges: ensure no undefined fields, including nested quizResults
        const cleanBadges = badges.map(b => ({
          animalId: b.animalId || "",
          animal: b.animal || "",
          points: b.points || 0,
          behaviorScore: b.behaviorScore || 0,
          detailScore: b.detailScore || 0,
          literacyScore: b.literacyScore || 0,
          quizResults: (b.quizResults || []).map(qr => ({
            question: qr.question || "",
            correctOnFirstAttempt: qr.correctOnFirstAttempt === true
          })),
          observation: b.observation || "",
          timestamp: b.timestamp || ""
        }));

        try {
          await window.db.collection('classes').doc(code)
            .collection('students').doc(safeStudentId)
            .set({
              name: studentName,
              classCode: code,
              totalPoints: totalPoints,
              badges: cleanBadges,
              completed: true,
              completedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

          setActivityCompleted(true);
          setIsSubmittingActivity(false);
          setCurrentScreen('submissionComplete');
        } catch (err) {
          console.error("❌ Firestore submission error:", err);
          setIsSubmittingActivity(false);
          alert(`Submission failed: ${err.message}\n\nPlease check your connection and try again.`);
        }
      };

      if (currentScreen === 'home') {

            <video id="bgVideo" autoPlay loop muted playsInline webkit-playsinline="true" preload="metadata"
              style={{ position:'absolute', top:0, left:0, width:'100%', height:'100%', objectFit:'cover', zIndex:0 }}>
              <source src="images/background-video.mp4" type="video/mp4" />

              </div>

                <h3 style={{ color:'white', fontSize:'clamp(0.95rem, 2.5vh, 1.2rem)', marginBottom:'clamp(0.6rem, 1.5vh, 1rem)', fontWeight:600 }}>Your Adventure Awaits</h3>
                <div style={{ display:'flex', flexDirection:'column', gap:'clamp(0.5rem, 1vh, 0.8rem)', textAlign:'left', color:'rgba(255,255,255,0.9)', fontSize:'clamp(0.8rem, 2vh, 0.95rem)' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:'0.6rem' }}><span style={{ fontSize:'clamp(1.2rem, 2.5vh, 1.5rem)' }}>📍</span><span>Discover animals around the zoo</span></div>
                  <div style={{ display:'flex', alignItems:'center', gap:'0.6rem' }}><span style={{ fontSize:'clamp(1.2rem, 2.5vh, 1.5rem)' }}>📋</span><span>Answer questions & make observations</span></div>
                  <div style={{ display:'flex', alignItems:'center', gap:'0.6rem' }}><span style={{ fontSize:'clamp(1.2rem, 2.5vh, 1.5rem)' }}>🏆</span><span>Collect badges & earn points</span></div>

              </div>
              <button onClick={enableLocation} className="animate-scale-in" style={{ background:'linear-gradient(135deg, var(--sunset-orange) 0%, var(--earth-clay) 100%)', color:'white', border:'none', padding:'clamp(0.8rem, 2vh, 1rem) clamp(2rem, 5vw, 2.5rem)', fontSize:'clamp(0.95rem, 2.5vh, 1.3rem)', fontWeight:700, borderRadius:'50px', cursor:'pointer', boxShadow:'0 10px 30px rgba(232,106,51,0.4)', animationDelay:'0.6s', textTransform:'uppercase', letterSpacing:'0.1em', width:'min(90vw, 400px)' }}>

              <div className="animate-fade-in-up" style={{ display:'flex', gap:'0.75rem', marginTop:'1.2rem', animationDelay:'0.8s' }}>

                  🎒 Student Join
                </button>
                <button onClick={()=>setCurrentScreen('teacherLogin')} style={{ background:'rgba(255,255,255,0.15)', border:'1.5px solid rgba(255,255,255,0.4)', color:'white', padding:'0.55rem 1.1rem', borderRadius:'30px', cursor:'pointer', fontSize:'0.85rem', fontWeight:600, backdropFilter:'blur(6px)' }}>
                  👩‍🏫 Teacher Access
                </button>
              </div>
              
              <div onClick={()=>setCurrentScreen('adminLogin')} style={{ position:'absolute', bottom:'1rem', left:'50%', transform:'translateX(-50%)', color:'white', fontSize:'0.7rem', opacity:0.7, cursor:'pointer', transition:'opacity 0.2s' }}
                onMouseEnter={(e)=>e.currentTarget.style.opacity='1'}
                onMouseLeave={(e)=>e.currentTarget.style.opacity='0.7'}>
                Taronga Staff Portal
              </div>
            </div>
          </div>
        );
      }

      if (currentScreen === 'map') {
        return (
          <div style={{ minHeight:'100vh', background:'var(--mist-light)' }}>
            <div style={{ background:'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)', padding:'1.5rem 1rem', boxShadow:'0 4px 20px rgba(0,0,0,0.1)', position:'sticky', top:0, zIndex:100 }}>
              <div className="student-banner-mobile" style={{ maxWidth:'1400px', margin:'0 auto', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div className="logo-title-block" style={{ display:'flex', alignItems:'center', gap:'1rem' }}>
                  <img src="images/logo.png" alt="Taronga Tracka" style={{ height:'90px', width:'auto' }} onError={(e)=>{ e.target.style.display='none'; }} />
                  <div>
                    <h1 className="heading-display" style={{ fontSize:'clamp(1.8rem, 4vw, 2.5rem)', color:'white', marginBottom:'0.3rem' }}>DISCOVER ANIMALS</h1>
                    <p className="serif-accent" style={{ color:'var(--safari-gold)', fontSize:'1rem' }}>Get within range to unlock</p>
                  </div>
                </div>
                {studentName && (
                  <div className="student-name-pill" style={{ background:'rgba(255,255,255,0.15)', border:'1px solid rgba(255,255,255,0.3)', borderRadius:'20px', padding:'0.4rem 0.85rem', backdropFilter:'blur(6px)' }}>
                    <span style={{ color:'white', fontSize:'0.82rem', fontWeight:600 }}>👋 {studentName}</span>
                  </div>
                )}
                {studentName && classCode && (
                  <button className="submit-btn" onClick={completeActivity} disabled={activityCompleted || isSubmittingActivity}
                    style={{ background: activityCompleted ? 'rgba(46,125,85,0.5)' : 'linear-gradient(135deg, var(--sunset-orange), var(--earth-clay))', border: activityCompleted ? '1px solid rgba(255,255,255,0.3)' : 'none', color:'white', padding:'0.55rem 1rem', borderRadius:'30px', cursor: activityCompleted || isSubmittingActivity ? 'not-allowed' : 'pointer', fontSize:'0.82rem', fontWeight:700, opacity: activityCompleted || isSubmittingActivity ? 0.6 : 1, textTransform:'uppercase', letterSpacing:'0.06em', whiteSpace:'nowrap', boxShadow: activityCompleted ? 'none' : '0 4px 12px rgba(232,106,51,0.4)', transition:'all 0.2s' }}>
                    {activityCompleted ? '✓ Submitted' : isSubmittingActivity ? '⏳ Submitting…' : '📤 Complete Activity'}
                  </button>
                )}
                <button className="points-card" onClick={()=>setCurrentScreen('collection')} style={{ background:'rgba(255,255,255,0.2)', border:'2px solid rgba(255,255,255,0.4)', color:'white', padding:'0.8rem', borderRadius:'16px', cursor:'pointer', textAlign:'right' }}>
                  <div style={{ fontSize:'2rem', color:'var(--safari-gold)', fontWeight:700, marginBottom:'0.2rem' }}>{totalPoints}</div>
                  <div style={{ color:'rgba(255,255,255,0.9)', fontSize:'0.85rem', fontWeight:600 }}>🏆 {foundAnimals.size}/{animals.length} Badges</div>
                </button>
              </div>
            </div>
            <div style={{ maxWidth:'1400px', margin:'0 auto', padding:'2rem 1rem' }}>
              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(300px, 1fr))', gap:'1.5rem' }}>
                {animals.map(animal=>({...animal,...checkAnimalProximity(animal)}))
                  .sort((a,b)=>{
                    if(foundAnimals.has(a.id)&&!foundAnimals.has(b.id)) return 1;
                    if(!foundAnimals.has(a.id)&&foundAnimals.has(b.id)) return -1;
                    if(a.distance===null) return 1; if(b.distance===null) return -1;
                    return a.distance-b.distance;
                  })
                  .map((animal,index)=>{
                    const {nearby,distance}=animal;
                    const alreadyFound=foundAnimals.has(animal.id);
                    return (
                      <div key={animal.id} onClick={(e)=>{if(!alreadyFound)discoverAnimal(animal,e);}} className="animate-fade-in-up"
                        style={{ position:'relative', height:'400px', borderRadius:'16px', overflow:'hidden', cursor:alreadyFound?'default':'pointer', boxShadow:'0 8px 24px rgba(0,0,0,0.12)', transition:'all 0.4s ease', animationDelay:`${index*0.1}s`, transform:nearby&&!alreadyFound?'scale(1.03)':'scale(1)' }}
                        onMouseEnter={(e)=>{ if(!alreadyFound){e.currentTarget.style.transform='translateY(-8px)';e.currentTarget.style.boxShadow='0 16px 40px rgba(0,0,0,0.2)';} }}
                        onMouseLeave={(e)=>{ e.currentTarget.style.transform=nearby&&!alreadyFound?'scale(1.03)':'scale(1)'; e.currentTarget.style.boxShadow='0 8px 24px rgba(0,0,0,0.12)'; }}>
                        <div style={{ position:'absolute', inset:0, backgroundImage:`url(${animal.image})`, backgroundSize:'cover', backgroundPosition:'center', filter:alreadyFound?'grayscale(50%)':'none', opacity:alreadyFound?0.6:1 }} />
                        <div style={{ position:'absolute', inset:0, background:'linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.7) 100%)' }} />
                        <div style={{ position:'absolute', bottom:0, left:0, right:0, padding:'2rem', color:'white', zIndex:10 }}>
                          <h3 className="heading-display" style={{ fontSize:'2rem', marginBottom:'0.3rem', textShadow:'0 2px 8px rgba(0,0,0,0.3)' }}>{animal.name}</h3>
                          <p className="serif-accent" style={{ fontSize:'1rem', opacity:0.9, marginBottom:'1rem' }}>{animal.scientificName}</p>
                          {alreadyFound ? (
                            <div style={{ display:'inline-block', background:'rgba(46,125,85,0.9)', backdropFilter:'blur(10px)', padding:'0.6rem 1.5rem', borderRadius:'30px', fontWeight:600, fontSize:'0.95rem', border:'2px solid rgba(255,255,255,0.3)' }}>✓ Discovered</div>
                          ) : nearby ? (
                            <div style={{ display:'inline-block', background:'linear-gradient(135deg, var(--sunset-orange), var(--earth-clay))', padding:'0.8rem 2rem', borderRadius:'30px', fontWeight:700, fontSize:'1rem', animation:'pulse 2s infinite', textTransform:'uppercase', letterSpacing:'0.08em', boxShadow:'0 4px 15px rgba(232,106,51,0.5)' }}>📍 Tap to Discover</div>
                          ) : distance !== null ? (
                            <div style={{ display:'inline-block', background:'rgba(74,159,216,0.2)', backdropFilter:'blur(10px)', padding:'0.6rem 1.5rem', borderRadius:'30px', fontWeight:600, fontSize:'0.95rem', border:'1px solid rgba(255,255,255,0.3)' }}>{distance}m away</div>
                          ) : (
                            <div style={{ display:'inline-block', background:'rgba(139,90,60,0.3)', backdropFilter:'blur(10px)', padding:'0.6rem 1.5rem', borderRadius:'30px', fontWeight:600, fontSize:'0.95rem', border:'1px solid rgba(255,255,255,0.3)' }}>🔒 Locked</div>
                          )}
                        </div>
                        {nearby&&!alreadyFound&&(<div style={{ position:'absolute', inset:0, border:'4px solid var(--sunset-orange)', borderRadius:'16px', animation:'pulse 2s infinite', pointerEvents:'none' }} />)}
                      </div>
                    );
                  })}
              </div>
            </div>
          </div>
        );
      }

      if (currentScreen === 'animal' && currentAnimal) {
        const currentQuestion = currentAnimal.questions[currentQuestionIndex];
        return (
          <div style={{ position:'fixed', inset:0, overflow:'hidden', background:showResult?(isCorrect?'linear-gradient(135deg, #10b981 0%, #059669 100%)':'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)'):'var(--mist-light)', transition:'background 0.5s ease', display:'flex', flexDirection:'column' }}>
            {showResult&&isCorrect&&(
              <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:1000 }}>
                {[...Array(50)].map((_,i)=>(<div key={i} style={{ position:'absolute', left:`${Math.random()*100}%`, top:'-20px', width:'10px', height:'10px', background:['#FFD700','#FF6B6B','#4ECDC4','#45B7D1','#FFA07A'][Math.floor(Math.random()*5)], animation:`fall ${2+Math.random()*2}s linear forwards`, animationDelay:`${Math.random()*0.5}s` }} />))}
              </div>
            )}
            <div style={{ background:'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)', padding:'0.6rem 1rem', boxShadow:'0 4px 20px rgba(0,0,0,0.1)', flex:'0 0 auto', zIndex:100 }}>
              <div style={{ maxWidth:'900px', margin:'0 auto', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <button onClick={(e)=>{ e.preventDefault(); e.stopPropagation(); if(showResult)return; if(window.confirm('Leave this question and go back to the map?'))setCurrentScreen('map'); }} disabled={showResult}
                  style={{ background:showResult?'rgba(255,255,255,0.1)':'rgba(255,255,255,0.2)', border:'none', color:'white', padding:'0.5rem 1rem', borderRadius:'20px', cursor:showResult?'not-allowed':'pointer', fontSize:'0.85rem', fontWeight:600, opacity:showResult?0.5:1 }}>← Back</button>
                <img src="images/logo.png" alt="Taronga Tracka" style={{ height:'45px', width:'auto' }} onError={(e)=>{ e.target.style.display='none'; }} />
                <div style={{ width:'70px' }} />
              </div>
            </div>
            <div style={{ width:'100%', height:'15vh', minHeight:'100px', maxHeight:'140px', backgroundImage:`url(${currentAnimal.image})`, backgroundSize:'cover', backgroundPosition:'center', position:'relative', flex:'0 0 auto' }}>
              <div style={{ position:'absolute', bottom:0, left:0, right:0, background:'linear-gradient(180deg, transparent 0%, rgba(10,47,31,0.95) 100%)', padding:'0.8rem 1rem 0.5rem' }}>
                <div style={{ maxWidth:'900px', margin:'0 auto', textAlign:'center' }}>
                  <h1 className="heading-display" style={{ fontSize:'clamp(1.3rem, 3.5vh, 1.8rem)', color:'white', marginBottom:'0.2rem', lineHeight:1.1 }}>{currentAnimal.name}</h1>
                  <p className="serif-accent" style={{ fontSize:'clamp(0.8rem, 2vh, 1rem)', color:'var(--safari-gold)' }}>{currentAnimal.scientificName}</p>
                </div>
              </div>
            </div>
            <div style={{ flex:'1 1 auto', overflowY:'auto', overflowX:'hidden', display:'flex', flexDirection:'column', padding:'clamp(0.5rem, 2vw, 1rem)', maxWidth:'900px', margin:'0 auto', width:'100%', WebkitOverflowScrolling:'touch' }}>
              <div style={{ textAlign:'center', marginBottom:'clamp(0.5rem, 1.5vh, 0.8rem)' }}>
                <p style={{ fontSize:'clamp(0.75rem, 1.8vh, 0.9rem)', color:showResult?'white':'var(--jungle-mid)', fontWeight:600 }}>Question {currentQuestionIndex+1} of {currentAnimal.questions.length}</p>
                {!showResult&&(<p style={{ fontSize:'clamp(0.7rem, 1.6vh, 0.85rem)', color:'var(--sunset-orange)', fontWeight:600, marginTop:'0.3rem', fontStyle:'italic' }}>💡 Read the signs for clues!</p>)}
              </div>
              {showResult&&(
                <div className="animate-scale-in" style={{ textAlign:'center', padding:'clamp(1.5rem, 3vh, 2rem)', background:'rgba(255,255,255,0.95)', borderRadius:'20px', boxShadow:'0 8px 32px rgba(0,0,0,0.2)', margin:'clamp(1rem, 2vh, 1.5rem)', maxWidth:'90%', marginLeft:'auto', marginRight:'auto' }}>
                  <div style={{ fontSize:'clamp(3rem, 8vh, 4.5rem)', marginBottom:'0.5rem' }}>{isCorrect?'🎉':'❌'}</div>
                  <h2 className="heading-display" style={{ fontSize:'clamp(2rem, 5vh, 3rem)', color:isCorrect?'#10b981':'#ef4444', marginBottom:'0.8rem', lineHeight:1.1 }}>{isCorrect?'CORRECT!':'TRY AGAIN'}</h2>

      if (currentScreen === 'observation' && currentAnimal) {

        return (
          <div style={{ minHeight:'100vh', background:'var(--mist-light)', paddingBottom:'4rem' }}>
            <div style={{ background:'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)', padding:'1rem', boxShadow:'0 4px 20px rgba(0,0,0,0.1)' }}>
              <div style={{ maxWidth:'900px', margin:'0 auto', display:'flex', justifyContent:'center', alignItems:'center' }}>
                <img src="images/logo.png" alt="Taronga Tracka" style={{ height:'60px', width:'auto' }} onError={(e)=>{ e.target.style.display='none'; }} />
              </div>
            </div>
            <div style={{ maxWidth:'900px', margin:'0 auto', padding:'3rem 2rem' }}>
              <div style={{ background:'white', borderRadius:'20px', padding:'2.5rem', boxShadow:'0 8px 32px rgba(0,0,0,0.1)' }}>
                <h2 className="heading-display" style={{ fontSize:'2.5rem', color:'var(--jungle-deep)', marginBottom:'1rem', textAlign:'center' }}>Your Observations</h2>
                <p style={{ color:'#666', marginBottom:'1.2rem', lineHeight:1.6, fontSize:'1.1rem', textAlign:'center' }}>{currentAnimal.observationPrompt}</p>

                </div>
                <textarea value={observation} onChange={(e)=>setObservation(e.target.value)} placeholder="Describe what you observe in detail..."

                <div style={{ marginTop:'1rem', fontSize:'1rem', color:wordCount>=10?'var(--jungle-light)':'#E86A33', fontWeight:600 }}>{wordCount}/10 words {wordCount>=10?'✓':''}</div>

      if (currentScreen === 'collection') {

            <div className="collection-header-mobile" style={{ maxWidth:'900px', margin:'0 auto 2rem', display:'flex', justifyContent:'space-between', alignItems:'center', padding:'1rem' }}>
              <button className="back-btn" onClick={()=>setCurrentScreen('map')} style={{ background:'rgba(255,255,255,0.2)', border:'none', color:'white', padding:'0.6rem 1.2rem', borderRadius:'20px', cursor:'pointer', fontSize:'0.9rem', fontWeight:600 }}>← Back</button>
              <h1 className="heading-display" style={{ fontSize:'clamp(1.8rem, 4vw, 2.5rem)', color:'white' }}>BADGE COLLECTION</h1>
              {studentName && classCode ? (
                <button className="submit-btn" onClick={completeActivity} disabled={activityCompleted || isSubmittingActivity}
                  style={{ background: activityCompleted ? 'rgba(46,125,85,0.5)' : 'linear-gradient(135deg, var(--sunset-orange), var(--earth-clay))', border: activityCompleted ? '1px solid rgba(255,255,255,0.3)' : 'none', color:'white', padding:'0.55rem 1rem', borderRadius:'30px', cursor: activityCompleted || isSubmittingActivity ? 'not-allowed' : 'pointer', fontSize:'0.82rem', fontWeight:700, opacity: activityCompleted || isSubmittingActivity ? 0.6 : 1, textTransform:'uppercase', letterSpacing:'0.06em', whiteSpace:'nowrap', boxShadow: activityCompleted ? 'none' : '0 4px 12px rgba(232,106,51,0.4)', transition:'all 0.2s' }}>
                  {activityCompleted ? '✓ Submitted' : isSubmittingActivity ? '⏳ Submitting…' : '📤 Complete Activity'}

            </div>

                const earned=foundAnimals.has(animal.id);
                const badge=badges.find(b=>b.animalId===animal.id);
                return (
                  <div key={animal.id} style={{ background:earned?'white':'rgba(255,255,255,0.1)', borderRadius:'16px', padding:'1.5rem', textAlign:'center', opacity:earned?1:0.4, boxShadow:earned?'0 8px 24px rgba(0,0,0,0.2)':'none' }}>

                      <div>
                        <p style={{ fontSize:'1.5rem', fontWeight:700, color:'var(--sunset-orange)', marginBottom:'0.3rem' }}>{badge.points} pts</p>

            </div>
          </div>

              <div style={{ background:'linear-gradient(135deg, #FFF9E6 0%, #FFE6B3 100%)', borderRadius:'16px', padding:'clamp(1rem, 2vh, 1.5rem)', marginBottom:'clamp(0.8rem, 1.5vh, 1rem)' }}>
                <div style={{ fontSize:'clamp(2rem, 5vh, 3rem)', fontWeight:700, color:'var(--earth-clay)', marginBottom:'0.3rem' }}>+{lastBadge.points}</div>

              </div>
              <div style={{ background:'#F5F3EE', borderRadius:'16px', padding:'clamp(1rem, 2vh, 1.5rem)', marginBottom:'clamp(0.8rem, 1.5vh, 1rem)' }}>

                <div style={{ fontSize:'clamp(1.3rem, 2.8vh, 1.8rem)', fontWeight:700, color:'var(--jungle-deep)', marginBottom:'0.3rem' }}>{foundAnimals.size}/{animals.length} Animals</div>
                <div style={{ fontSize:'clamp(1.2rem, 2.5vh, 1.5rem)', fontWeight:700, color:'var(--sunset-orange)' }}>⭐ {totalPoints} Points</div>
              </div>
              <button onClick={()=>setCurrentScreen('map')} style={{ background:'linear-gradient(135deg, var(--sunset-orange), var(--earth-clay))', color:'white', border:'none', padding:'clamp(0.8rem, 1.5vh, 1rem) 2rem', fontSize:'clamp(1rem, 2vh, 1.2rem)', fontWeight:700, borderRadius:'50px', cursor:'pointer', textTransform:'uppercase' }}>Continue Exploring</button>
            </div>
          </div>
        );
      }

      if (currentScreen === 'submissionComplete') {
        return (
          <div style={{ position:'fixed', inset:0, background:'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 50%, var(--jungle-light) 100%)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'clamp(1rem, 5vw, 2rem)', overflow:'hidden' }}>
            <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:0 }}>
              {[...Array(60)].map((_,i)=>(<div key={i} style={{ position:'absolute', left:`${Math.random()*100}%`, top:'-20px', width:`${6+Math.random()*8}px`, height:`${6+Math.random()*8}px`, borderRadius: Math.random()>0.5 ? '50%' : '2px', background:['#FFD700','#FF6B6B','#4ECDC4','#45B7D1','#FFA07A','#A78BFA','#34D399'][Math.floor(Math.random()*7)], animation:`fall ${2.5+Math.random()*2.5}s linear forwards`, animationDelay:`${Math.random()*1.2}s` }} />))}
            </div>

            <div className="animate-scale-in" style={{ position:'relative', zIndex:10, background:'white', borderRadius:'28px', padding:'clamp(1.8rem, 5vh, 2.8rem)', maxWidth:'480px', width:'100%', textAlign:'center', boxShadow:'0 24px 64px rgba(0,0,0,0.35)' }}>
              <div style={{ width:'80px', height:'80px', borderRadius:'50%', background:'linear-gradient(135deg, var(--jungle-mid), var(--jungle-light))', margin:'0 auto 1.2rem', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'2.4rem', boxShadow:'0 6px 20px rgba(26,82,56,0.4)' }}>✓</div>

              <h1 className="heading-display" style={{ fontSize:'clamp(1.9rem, 5vh, 2.6rem)', color:'var(--jungle-deep)', marginBottom:'0.2rem', lineHeight:1.1 }}>SUBMISSION COMPLETE</h1>
              <p className="serif-accent" style={{ color:'var(--jungle-light)', fontSize:'clamp(0.95rem, 2.2vh, 1.15rem)', marginBottom:'1.4rem' }}>Your results have been saved</p>

              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'0.7rem', marginBottom:'1.4rem' }}>
                {[
                  { label:'Points', value: totalPoints, icon:'⭐', color:'var(--sunset-orange)' },
                  { label:'Badges', value: badges.length, icon:'🏆', color:'var(--earth-clay)' },
                  { label:'Animals', value:`${foundAnimals.size}/${animals.length}`, icon:'🐾', color:'var(--jungle-mid)' }
                ].map(s => (
                  <div key={s.label} style={{ background:'#F5F3EE', borderRadius:'14px', padding:'0.8rem 0.4rem' }}>
                    <div style={{ fontSize:'1.3rem', marginBottom:'0.15rem' }}>{s.icon}</div>
                    <div style={{ fontWeight:700, color:s.color, fontSize:'1.2rem', lineHeight:1.2 }}>{s.value}</div>
                    <div style={{ color:'#999', fontSize:'0.68rem', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.04em' }}>{s.label}</div>

                <div style={{ display:'flex', justifyContent:'center', gap:'0.5rem', flexWrap:'wrap', marginBottom:'1.4rem' }}>
                  {badges.map((b, i) => (
                    <div key={i} style={{ width:'48px', height:'48px', borderRadius:'10px', backgroundImage:`url(images/badge-${b.animalId}.png)`, backgroundSize:'cover', backgroundPosition:'center', boxShadow:'0 2px 8px rgba(0,0,0,0.15)', border:'2px solid white' }} />
                  ))}
                </div>
              )}

              <div style={{ background:'#F0FDF4', border:'1px solid #BBF7D0', borderRadius:'12px', padding:'0.6rem 1rem', marginBottom:'1.4rem', display:'inline-block' }}>
                <p style={{ color:'#16A34A', fontSize:'0.8rem', fontWeight:600 }}>✓ Saved to class <span style={{ fontFamily:'monospace', letterSpacing:'0.1em' }}>{normaliseCode(classCode)}</span> · {studentName}</p>
              </div>

              <div>
                <button onClick={()=>setCurrentScreen('map')} style={{ background:'linear-gradient(135deg, var(--jungle-mid), var(--jungle-light))', color:'white', border:'none', padding:'0.85rem 2.5rem', fontSize:'1.05rem', fontWeight:700, borderRadius:'50px', cursor:'pointer', textTransform:'uppercase', letterSpacing:'0.08em', boxShadow:'0 6px 18px rgba(26,82,56,0.4)' }}>
                  Done
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ---------- STEP 1 SCREENS ----------

      if (currentScreen === 'studentJoin') {
        const handleJoin = async () => {
          if (!classCode.trim() || !studentName.trim()) return;
          const code = normaliseCode(classCode);
          if (code.length !== 6) { setStudentJoinError('Code not found — check with your teacher.'); return; }
          try {
            const doc = await window.db.collection('classes').doc(code).get();
            if (!doc.exists) { setStudentJoinError('Code not found — check with your teacher.'); return; }
          } catch (err) {
            console.error('Firestore join check failed:', err);
            setStudentJoinError('Could not verify code — please try again.');
            return;
          }
          // Class exists in Firestore — record student locally for dashboard card count
          const classIndex = teacherClasses.findIndex(c => normaliseCode(c.classCode) === code);
          if (classIndex !== -1) {
            const updatedClasses = [...teacherClasses];
            const cls = updatedClasses[classIndex];
            if (!cls.students.some(s => s.name === studentName)) {
              cls.students.push({ name: studentName, joinedAt: new Date().toISOString(), progress: { badges: [], quizScore: 0, observations: [] } });
            }
            setTeacherClasses(updatedClasses);
          }
          localStorage.setItem('tarongaStudentName', JSON.stringify(studentName));
          localStorage.setItem('tarongaClassCode', JSON.stringify(code));
          setStudentJoinError('');
          enableLocation();
          setCurrentScreen('map');
        };
        return (
          <div style={{ position:'fixed', inset:0, background:'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)', display:'flex', alignItems:'center', justifyContent:'center', padding:'clamp(1rem, 5vw, 2rem)', overflow:'auto' }}>
            <div className="animate-scale-in" style={{ background:'white', borderRadius:'24px', padding:'clamp(1.5rem, 4vh, 2.5rem)', maxWidth:'420px', width:'100%', boxShadow:'0 20px 60px rgba(0,0,0,0.3)' }}>
              <div style={{ textAlign:'center', marginBottom:'1.5rem' }}>
                <div style={{ fontSize:'2.8rem', marginBottom:'0.4rem' }}>🎒</div>
                <h2 className="heading-display" style={{ fontSize:'clamp(1.6rem, 4vh, 2rem)', color:'var(--jungle-deep)', marginBottom:'0.3rem' }}>Student Join</h2>
                <p style={{ color:'#666', fontSize:'0.9rem' }}>Enter your class code and first name to join</p>
              </div>
              <label style={{ display:'block', fontSize:'0.82rem', fontWeight:600, color:'var(--jungle-deep)', marginBottom:'0.35rem' }}>Class Code</label>

                style={{ width:'100%', padding:'0.75rem 1rem', borderRadius:'12px', border:`2px solid ${studentJoinError ? '#ef4444' : lookedUpClass ? '#22c55e' : '#E5E5E5'}`, fontSize:'1.15rem', fontFamily:'monospace', fontWeight:700, marginBottom: lookedUpClass || studentJoinError ? '0.4rem' : '1rem', boxSizing:'border-box', transition:'border-color 0.2s', letterSpacing:'0.2em', textAlign:'center' }}
                onFocus={(e)=>{ if(!studentJoinError && !lookedUpClass) e.target.style.borderColor='var(--jungle-mid)'; }} onBlur={(e)=>{ if(!studentJoinError && !lookedUpClass) e.target.style.borderColor='#E5E5E5'; }} />
              {studentJoinError && (
                <div style={{ background:'#FEF2F2', border:'1px solid #FECACA', borderRadius:'10px', padding:'0.55rem 0.75rem', marginBottom:'0.8rem' }}>
                  <p style={{ color:'#DC2626', fontSize:'0.8rem', fontWeight:600 }}>⚠️ {studentJoinError}</p>
                </div>
              )}
              {lookedUpClass && !studentJoinError && (
                <div style={{ background:'#F0FDF4', border:'1px solid #BBF7D0', borderRadius:'10px', padding:'0.55rem 0.75rem', marginBottom:'0.8rem' }}>
                  <p style={{ color:'#16A34A', fontSize:'0.8rem', fontWeight:600 }}>✓ {lookedUpClass.className} — {lookedUpClass.yearGroup}</p>
                </div>
              )}
              <label style={{ display:'block', fontSize:'0.82rem', fontWeight:600, color:'var(--jungle-deep)', marginBottom:'0.35rem' }}>First Name</label>
              <input type="text" value={studentName} onChange={(e)=>setStudentName(e.target.value)} placeholder="e.g. Alex"
                style={{ width:'100%', padding:'0.75rem 1rem', borderRadius:'12px', border:'2px solid #E5E5E5', fontSize:'1rem', fontFamily:'DM Sans, sans-serif', marginBottom:'1.5rem', boxSizing:'border-box', transition:'border-color 0.2s' }}
                onFocus={(e)=>e.target.style.borderColor='var(--jungle-mid)'} onBlur={(e)=>e.target.style.borderColor='#E5E5E5'} />
              <button onClick={handleJoin} disabled={!classCode.trim() || !studentName.trim()}
                style={{ width:'100%', padding:'0.85rem', borderRadius:'50px', border:'none', background:classCode.trim()&&studentName.trim()?'linear-gradient(135deg, var(--sunset-orange), var(--earth-clay))':'#CCC', color:'white', fontSize:'1.05rem', fontWeight:700, cursor:classCode.trim()&&studentName.trim()?'pointer':'not-allowed', textTransform:'uppercase', letterSpacing:'0.08em', transition:'all 0.3s ease' }}>
                Join
              </button>
              <button onClick={()=>{ setStudentJoinError(''); setCurrentScreen('home'); }} style={{ display:'block', width:'100%', background:'none', border:'none', color:'#999', fontSize:'0.82rem', cursor:'pointer', marginTop:'1rem', padding:'0.4rem' }}>← Back</button>
            </div>
          </div>
        );
      }

      if (currentScreen === 'adminLogin') {
        const handleAdminLogin = async () => {
          const code = adminAccessCode.trim().toLowerCase();
          if (!code) return;
          
          try {
            const doc = await window.db.collection('adminAccess').doc(code).get();
            if (doc.exists && doc.data().active === true) {
              setCurrentScreen('adminDashboard');
            } else {
              alert('Invalid or inactive access code');
            }
          } catch (err) {
            console.error('Admin login error:', err);
            alert('Failed to verify access code. Please try again.');
          }
        };

        return (
          <div style={{ position:'fixed', inset:0, background:'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)', display:'flex', alignItems:'center', justifyContent:'center', padding:'clamp(1rem, 5vw, 2rem)', overflow:'auto' }}>
            <div className="animate-scale-in" style={{ background:'white', borderRadius:'24px', padding:'clamp(1.5rem, 4vh, 2.5rem)', maxWidth:'420px', width:'100%', boxShadow:'0 20px 60px rgba(0,0,0,0.3)' }}>
              <div style={{ textAlign:'center', marginBottom:'1.5rem' }}>
                <div style={{ fontSize:'2.8rem', marginBottom:'0.4rem' }}>🔐</div>
                <h2 className="heading-display" style={{ fontSize:'clamp(1.6rem, 4vh, 2rem)', color:'var(--jungle-deep)', marginBottom:'0.3rem' }}>Taronga Staff Portal</h2>

                          <div>
                            <p style={{ fontWeight:700, color:'var(--jungle-deep)', fontSize:'0.95rem', marginBottom:'0.15rem' }}>{cls.className}</p>
                            <p style={{ color:'#888', fontSize:'0.78rem' }}>{cls.yearGroup} · {cls.students.length} student{cls.students.length !== 1 ? 's' : ''}</p>
                          </div>
                          <div style={{ display:'flex', alignItems:'center', gap:'0.75rem' }}>
                            <div style={{ textAlign:'right' }}>
                              <p style={{ fontFamily:'monospace', fontWeight:700, fontSize:'0.9rem', color:'var(--jungle-mid)', letterSpacing:'0.05em', marginBottom:'0.15rem' }}>{cls.classCode}</p>
                              <p style={{ color:'#aaa', fontSize:'0.7rem' }}>class code</p>
                            </div>
                            <span style={{ color:'var(--jungle-mid)', fontSize:'1.1rem', fontWeight:700 }}>›</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <button onClick={()=>setCurrentScreen('home')} style={{ display:'block', width:'100%', background:'none', border:'none', color:'#999', fontSize:'0.82rem', cursor:'pointer', marginTop:'1.8rem', padding:'0.4rem' }}>← Back to Home</button>
              </div>
            </div>
          </div>
        );
      }

      if (currentScreen === 'classDetails' && selectedClass) {
        const cls = teacherClasses.find(c => c.classCode === selectedClass);
        if (!cls) { setCurrentScreen('teacherDashboard'); return null; }

        // All student data now comes from Firestore via the live listener
        const totalStudents = firestoreStudents.length;
        const avgPoints = totalStudents > 0 ? Math.round(firestoreStudents.reduce((sum, s) => sum + (s.totalPoints || 0), 0) / totalStudents) : 0;
        const totalBadges = firestoreStudents.reduce((sum, s) => sum + (s.badges ? s.badges.length : 0), 0);
        const completedCount = firestoreStudents.filter(s => s.completed).length;

        const downloadCSV = () => {
          const header = ['Name','Points','Badges Earned','Quiz Score','Completed','Last Active','Observations'];
          const rows = firestoreStudents.map(s => {
            const lastBadge = s.badges && s.badges.length > 0 ? s.badges[s.badges.length - 1] : null;
            // Quiz score: aggregate first-attempt correctness across all badges
            let totalQ = 0, correctQ = 0;
            (s.badges || []).forEach(b => {
              if (b.quizResults) {
                b.quizResults.forEach(r => { totalQ++; if (r.correctOnFirstAttempt) correctQ++; });
              }
            });
            const quizScoreStr = totalQ > 0 ? `${Math.round((correctQ / totalQ) * 100)}%` : '—';
            // Observations: one label per animal
            const obsStr = (s.badges || [])
              .filter(b => b.observation)
              .map(b => `${b.animal}: ${b.observation}`)
              .join(' | ');
            return [
              s.name,
              s.totalPoints || 0,
              s.badges ? s.badges.length : 0,
              quizScoreStr,
              s.completed ? 'Yes' : 'No',
              s.completedAt ? s.completedAt.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : (lastBadge && lastBadge.timestamp ? new Date(lastBadge.timestamp).toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : '—'),
              obsStr || '—'
            ];
          });
          const csv = [header, ...rows].map(row => row.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
          const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `${cls.className}-${cls.classCode}-results.csv`; a.click();
          URL.revokeObjectURL(url);
        };

        const resetClass = async () => {
          if (!window.confirm(`Reset all student data for ${cls.className}? This cannot be undone.`)) return;
          try {
            const snapshot = await window.db.collection('classes').doc(selectedClass).collection('students').get();
            const batch = window.db.batch();
            snapshot.docs.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
          } catch (err) {
            alert('Failed to reset class data. Please check your connection.');
          }
        };

        const archiveClass = async () => {
          if (!window.confirm(`Archive ${cls.className}? It will be hidden from your active classes.`)) return;
          try {
            await window.db.collection('teachers').doc(teacherEmail)
              .collection('classes').doc(selectedClass)
              .update({ archived: true });
            setCurrentScreen('teacherDashboard');
          } catch (err) {
            console.error('Failed to archive class:', err);
            alert('Failed to archive class. Please try again.');
          }
        };

        return (
          <>
          <div style={{ position:'fixed', inset:0, background:'var(--mist-light)', display:'flex', flexDirection:'column' }}>
            <div style={{ background:'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)', padding:'1rem 1.5rem', boxShadow:'0 4px 20px rgba(0,0,0,0.1)', flexShrink:0 }}>
              <div style={{ maxWidth:'720px', margin:'0 auto', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div style={{ display:'flex', alignItems:'center', gap:'0.7rem' }}>
                  <button onClick={()=>setCurrentScreen('teacherDashboard')} style={{ background:'rgba(255,255,255,0.15)', border:'1px solid rgba(255,255,255,0.3)', color:'white', width:'34px', height:'34px', borderRadius:'50%', cursor:'pointer', fontSize:'1.1rem', display:'flex', alignItems:'center', justifyContent:'center' }}>←</button>
                  <div>
                    <h1 className="heading-display" style={{ fontSize:'clamp(1.1rem, 2.8vw, 1.45rem)', color:'white', lineHeight:1.2 }}>{cls.className}</h1>
                    <p style={{ color:'rgba(255,255,255,0.7)', fontSize:'0.75rem' }}>{cls.yearGroup} · Code: <span style={{ fontFamily:'monospace', fontWeight:700 }}>{cls.classCode}</span></p>
                  </div>
                </div>
                <div style={{ display:'flex', alignItems:'center', gap:'0.5rem' }}>
                  {!firestoreLoading && (
                    <div style={{ display:'flex', alignItems:'center', gap:'0.3rem', background:'rgba(46,125,85,0.3)', border:'1px solid rgba(46,125,85,0.5)', borderRadius:'14px', padding:'0.25rem 0.55rem' }}>
                      <div style={{ width:'7px', height:'7px', borderRadius:'50%', background:'#34d399', boxShadow:'0 0 6px rgba(52,211,153,0.6)' }} />
                      <span style={{ color:'#34d399', fontSize:'0.68rem', fontWeight:600 }}>LIVE</span>
                    </div>
                  )}
                  <button onClick={downloadCSV} disabled={firestoreLoading} style={{ background:'rgba(255,255,255,0.18)', border:'1px solid rgba(255,255,255,0.35)', color:'white', padding:'0.45rem 0.85rem', borderRadius:'20px', cursor:firestoreLoading?'not-allowed':'pointer', fontSize:'0.78rem', fontWeight:600, display:'flex', alignItems:'center', gap:'0.35rem', opacity:firestoreLoading?0.5:1 }}>
                    ⬇ CSV
                  </button>
                </div>
              </div>
            </div>

            {firestoreLoading ? (
              <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'1rem' }}>
                <div style={{ width:'40px', height:'40px', border:'3px solid rgba(26,82,56,0.15)', borderTop:'3px solid var(--jungle-mid)', borderRadius:'50%', animation:'spin 0.7s linear infinite' }} />
                <p style={{ color:'#888', fontSize:'0.85rem' }}>Fetching student data…</p>
              </div>
            ) : (
              <>
                <div style={{ flexShrink:0, padding:'1rem 1.5rem 0' }}>
                  <div style={{ maxWidth:'720px', margin:'0 auto', display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:'0.7rem' }}>
                    {[
                      { label:'Students', value:totalStudents, icon:'👥' },
                      { label:'Avg Points', value:avgPoints, icon:'⭐' },
                      { label:'Total Badges', value:totalBadges, icon:'🏆' },
                      { label:'Completed', value:completedCount, icon:'✓' }
                    ].map(stat => (
                      <div key={stat.label} style={{ background:'white', borderRadius:'12px', padding:'0.7rem 0.5rem', textAlign:'center', boxShadow:'0 2px 8px rgba(0,0,0,0.06)' }}>
                        <div style={{ fontSize:'1.3rem', marginBottom:'0.15rem' }}>{stat.icon}</div>
                        <div style={{ fontWeight:700, color:'var(--jungle-deep)', fontSize:'1.1rem', lineHeight:1.2 }}>{stat.value}</div>
                        <div style={{ color:'#999', fontSize:'0.68rem', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.04em' }}>{stat.label}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div style={{ flex:1, overflowY:'auto', padding:'1rem 1.5rem 1.5rem' }}>
                  <div style={{ maxWidth:'720px', margin:'0 auto' }}>
                    <div style={{ background:'white', borderRadius:'16px', boxShadow:'0 4px 16px rgba(0,0,0,0.07)', overflow:'hidden' }}>
                      <div style={{ display:'grid', gridTemplateColumns:'1.4fr 0.6fr 0.6fr 0.6fr 0.85fr 0.85fr', background:'var(--jungle-deep)', padding:'0.65rem 1rem' }}>
                        {['Student','Points','Badges','Done','Last Active','Observations'].map(h => (
                          <div key={h} style={{ color:'rgba(255,255,255,0.8)', fontSize:'0.72rem', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em' }}>{h}</div>
                        ))}
                      </div>

                      {firestoreStudents.length === 0 ? (
                        <div style={{ padding:'2rem 1rem', textAlign:'center' }}>
                          <p style={{ color:'#999', fontSize:'0.85rem', fontStyle:'italic' }}>No students have submitted yet.</p>
                        </div>
                      ) : (
                        firestoreStudents.map((s, i) => {
                          const lastBadge = s.badges && s.badges.length > 0 ? s.badges[s.badges.length - 1] : null;
                          const lastActiveDate = s.completedAt
                            ? s.completedAt
                            : lastBadge && lastBadge.timestamp ? new Date(lastBadge.timestamp) : null;
                          const hasObservations = (s.badges || []).some(b => b.observation);
                          return (
                            <div key={s.name} style={{ display:'grid', gridTemplateColumns:'1.4fr 0.6fr 0.6fr 0.6fr 0.85fr 0.85fr', padding:'0.7rem 1rem', borderTop:'1px solid #F0EDE8', alignItems:'center', background: i % 2 === 0 ? 'white' : '#FAFAF8' }}>
                              <div style={{ display:'flex', alignItems:'center', gap:'0.55rem' }}>
                                <div style={{ width:'28px', height:'28px', borderRadius:'50%', background: s.completed ? 'linear-gradient(135deg, var(--jungle-mid), var(--jungle-light))' : 'linear-gradient(135deg, #aaa, #ccc)', display:'flex', alignItems:'center', justifyContent:'center', color:'white', fontSize:'0.72rem', fontWeight:700, flexShrink:0 }}>
                                  {s.name.charAt(0).toUpperCase()}
                                </div>
                                <span style={{ fontWeight:600, color:'var(--jungle-deep)', fontSize:'0.88rem' }}>{s.name}</span>
                              </div>
                              <div style={{ fontWeight:700, color:'var(--sunset-orange)', fontSize:'0.9rem' }}>{s.totalPoints || 0}</div>
                              <div style={{ fontSize:'0.88rem' }}>{s.badges && s.badges.length > 0 ? '🏆'.repeat(s.badges.length) : <span style={{ color:'#bbb', fontSize:'0.75rem' }}>—</span>}</div>
                              <div style={{ fontSize:'0.82rem' }}>
                                {s.completed
                                  ? <span style={{ display:'inline-flex', alignItems:'center', gap:'0.25rem', background:'#F0FDF4', color:'#16A34A', fontWeight:700, fontSize:'0.72rem', padding:'0.2rem 0.5rem', borderRadius:'10px' }}>✓ Yes</span>
                                  : <span style={{ color:'#bbb', fontSize:'0.75rem' }}>—</span>
                                }
                              </div>
                              <div style={{ color: lastActiveDate ? 'var(--jungle-mid)' : '#bbb', fontSize:'0.75rem', fontWeight: lastActiveDate ? 600 : 400 }}>
                                {lastActiveDate ? lastActiveDate.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : '—'}
                              </div>
                              <div>
                                {hasObservations
                                  ? <button onClick={() => setObservationsModal(s)} style={{ background:'var(--jungle-deep)', color:'white', border:'none', padding:'0.25rem 0.6rem', borderRadius:'6px', fontSize:'0.72rem', fontWeight:600, cursor:'pointer' }}>View</button>
                                  : <span style={{ color:'#bbb', fontSize:'0.75rem' }}>—</span>
                                }
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>

                    <div style={{ display:'flex', gap:'0.7rem', marginTop:'1.5rem', flexWrap:'wrap' }}>
                      <button onClick={resetClass} style={{ flex:'1 1 auto', minWidth:'140px', padding:'0.6rem 1rem', borderRadius:'10px', border:'1.5px solid #E5E5E5', background:'white', color:'#888', fontSize:'0.8rem', fontWeight:600, cursor:'pointer', transition:'all 0.2s' }}
                        onMouseEnter={(e)=>{ e.currentTarget.style.borderColor='#ef4444'; e.currentTarget.style.color='#ef4444'; }}
                        onMouseLeave={(e)=>{ e.currentTarget.style.borderColor='#E5E5E5'; e.currentTarget.style.color='#888'; }}>
                        🗑 Reset class data
                      </button>
                      <button onClick={archiveClass} style={{ flex:'1 1 auto', minWidth:'140px', padding:'0.6rem 1rem', borderRadius:'10px', border:'1.5px solid #E5E5E5', background:'white', color:'#888', fontSize:'0.8rem', fontWeight:600, cursor:'pointer', transition:'all 0.2s' }}
                        onMouseEnter={(e)=>{ e.currentTarget.style.borderColor='var(--jungle-mid)'; e.currentTarget.style.color='var(--jungle-mid)'; }}
                        onMouseLeave={(e)=>{ e.currentTarget.style.borderColor='#E5E5E5'; e.currentTarget.style.color='#888'; }}>
                        📦 Archive class
                      </button>
                    </div>
                  </div>
                </div>
              </>
            )}
          </div>

          {observationsModal && (
            <div onClick={() => setObservationsModal(null)} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:100, display:'flex', alignItems:'center', justifyContent:'center', padding:'1.5rem' }}>
              <div onClick={(e) => e.stopPropagation()} style={{ background:'white', borderRadius:'18px', width:'100%', maxWidth:'480px', maxHeight:'80vh', overflowY:'auto', boxShadow:'0 24px 60px rgba(0,0,0,0.25)' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'1.2rem 1.4rem 0.8rem', borderBottom:'1px solid #F0EDE8', position:'sticky', top:0, background:'white', zIndex:1 }}>
                  <div>
                    <h3 style={{ fontSize:'1.1rem', fontWeight:700, color:'var(--jungle-deep)', margin:0 }}>📋 Observations</h3>
                    <p style={{ fontSize:'0.78rem', color:'#888', margin:'0.15rem 0 0' }}>{observationsModal.name}</p>
                  </div>
                  <button onClick={() => setObservationsModal(null)} style={{ background:'none', border:'none', fontSize:'1.4rem', color:'#aaa', cursor:'pointer', lineHeight:1, padding:'0.2rem 0.4rem' }}>×</button>
                </div>
                <div style={{ padding:'1rem 1.4rem 1.4rem' }}>
                  {(observationsModal.badges || []).filter(b => b.observation).map((b, idx, arr) => (
                    <div key={idx} style={{ borderLeft:'3px solid var(--jungle-mid)', background:'#F7FAF8', borderRadius:'0 10px 10px 0', padding:'0.75rem 1rem', marginBottom: idx < arr.length - 1 ? '0.75rem' : 0 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:'0.4rem', marginBottom:'0.35rem' }}>
                        <span style={{ fontSize:'0.72rem', fontWeight:700, color:'var(--jungle-mid)', textTransform:'uppercase', letterSpacing:'0.05em' }}>{b.animal}</span>
                        {b.timestamp && <span style={{ fontSize:'0.65rem', color:'#aaa' }}>· {new Date(b.timestamp).toLocaleDateString('en-AU', { day:'numeric', month:'short' })}</span>}
                      </div>
                      <p style={{ fontSize:'0.85rem', color:'#444', lineHeight:1.55, margin:0 }}>{b.observation}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
          </>
        );
      }

      return null;
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TarongaTracka />);
  </script>

</body>
</html>
