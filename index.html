            let globalBehaviourTotal = 0;
            let globalDetailTotal = 0;
            let literacyTotal = 0;
            let badgeCount = 0;
            let totalBadges = 0;
            const classesWithStats = [];

            for (const classDoc of classesSnapshot.docs) {
              const classData = classDoc.data();
              if (classData.teacherEmail) teacherEmails.add(classData.teacherEmail);

              const studentsSnapshot = await window.db.collection('classes')
                .doc(classDoc.id)
                .collection('students')
                .get();

              const studentCount = studentsSnapshot.size;
              let completedCount = 0;
              let classQuizSum = 0;
              let classQuizCount = 0;
              let classBehaviourTotal = 0;
              let classDetailTotal = 0;
              let classLiteracyTotal = 0;
              let classBadgeCount = 0;
              let classTotalBadges = 0;
              let classKnowledgeCorrect = 0; let classKnowledgeTotal = 0;
              let classDiscoveryCorrect = 0; let classDiscoveryTotal = 0;
              let classReflectionScores = [];

              studentsSnapshot.docs.forEach(studentDoc => {
                const studentData = studentDoc.data();
                
                // Date range filtering
                const completedAt = studentData.completedAt?.toDate?.();
                if (!completedAt) return;

                if (adminDateRange !== 'all') {
                  const days = parseInt(adminDateRange, 10);
                  const cutoff = new Date();
                  cutoff.setDate(cutoff.getDate() - days);

                  if (completedAt < cutoff) return;
                }
                
                if (studentData.completed === true) {
                  completedCount++;
                  totalCompleted++;

                    classQuizSum += studentData.quizPercentage;
                    classQuizCount++;
                    totalQuizPercentageSum += studentData.quizPercentage;
                    studentsWithQuizData++;

                  // Aggregate mission-type accuracies from stored Firestore fields
                  if (studentData.knowledgeAccuracy !== undefined && studentData.knowledgeAccuracy !== null) {
                    classKnowledgeCorrect += studentData.knowledgeAccuracy;
                    classKnowledgeTotal++;
                  }
                  if (studentData.discoveryAccuracy !== undefined && studentData.discoveryAccuracy !== null) {
                    classDiscoveryCorrect += studentData.discoveryAccuracy;
                    classDiscoveryTotal++;
                  }
                }
                
                // Aggregate observation scores from badges (per-class and global)
                if (Array.isArray(studentData.badges)) {
                  classTotalBadges += studentData.badges.length;
                  totalBadges += studentData.badges.length;
                  
                  studentData.badges.forEach(badge => {
                    // Backwards compatible: check behaviourScore first, fallback to behaviorScore
                    const behaviourValue = badge.behaviourScore !== undefined ? badge.behaviourScore : (badge.behaviorScore || 0);
                    
                    classBehaviourTotal += behaviourValue;
                    classDetailTotal += badge.detailScore || 0;
                    classLiteracyTotal += badge.literacyScore || 0;
                    classBadgeCount++;

                    // Aggregate reflection score directly from immersion badges
                    if (badge.observationMissionType === 'immersion' && badge.reflectionScore !== undefined) {
                      const rs = badge.reflectionScore;
                      const total = (rs && typeof rs === 'object') ? ((rs.behaviour||0)+(rs.detail||0)+(rs.writing||0)) : (typeof rs === 'number' ? rs : 0);
                      classReflectionScores.push(total);
                    }
                    
                    // Aggregate mission-type analytics from quizResults (legacy path)
                    if (Array.isArray(badge.quizResults)) {
                      badge.quizResults.forEach(qr => {
                        if (qr.missionType === 'immersion' && qr.reflectionScore !== undefined && badge.observationMissionType !== 'immersion') {
                          const rs = qr.reflectionScore;
                          const total = (rs && typeof rs === 'object') ? ((rs.behaviour||0)+(rs.detail||0)+(rs.writing||0)) : (typeof rs === 'number' ? rs : 0);
                          classReflectionScores.push(total);
                        }
                      });
                    }
                    
                    // Global tracking for platform-wide average
                    globalBehaviourTotal += behaviourValue;
                    globalDetailTotal += badge.detailScore || 0;
                    literacyTotal += badge.literacyScore || 0;
                    badgeCount++;
                  });
                }
              });

              totalStudents += studentCount;

              // Calculate per-class combined observation percentage (out of 15 total per badge: behaviour 5 + detail 5 + writing 5)
              const classTotalScore = classBehaviourTotal + classDetailTotal + classLiteracyTotal;
              const classMaxPossible = classBadgeCount * 15;
              const averageObservationPercent = classMaxPossible > 0

              // Store class with stats including quiz average and observation percentage
              const classQuizAvg = classQuizCount > 0 ? Math.round(classQuizSum / classQuizCount) : 0;
              classesWithStats.push({

                teacherEmail: classData.teacherEmail || '',

                createdAt: classData.createdAt || null
              });

            if (freshData.uses >= freshData.maxUses) {
              throw new Error("Code usage limit reached.");

            transaction.update(codeRef, {
              uses: freshData.uses + 1

            // Write to teachers/{teacherEmail}/classes/{classCode}

              schoolName: newSchoolName.trim(),
              accessCodeUsed: accessCodeInput.trim(),

              sessionClosed: false,
              sessionDate: new Date().toISOString().split("T")[0]

              className: newClassName.trim(),

            const safeId = studentName.trim().replace(/[\\/#\\.$\\[\\]]/g, '_');
            const studentRef = window.db.collection('classes').doc(code).collection('students').doc(safeId);

            // Sanitise badges: ensure all sub-fields the dashboard reads are present

            const savedBadges = badges.map(b => ({

        const yearNum = parseInt(String(year).replace(/[^0-9]/g, ''), 10);
        if (yearNum <= 2) return "Stage 1";
        if (yearNum <= 4) return "Stage 2";
        if (yearNum <= 6) return "Stage 3";
        if (yearNum <= 8) return "Stage 4";
        if (yearNum <= 10) return "Stage 5";
        return null;

        const map = {
          'Behaviour': 'behaviour',
          'Observation': 'behaviour',

          'Writing': 'writing',
          'Evidence Use': 'detail',
          'Data Interpretation': 'detail'
        };
        return map[focusArea] || null;

          const difficultyBand = cls.difficultyBand;

          const scoredResources = teacherResources.map(resource => {
            let score = 0;

            if (Array.isArray(resource.stages) && resource.stages.includes(derivedStage)) {
              score += 3;
            }

            if (Array.isArray(resource.focusAreas)) {
              const mappedFocusAreas = resource.focusAreas
                .map(f => mapFocusAreaToCategory(f))
                .filter(Boolean);
              if (mappedFocusAreas.includes(mapFocusAreaToCategory(weakestFocusArea))) {
                score += 2;
              }
            }

            if (resource.difficultyLevel && resource.difficultyLevel === difficultyBand) {
              score += 1;
            }

            return { ...resource, _score: score };
          })
          .filter(r => r._score > 0)
          .sort((a, b) => b._score - a._score);

        const additionalAnimals = fsAnimals.filter(a => !hardcodedIds.has(a.id));
        return [...baseAnimals, ...additionalAnimals];
      }, [firestoreAnimals]);

      // ---------- HELPERS ----------
      function bearingToArrow(bearing) {
        const arrows = ['↑','↗','→','↘','↓','↙','←','↖'];
        return arrows[Math.round(bearing / 45) % 8];
      }

      const calculateDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371e3;
        const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2)*Math.sin(dp/2) + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      };

      function getBearing(lat1, lon1, lat2, lon2) {
        const toRad = deg => deg * Math.PI / 180;
        const toDeg = rad => rad * 180 / Math.PI;
        const φ1 = toRad(lat1), φ2 = toRad(lat2);
        const Δλ = toRad(lon2 - lon1);
        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
        return (toDeg(Math.atan2(y, x)) + 360) % 360;
      }

      function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const toRad = deg => deg * Math.PI / 180;
        const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)*Math.sin(dLon/2);
        return Math.round(6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
      }

          return;

        if (!('geolocation' in navigator)) { alert('Geolocation not supported.'); return; }
        if (geoWatchIdRef.current !== null) return;

        const startWatch = () => {
          geoWatchIdRef.current = navigator.geolocation.watchPosition(
            (position) => {
              setUserLocation({ latitude: position.coords.latitude, longitude: position.coords.longitude, accuracy: position.coords.accuracy });

        if (navigator.permissions) {

      function submitTigerReflection() {

        const lower = text.toLowerCase();

        if (wc < 10) { alert(`Please write at least 10 words. You have ${wc}.`); return; }

        // Reflection scoring: 0–5 per axis. Behaviour = 0 (immersion doesn't score animal behaviour).
        const reflectionKeywords = ['hear','heard','sound','bird','wind','smell','trees','leaves','water','people','animals','nature'];
        const sensoryHits = reflectionKeywords.filter(w => lower.includes(w)).length;
        const refDetail = Math.min(5, sensoryHits);

        let refWriting = 0;
        if (/^[A-Z]/.test(text)) refWriting++;

        if (text.split(/[.!?]+/).filter(s => s.trim().length > 0).length >= 2) refWriting++;
        const words = lower.split(/\s+/).filter(Boolean);
        if (words.length > 0 && new Set(words).size / words.length > 0.6) refWriting++;
        refWriting = Math.min(5, refWriting);

        const reflectionScore = { behaviour: 0, detail: refDetail, writing: refWriting };
        const reflectionPoints = reflectionScore.behaviour + reflectionScore.detail + reflectionScore.writing;

        const tigerQuizResults = [

      const submitObservation = () => {
        if (sessionLocked) return;
        if (activityCompleted) return;
        const wc = observation.trim().match(/\b\w+\b/g)?.length || 0;
        if (wc < 10) { alert(`Your observation needs at least 10 words. You have ${wc}.`); return; }

        // Quiz score = questions correct on first attempt only
        let correctCount = 0;
        const totalQuestions = currentAnimal.questions.length;
        const quizResults = currentAnimal.questions.map((q, i) => {
          const wasCorrect = firstAttemptResults[i] === true;
          if (wasCorrect) correctCount++;
          return { question: q.question, correctOnFirstAttempt: wasCorrect, missionType: "knowledge" };
        });
        if (reflectionText.trim().length > 0) {
          quizResults.push({ question: 'Immersion reflection', correctOnFirstAttempt: reflectionScore >= 2, missionType: "immersion", reflectionScore });
        }
        const quizPoints = correctCount * 10;

        const text = observation.trim();
        const lower = text.toLowerCase();

        const behaviorWords = ['sleeping','eating','walking','climbing','jumping','playing','sitting','running','resting','moving','looking','watching','grooming','scratching','lying','standing','hanging','swinging','chewing','drinking','hiding','stretching','yawning','sniffing','touching','holding','grabbing'];
        let behaviorCount = 0;
        behaviorWords.forEach(w => { if (lower.includes(w)) behaviorCount++; });
        // Rubric 0–5: 0 actions→0, 1 action→2, 2 actions or contextual→3, 2+ with context→5
        const hasContext = /\b(while|as|when|then|after|before|near|towards|away|together|each other|another|slowly|carefully|quickly|gently)\b/.test(lower);
        let behaviourBonus = 0;
        if (behaviorCount >= 1) behaviourBonus = 2;
        if (behaviorCount >= 2 || (behaviorCount >= 1 && hasContext)) behaviourBonus = 3;
        if (behaviorCount >= 2 && hasContext) behaviourBonus = 5;

        const reflectionKeywords = ['hear','heard','sound','bird','wind','smell','trees','leaves','water','people','animals','nature'];
        const reflectionLower = reflectionText.trim().toLowerCase();
        const reflectionHitCount = reflectionKeywords.filter(w => reflectionLower.includes(w)).length;
        const reflectionScore = Math.min(5, Math.max(reflectionHitCount > 0 ? reflectionHitCount : 0, 0));

        const detailWords = ['fur','color','colour','eyes','ears','tail','paws','claws','nose','mouth','teeth','stripes','spots','pattern','size','big','small','long','short','thick','thin','soft','rough','dark','light','brown','black','white','orange','grey','gray','quietly','slowly','quickly','feathers','scales','beak','wings','mane','trunk','pouch','shell','horns','claws','snout','belly','neck'];
        let detailCount = 0;
        detailWords.forEach(w => { if (lower.includes(w)) detailCount++; });
        // Rubric 0–5: 0 details→0, 1 detail→2, 2 details→3, 2+ linked→5
        const hasLink = /\b(because|when|while|near|on the|in the|against|behind|under|above|beside|around|enclosure|tree|rock|branch|ground|water|fence|wall)\b/.test(lower);
        let detailBonus = 0;
        if (detailCount >= 1) detailBonus = 2;
        if (detailCount >= 2) detailBonus = 3;
        if (detailCount >= 2 && hasLink) detailBonus = 5;

        // Rubric 0–5: 1pt capital, 1pt punctuation, 1pt multiple sentences, 1pt vocabulary, 1pt length bonus
        let literacyBonus = 0;
        if (/^[A-Z]/.test(text)) literacyBonus += 1;
        if (/[.!?]$/.test(text)) literacyBonus += 1;
        if (text.split(/[.!?]+/).filter(s => s.trim().length > 0).length >= 2) literacyBonus += 1;
        const words = lower.split(/\s+/).filter(Boolean);
        if (words.length > 0 && new Set(words).size / words.length > 0.6) literacyBonus += 1;
        if (words.length >= 20) literacyBonus += 1;

        const totalEarned = quizPoints + 30 + behaviourBonus + detailBonus + literacyBonus + currentAnimal.pointValue;

          })),

        // Calculate quiz metrics from cleanBadges
        let quizCorrect = 0;

               Back
            </button>

        );

      if (currentScreen === 'studentJoin') {
        const handleJoin = async () => {
          if (!classCode.trim() || !studentName.trim()) return;
          const code = normaliseCode(classCode);
          if (code.length !== 6) { setStudentJoinError('Code not found — check with your teacher.'); return; }
          
          try {
            // Verify class exists
            const classDoc = await window.db.collection('classes').doc(code).get();
            if (!classDoc.exists) { setStudentJoinError('Code not found — check with your teacher.'); return; }
            
            // Check for existing incomplete session
            const existingQuery = await window.db.collection('classes').doc(code)
              .collection('students')
              .where('name', '==', studentName.trim())
              .get();
            
            if (!existingQuery.empty) {
              // Load existing session
              const existingDoc = existingQuery.docs[0];
              const existingData = existingDoc.data();
              
              // Restore session data
              setTotalPoints(existingData.totalPoints || 0);
              setBadges(existingData.badges || []);
              setFoundAnimals(new Set(existingData.badges?.map(b => b.animalId) || []));
              
              localStorage.setItem('tarongaStudentName', JSON.stringify(studentName.trim()));
              localStorage.setItem('tarongaClassCode', JSON.stringify(code));
              setStudentJoinError('');
              enableLocation();
              setCurrentScreen('map');
              return; // IMPORTANT: prevent creating new document

                            <label style={{ display:'block', fontSize:'0.78rem', fontWeight:600, color:'var(--jungle-deep)', marginBottom:'0.4rem' }}>Stage</label>
                            {STAGE_LIST.map(s => (
                              <label key={s} style={{ display:'flex', alignItems:'center', gap:'0.4rem', fontSize:'0.82rem', color:'#555', marginBottom:'0.25rem', cursor:'pointer' }}>
                                <input type="checkbox" checked={resourceStages.includes(s)} onChange={()=>toggleMulti(setResourceStages, resourceStages, s)} />
                                {s}
                              </label>
                            ))}
                          </div>
                          <div>
                            <label style={{ display:'block', fontSize:'0.78rem', fontWeight:600, color:'var(--jungle-deep)', marginBottom:'0.4rem' }}>Topics</label>
                            {TOPIC_LIST.map(t => (
                              <label key={t} style={{ display:'flex', alignItems:'center', gap:'0.4rem', fontSize:'0.82rem', color:'#555', marginBottom:'0.25rem', cursor:'pointer' }}>
                                <input type="checkbox" checked={resourceTopics.includes(t)} onChange={()=>toggleMulti(setResourceTopics, resourceTopics, t)} />
                                {t}
                              </label>
                            ))}
                          </div>
                          <div>
                            <label style={{ display:'block', fontSize:'0.78rem', fontWeight:600, color:'var(--jungle-deep)', marginBottom:'0.4rem' }}>Focus Areas</label>
                            {focusAreaOptions.map(f => (
                              <label key={f} style={{ display:'flex', alignItems:'center', gap:'0.4rem', fontSize:'0.82rem', color:'#555', marginBottom:'0.25rem', cursor:'pointer' }}>
                                <input type="checkbox" checked={resourceFocusAreas.includes(f)} onChange={()=>toggleMulti(setResourceFocusAreas, resourceFocusAreas, f)} />
                                {toTitleCase(f)}
                              </label>
                            ))}
                          </div>
                        </div>

                        {/* Syllabus Outcome Linking — filter by selected stage(s) */}
                        <div>
                          <label style={{ display:'block', fontSize:'0.78rem', fontWeight:600, color:'var(--jungle-deep)', marginBottom:'0.4rem' }}>Syllabus Outcomes</label>
                          {resourceStages.length === 0 ? (
                            <p style={{ fontSize:'0.78rem', color:'#aaa', fontStyle:'italic' }}>Select a Stage above to view available outcomes.</p>
                          ) : (
                            <div style={{ display:'flex', flexDirection:'column', gap:'0.2rem', maxHeight:'220px', overflowY:'auto', border:'1.5px solid #E5E5E5', borderRadius:'10px', padding:'0.6rem 0.85rem' }}>
                              {SYLLABUS_OUTCOMES.filter(o => resourceStages.includes(o.stage)).map(o => {
                                const selected = resourceSyllabusLinks.some(l => l.code === o.code);
                                return (
                                  <label key={o.code} style={{ display:'flex', alignItems:'flex-start', gap:'0.5rem', fontSize:'0.78rem', color:'#555', cursor:'pointer', paddingBottom:'0.2rem' }}>
                                    <input type="checkbox" style={{ marginTop:'2px', flexShrink:0 }}
                                      checked={selected}
                                      onChange={() => {
                                        if (selected) {
                                          setResourceSyllabusLinks(resourceSyllabusLinks.filter(l => l.code !== o.code));
                                        } else {
                                          setResourceSyllabusLinks([...resourceSyllabusLinks, { code: o.code, description: o.description }]);
                                        }
                                      }} />
                                    <span><strong style={{ color:'var(--jungle-deep)' }}>{o.code}</strong> — {o.description?.replace(/\\'9[67]/g, '').replace(/\\b7/g, '')}</span>
                                  </label>
                                );
                              })}
                            </div>
                          )}
                          {resourceSyllabusLinks.length > 0 && (
                            <p style={{ fontSize:'0.72rem', color:'var(--jungle-mid)', marginTop:'0.35rem' }}>{resourceSyllabusLinks.length} outcome{resourceSyllabusLinks.length !== 1 ? 's' : ''} selected.</p>
                          )}
                        </div>

                        <div>
                          <label style={{ display:'block', fontSize:'0.78rem', fontWeight:600, color:'var(--jungle-deep)', marginBottom:'0.3rem' }}>Difficulty Level <span style={{ fontWeight:400, color:'#aaa' }}>(Optional)</span></label>
                          <select value={resourceDifficulty} onChange={e=>setResourceDifficulty(e.target.value)}
                            style={{ width:'100%', padding:'0.6rem 0.85rem', borderRadius:'10px', border:'1.5px solid #E5E5E5', fontSize:'0.9rem', fontFamily:'DM Sans, sans-serif', background:'white' }}>
                            <option value="">None</option>
                            <option value="intervention">Intervention</option>
                            <option value="consolidation">Consolidation</option>
                            <option value="extension">Extension</option>
                          </select>
                        </div>

                        <div>
                          <label style={{ display:'flex', alignItems:'center', gap:'0.5rem', fontSize:'0.82rem', color:'#555', cursor:'pointer' }}>
                            <input type="checkbox" checked={resourceDraft} onChange={e=>setResourceDraft(e.target.checked)} />
                            Save as draft (do not publish)
                          </label>
                        </div>

                        <div style={{ display:'flex', gap:'0.75rem', paddingTop:'0.25rem' }}>
                          <button onClick={()=>saveResource(false)} disabled={savingResource}
                            style={{ flex:'1 1 auto', padding:'0.65rem 1rem', borderRadius:'10px', border:'1.5px solid #E5E5E5', background:'white', color: savingResource ? '#bbb' : '#555', fontSize:'0.85rem', fontWeight:600, cursor: savingResource ? 'not-allowed' : 'pointer', transition:'all 0.2s' }}>
                            {savingResource ? 'Saving...' : 'Save Draft'}
                          </button>
                          <button onClick={()=>saveResource(true)} disabled={savingResource}
                            style={{ flex:'1 1 auto', padding:'0.65rem 1rem', borderRadius:'10px', border:'none', background: savingResource ? '#CCC' : 'linear-gradient(135deg, var(--jungle-deep), var(--jungle-mid))', color:'white', fontSize:'0.85rem', fontWeight:700, cursor: savingResource ? 'not-allowed' : 'pointer', transition:'all 0.2s' }}>
                            {savingResource ? 'Saving...' : 'Publish'}
                          </button>
                        </div>
                        {resourceSaved && (
                          <div className="fade-in" style={{ fontSize:'0.8rem', color:'#2e7d32', fontWeight:600 }}>&#10003; Resource saved successfully.</div>
                        )}

                      </div>
                    </div>

                    {/* Resource List */}
                    <div style={{ background:'white', borderRadius:'16px', boxShadow:'0 4px 16px rgba(0,0,0,0.07)', overflow:'hidden' }}>
                      <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr 1.5fr 0.8fr 1fr', background:'var(--jungle-deep)', padding:'0.65rem 1rem' }}>
                        {['Title','Stage','Topics','Status','Actions'].map(h => (
                          <div key={h} style={{ color:'rgba(255,255,255,0.8)', fontSize:'0.72rem', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em' }}>{h}</div>
                        ))}
                      </div>
                      {resourcesLoading ? (
                        <div style={{ padding:'2rem', textAlign:'center' }}>
                          <p style={{ color:'#aaa', fontSize:'0.85rem', fontStyle:'italic' }}>Loading resources...</p>
                        </div>
                      ) : resources.length === 0 ? (
                        <div style={{ padding:'2rem', textAlign:'center' }}>
                          <p style={{ color:'#bbb', fontSize:'0.85rem', fontStyle:'italic' }}>No resources yet. Create one above.</p>
                        </div>
                      ) : resources.map((r, idx) => (
                        <div key={r.id} style={{ display:'grid', gridTemplateColumns:'2fr 1fr 1.5fr 0.8fr 1fr', padding:'0.75rem 1rem', borderBottom: idx < resources.length-1 ? '1px solid #F0EDE8' : 'none', alignItems:'center' }}>
                          <div>
                            <p style={{ fontWeight:600, color:'var(--jungle-deep)', fontSize:'0.88rem', marginBottom:'0.1rem' }}>{r.title}</p>
                            {r.type && <span style={{ fontSize:'0.7rem', color:'#999', textTransform:'capitalize' }}>{r.type}</span>}
                          </div>
                          <div style={{ fontSize:'0.78rem', color:'#666' }}>{(r.stage || []).join(', ') || '—'}</div>
                          <div style={{ fontSize:'0.78rem', color:'#666' }}>{(r.topics || []).join(', ') || '—'}</div>
                          <div>
                            {r.active
                              ? <span style={{ fontSize:'0.72rem', fontWeight:700, color:'#16A34A', background:'#F0FDF4', padding:'0.2rem 0.5rem', borderRadius:'6px' }}>Active</span>
                              : r.draft
                                ? <span style={{ fontSize:'0.72rem', fontWeight:700, color:'#CA8A04', background:'#FEFCE8', padding:'0.2rem 0.5rem', borderRadius:'6px' }}>Draft</span>
                                : <span style={{ fontSize:'0.72rem', fontWeight:700, color:'#999', background:'#F5F5F5', padding:'0.2rem 0.5rem', borderRadius:'6px' }}>Inactive</span>
                            }
                          </div>
                          <div style={{ display:'flex', gap:'0.4rem', flexWrap:'wrap' }}>
                            <button onClick={()=>{
                                setEditingResourceId(r.id);
                                setResourceTitle(r.title || '');
                                setResourceDescription(r.description || '');
                                setResourceUrl(r.url || '');
                                setResourceType(r.type || '');
                                setResourceStages(r.stage || []);
                                setResourceTopics(r.topics || []);
                                setResourceFocusAreas(r.focusAreas || []);
                                setResourceVenue(r.venue || '');
                                setResourceSyllabusLinks(r.syllabusLinks || []);
                                setResourceDraft(r.draft !== false);
                                setResourceDifficulty(r.difficultyLevel || '');
                              }}
                              style={{ padding:'0.3rem 0.6rem', borderRadius:'6px', border:'1.5px solid #E5E5E5', background:'white', color:'#888', fontSize:'0.72rem', fontWeight:600, cursor:'pointer' }}
                              onMouseEnter={e=>{ e.currentTarget.style.borderColor='var(--jungle-mid)'; e.currentTarget.style.color='var(--jungle-mid)'; }}
                              onMouseLeave={e=>{ e.currentTarget.style.borderColor='#E5E5E5'; e.currentTarget.style.color='#888'; }}>
                              Edit
                            </button>
                            {r.active ? (
                              <button onClick={()=>deactivateResource(r.id)}
                                style={{ padding:'0.3rem 0.6rem', borderRadius:'6px', border:'1.5px solid #E5E5E5', background:'white', color:'#888', fontSize:'0.72rem', fontWeight:600, cursor:'pointer' }}
                                onMouseEnter={e=>{ e.currentTarget.style.borderColor='#ef4444'; e.currentTarget.style.color='#ef4444'; }}
                                onMouseLeave={e=>{ e.currentTarget.style.borderColor='#E5E5E5'; e.currentTarget.style.color='#888'; }}>
                                Deactivate
                              </button>
                            ) : (
                              <button onClick={()=>handleReactivate(r.id)}
                                style={{ padding:'0.3rem 0.6rem', borderRadius:'6px', border:'1.5px solid #E5E5E5', background:'white', color:'#888', fontSize:'0.72rem', fontWeight:600, cursor:'pointer' }}
                                onMouseEnter={e=>{ e.currentTarget.style.borderColor='var(--jungle-mid)'; e.currentTarget.style.color='var(--jungle-mid)'; }}
                                onMouseLeave={e=>{ e.currentTarget.style.borderColor='#E5E5E5'; e.currentTarget.style.color='#888'; }}>
                                Reactivate
                              </button>
                            )}
                            <button onClick={()=>handleDeleteResource(r.id)}
                              style={{ padding:'0.3rem 0.6rem', borderRadius:'6px', border:'1.5px solid transparent', background:'none', color:'#ef4444', fontSize:'0.72rem', fontWeight:600, cursor:'pointer' }}
                              onMouseEnter={e=>{ e.currentTarget.style.borderColor='#ef4444'; }}
                              onMouseLeave={e=>{ e.currentTarget.style.borderColor='transparent'; }}>
                              Delete
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            </div>
          </div>
        );
      }

      if (currentScreen === 'adminClassView') {
        if (!adminClassData) {
          return (
            <div style={{ position:'fixed', inset:0, background:'var(--mist-light)', display:'flex', alignItems:'center', justifyContent:'center' }}>
              <div style={{ width:'48px', height:'48px', border:'4px solid rgba(26,82,56,0.15)', borderTop:'4px solid var(--jungle-mid)', borderRadius:'50%', animation:'spin 0.8s linear infinite' }} />
            </div>
          );
        }

        const completedCount = adminClassStudents.filter(s => s.completed).length;
        const completionPercent = adminClassStudents.length > 0 ? Math.round((completedCount / adminClassStudents.length) * 100) : 0;

        return (
          <>
          <div style={{ position:'fixed', inset:0, background:'var(--mist-light)', display:'flex', flexDirection:'column' }}>
            <div style={{ background:'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)', padding:'1rem 1.5rem', boxShadow:'0 4px 20px rgba(0,0,0,0.1)', flexShrink:0 }}>
              <div style={{ maxWidth:'1200px', margin:'0 auto', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div style={{ display:'flex', alignItems:'center', gap:'0.7rem' }}>
                  <button onClick={()=>{ setSelectedAdminClass(null); setCurrentScreen('adminDashboard'); }} style={{ background:'rgba(255,255,255,0.15)', border:'1px solid rgba(255,255,255,0.3)', color:'white', width:'34px', height:'34px', borderRadius:'50%', cursor:'pointer', fontSize:'1.1rem', display:'flex', alignItems:'center', justifyContent:'center' }}></button>
                  <div>
                    <h1 className="heading-display" style={{ fontSize:'clamp(1.2rem, 3vw, 1.6rem)', color:'white', lineHeight:1.2 }}>Class Details</h1>
                    <p style={{ color:'rgba(255,255,255,0.7)', fontSize:'0.78rem' }}>{adminClassData.classCode}</p>
                  </div>
                </div>
                <button onClick={()=>{ setAdminAccessCode(''); setSelectedAdminClass(null); setCurrentScreen('home'); }} style={{ background:'rgba(255,255,255,0.15)', border:'1px solid rgba(255,255,255,0.3)', color:'white', padding:'0.45rem 0.9rem', borderRadius:'20px', cursor:'pointer', fontSize:'0.8rem', fontWeight:600 }}>
                  Sign Out
                </button>
              </div>
            </div>

            <div style={{ flex:1, overflowY:'auto', padding:'1.5rem' }}>
              <div style={{ maxWidth:'1200px', margin:'0 auto' }}>
                
                <div className="animate-fade-in-up" style={{ background:'white', borderRadius:'20px', padding:'1.5rem', boxShadow:'0 8px 32px rgba(0,0,0,0.1)', marginBottom:'1.5rem' }}>
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))', gap:'1.5rem' }}>
                    <div>
                      <div style={{ fontSize:'0.75rem', fontWeight:600, color:'#999', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:'0.3rem' }}>Class Name</div>
                      <div style={{ fontSize:'1.1rem', fontWeight:700, color:'var(--jungle-deep)' }}>{adminClassData.className}</div>
                    </div>
                    <div>
                      <div style={{ fontSize:'0.75rem', fontWeight:600, color:'#999', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:'0.3rem' }}>Year Group</div>
                      <div style={{ fontSize:'1.1rem', fontWeight:700, color:'var(--jungle-deep)' }}>{adminClassData.yearGroup}</div>
                    </div>
                    <div>
                      <div style={{ fontSize:'0.75rem', fontWeight:600, color:'#999', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:'0.3rem' }}>School</div>
                      <div style={{ fontSize:'1.1rem', fontWeight:700, color:'var(--jungle-deep)' }}>
                        {adminClassData.schoolName || <span style={{ color:'#999', fontWeight:400, fontStyle:'italic' }}>School not specified</span>}
                      </div>
                    </div>
                    <div>
                      <div style={{ fontSize:'0.75rem', fontWeight:600, color:'#999', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:'0.3rem' }}>Teacher</div>
                      <div style={{ fontSize:'1.1rem', fontWeight:700, color:'var(--jungle-deep)' }}>{adminClassData.teacherEmail}</div>
                    </div>
                    <div>
                      <div style={{ fontSize:'0.75rem', fontWeight:600, color:'#999', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:'0.3rem' }}>Created</div>
                      <div style={{ fontSize:'1.1rem', fontWeight:700, color:'var(--jungle-deep)' }}>
                        {adminClassData.createdAt ? new Date(adminClassData.createdAt.toDate()).toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : '—'}
                      </div>
                    </div>
                    <div>
                      <div style={{ fontSize:'0.75rem', fontWeight:600, color:'#999', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:'0.3rem' }}>Completion</div>
                      <div style={{ fontSize:'1.1rem', fontWeight:700, color:'var(--jungle-deep)' }}>{completionPercent}% ({completedCount}/{adminClassStudents.length})</div>
                    </div>
                  </div>
                </div>

                <div className="animate-fade-in-up" style={{ background:'white', borderRadius:'20px', padding:'1.5rem', boxShadow:'0 8px 32px rgba(0,0,0,0.1)', animationDelay:'0.1s' }}>
                  <h2 style={{ fontSize:'1.3rem', fontWeight:700, color:'var(--jungle-deep)', marginBottom:'1rem' }}>Students ({adminClassStudents.length})</h2>
                  
                  {adminClassLoading ? (
                    <div style={{ display:'flex', justifyContent:'center', padding:'2rem' }}>
                      <div style={{ width:'36px', height:'36px', border:'3px solid rgba(26,82,56,0.15)', borderTop:'3px solid var(--jungle-mid)', borderRadius:'50%', animation:'spin 0.8s linear infinite' }} />
                    </div>
                  ) : adminClassStudents.length === 0 ? (
                    <div style={{ textAlign:'center', padding:'2rem', color:'#999' }}>
                      <div style={{ fontSize:'2rem', marginBottom:'0.5rem' }}></div>
                      <p>No students have joined this class yet.</p>
                    </div>
                  ) : (
                    <div style={{ overflowX:'auto' }}>
                      <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'0.9rem' }}>
                        <thead>
                          <tr style={{ borderBottom:'2px solid #F0EDE8' }}>
                            <th style={{ textAlign:'left', padding:'0.75rem 0.5rem', fontWeight:600, color:'var(--jungle-deep)', fontSize:'0.8rem' }}>Student Name</th>
                            <th style={{ textAlign:'center', padding:'0.75rem 0.5rem', fontWeight:600, color:'var(--jungle-deep)', fontSize:'0.8rem' }}>Completed</th>
                            <th style={{ textAlign:'center', padding:'0.75rem 0.5rem', fontWeight:600, color:'var(--jungle-deep)', fontSize:'0.8rem' }}>Points</th>
                            <th style={{ textAlign:'center', padding:'0.75rem 0.5rem', fontWeight:600, color:'var(--jungle-deep)', fontSize:'0.8rem' }}>Quiz %</th>
                            <th style={{ textAlign:'center', padding:'0.75rem 0.5rem', fontWeight:600, color:'var(--jungle-deep)', fontSize:'0.8rem' }}>Observations</th>
                            <th style={{ textAlign:'center', padding:'0.75rem 0.5rem', fontWeight:600, color:'var(--jungle-deep)', fontSize:'0.8rem' }}>Submitted</th>
                            <th style={{ textAlign:'center', padding:'0.75rem 0.5rem', fontWeight:600, color:'var(--jungle-deep)', fontSize:'0.8rem' }}>Actions</th>
                          </tr>
                        </thead>
                        <tbody>
                          {adminClassStudents.map((student, i) => {
                            // Count observations
                            const observationCount = (student.badges || []).filter(b => b.observation && b.observation.trim()).length;

                            return (
                              <tr key={i} style={{ borderBottom:'1px solid #F5F3EE' }}>
                                <td style={{ padding:'0.85rem 0.5rem', color:'var(--jungle-deep)', fontWeight:500 }}>{student.name}</td>
                                <td style={{ padding:'0.85rem 0.5rem', textAlign:'center', fontSize:'1.2rem' }}>
                                  {student.completed ? '' : ''}
                                </td>
                                <td style={{ padding:'0.85rem 0.5rem', textAlign:'center', fontWeight:600, color:'var(--jungle-mid)' }}>{student.totalPoints}</td>
                                <td style={{ padding:'0.85rem 0.5rem', textAlign:'center', fontWeight:600, color:'var(--jungle-mid)' }}>
                                  {student.quizPercentage !== undefined ? `${student.quizPercentage}%` : '—'}
                                </td>
                                <td style={{ padding:'0.85rem 0.5rem', textAlign:'center', color:'#666' }}>{observationCount}</td>
                                <td style={{ padding:'0.85rem 0.5rem', textAlign:'center', color:'#888', fontSize:'0.85rem' }}>
                                  {student.completedAt ? new Date(student.completedAt).toLocaleDateString('en-AU', { day:'numeric', month:'short' }) : '—'}
                                </td>
                                <td style={{ padding:'0.85rem 0.5rem', textAlign:'center' }}>
                                  {observationCount > 0 ? (
                                    <button onClick={() => { console.log('View observations clicked for:', student.name); setObservationsModal(student); }} style={{ background:'var(--jungle-light)', color:'white', border:'none', padding:'0.4rem 0.8rem', borderRadius:'8px', fontSize:'0.8rem', fontWeight:600, cursor:'pointer' }}>
                                      View
                                    </button>
                                  ) : (
                                    <span style={{ color:'#bbb', fontSize:'0.75rem' }}>—</span>
                                  )}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

              </div>
            </div>
          </div>

          {observationsModal && (
            <div onClick={() => setObservationsModal(null)} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:100, display:'flex', alignItems:'center', justifyContent:'center', padding:'1.5rem' }}>
              <div onClick={(e) => e.stopPropagation()} style={{ background:'white', borderRadius:'18px', width:'100%', maxWidth:'480px', maxHeight:'80vh', overflowY:'auto', boxShadow:'0 24px 60px rgba(0,0,0,0.25)' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'1.2rem 1.4rem 0.8rem', borderBottom:'1px solid #F0EDE8', position:'sticky', top:0, background:'white', zIndex:1 }}>
                  <div>
                    <h3 style={{ fontSize:'1.1rem', fontWeight:700, color:'var(--jungle-deep)', margin:0 }}> Observations</h3>
                    <p style={{ fontSize:'0.78rem', color:'#888', margin:'0.15rem 0 0' }}>{observationsModal.name}</p>
                  </div>
                  <button onClick={() => setObservationsModal(null)} style={{ background:'none', border:'none', fontSize:'1.4rem', color:'#aaa', cursor:'pointer', lineHeight:1, padding:'0.2rem 0.4rem' }}>x</button>
                </div>
                <div style={{ padding:'1rem 1.4rem 1.4rem' }}>
                  {(observationsModal.badges || []).filter(b => b.observation && b.observation.trim()).map((b, idx, arr) => (
                    <div key={idx} style={{ borderLeft:'3px solid var(--jungle-mid)', background:'#F7FAF8', borderRadius:'0 10px 10px 0', padding:'0.75rem 1rem', marginBottom: idx < arr.length - 1 ? '0.75rem' : 0 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:'0.4rem', marginBottom:'0.35rem' }}>
                        <span style={{ fontSize:'0.72rem', fontWeight:700, color:'var(--jungle-mid)', textTransform:'uppercase', letterSpacing:'0.05em' }}>{b.animal}</span>
                        {b.timestamp && <span style={{ fontSize:'0.65rem', color:'#aaa' }}>· {new Date(b.timestamp).toLocaleDateString('en-AU', { day:'numeric', month:'short' })}</span>}
                      </div>
                      <p style={{ fontSize:'0.85rem', color:'#444', lineHeight:1.55, margin:0 }}>{b.observation}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
          </>
        );
      }

      if (currentScreen === 'teacherLogin') {
        return (
          <div style={{ position:'fixed', inset:0, background:'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)', display:'flex', alignItems:'center', justifyContent:'center', padding:'clamp(1rem, 5vw, 2rem)', overflow:'auto' }}>
            <div className="animate-scale-in" style={{ background:'white', borderRadius:'24px', padding:'clamp(1.5rem, 4vh, 2.5rem)', maxWidth:'420px', width:'100%', boxShadow:'0 20px 60px rgba(0,0,0,0.3)' }}>
              <div style={{ textAlign:'center', marginBottom:'1.5rem' }}>
                <div style={{ fontSize:'2.8rem', marginBottom:'0.4rem' }}></div>
                <h2 className="heading-display" style={{ fontSize:'clamp(1.6rem, 4vh, 2rem)', color:'var(--jungle-deep)', marginBottom:'0.3rem' }}>Teacher Access</h2>
                <p style={{ color:'#666', fontSize:'0.9rem' }}>Enter your email to continue</p>

                  {hasRecommendations && (
                    <div style={{ position:'absolute', top:'10px', right:'10px', background:'rgba(255,255,255,0.18)', color:'#fff', border:'1px solid rgba(255,255,255,0.35)', borderRadius:'20px', padding:'0.35rem 0.8rem', fontSize:'0.75rem', fontWeight:500, letterSpacing:'0.3px' }}>Recommendations Available</div>

                    <h3 className="heading-display" style={{ fontSize:'1.25rem', color:'white', marginBottom:'0.4rem', lineHeight:1.25 }}>Curriculum-aligned teaching resources for your classes.</h3>

                            {cls.schoolName && (
                              <p style={{ color:'var(--jungle-mid)', fontSize:'0.75rem', marginBottom:'0.1rem', fontWeight:600 }}> {cls.schoolName}</p>
                            )}
                            <p style={{ color:'#888', fontSize:'0.78rem' }}>
                              {cls.yearGroup} · {teacherClassStudentCounts[cls.classCode]?.total || 0} student{(teacherClassStudentCounts[cls.classCode]?.total || 0) !== 1 ? 's' : ''}
                            </p>
                          </div>
                          <div style={{ display:'flex', alignItems:'center', gap:'0.75rem' }}>
                            <div onClick={(e)=>{ e.stopPropagation(); setClassCodeModal(cls.classCode); }} style={{ textAlign:'right', cursor:'pointer', padding:'0.3rem', borderRadius:'8px', transition:'background 0.2s' }}
                              onMouseEnter={(e)=>e.currentTarget.style.background='rgba(26,82,56,0.08)'}
                              onMouseLeave={(e)=>e.currentTarget.style.background='transparent'}>
                              <p style={{ fontFamily:'monospace', fontWeight:700, fontSize:'0.9rem', color:'var(--jungle-mid)', letterSpacing:'0.05em', marginBottom:'0.15rem' }}>{cls.classCode}</p>
                              <p style={{ color:'#aaa', fontSize:'0.7rem' }}>class code</p>
                            </div>
                            <span style={{ color:'var(--jungle-mid)', fontSize:'1.1rem', fontWeight:700 }}>></span>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <button onClick={()=>setCurrentScreen('home')} style={{ display:'block', width:'100%', background:'none', border:'none', color:'#999', fontSize:'0.82rem', cursor:'pointer', marginTop:'1.8rem', padding:'0.4rem' }}> Back to Home</button>
              </div>
            </div>

            {classCodeModal && !classCodeFullscreen && (
              <div onClick={() => setClassCodeModal(null)} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.5)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:'1.5rem' }}>
                <div onClick={(e) => e.stopPropagation()} style={{ background:'white', borderRadius:'24px', padding:'2.5rem', textAlign:'center', boxShadow:'0 24px 60px rgba(0,0,0,0.3)', minWidth:'320px' }}>
                  <h3 style={{ fontSize:'1rem', fontWeight:600, color:'#888', marginBottom:'1rem', textTransform:'uppercase', letterSpacing:'0.1em' }}>Class Code</h3>
                  <div style={{ fontFamily:'monospace', fontSize:'4rem', fontWeight:700, color:'var(--jungle-deep)', letterSpacing:'0.3em', marginBottom:'1.5rem', lineHeight:1.2 }}>
                    {classCodeModal}
                  </div>
                  <button onClick={() => { setClassCodeFullscreen(true); }} style={{ width:'100%', background:'linear-gradient(135deg, var(--jungle-mid), var(--jungle-light))', color:'white', border:'none', padding:'0.85rem', borderRadius:'12px', fontSize:'0.95rem', fontWeight:700, cursor:'pointer', marginBottom:'0.7rem', textTransform:'uppercase', letterSpacing:'0.05em' }}>
                     Full Screen Mode
                  </button>
                  <button onClick={() => setClassCodeModal(null)} style={{ width:'100%', background:'#F5F3EE', color:'#666', border:'none', padding:'0.75rem', borderRadius:'12px', fontSize:'0.85rem', fontWeight:600, cursor:'pointer' }}>
                    Close
                  </button>
                </div>
              </div>

            {classCodeFullscreen && (
              <div style={{ position:'fixed', inset:0, background:'#0A2F1F', zIndex:300, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>

                </div>
                <button onClick={() => { setClassCodeFullscreen(false); setClassCodeModal(null); }} style={{ position:'absolute', top:'2rem', right:'2rem', background:'rgba(255,255,255,0.15)', color:'white', border:'2px solid rgba(255,255,255,0.3)', padding:'0.75rem 1.5rem', borderRadius:'12px', fontSize:'0.9rem', fontWeight:700, cursor:'pointer', textTransform:'uppercase', letterSpacing:'0.05em' }}>
                   Exit
                </button>
              </div>
            )}
          </div>
        );

      if (currentScreen === 'resourceHub') {
        const filteredResources = teacherResources.filter(r => {
          if (filterStage && !(r.stage || []).includes(filterStage)) return false;
          if (filterTopic && !(r.topics || []).includes(filterTopic)) return false;
          if (filterFocusArea && !(r.focusAreas || []).includes(filterFocusArea)) return false;
          return true;
        });

        const allStages     = [...new Set(teacherResources.flatMap(r => r.stage     || []))].sort();
        const allTopics     = [...new Set(teacherResources.flatMap(r => r.topics    || []))].sort();
        const allFocusAreas = [...new Set(teacherResources.flatMap(r => r.focusAreas|| []))].sort();

        const selectStyle = { padding:'0.5rem 0.75rem', borderRadius:'10px', border:'1.5px solid #E5E5E5', fontSize:'0.82rem', fontFamily:'DM Sans, sans-serif', background:'white', cursor:'pointer' };

        const tagStyle = (color) => ({
          display:'inline-block', fontSize:'0.68rem', fontWeight:600,
          padding:'0.15rem 0.45rem', borderRadius:'5px', marginRight:'0.25rem', marginBottom:'0.2rem',
          background: color === 'green' ? '#F0FDF4' : color === 'blue' ? '#EFF6FF' : '#FFF7ED',
          color: color === 'green' ? '#16A34A' : color === 'blue' ? '#2563EB' : '#C2410C'
        });

        return (
          <div style={{ position:'fixed', inset:0, background:'var(--mist-light)', display:'flex', flexDirection:'column' }}>

            </div>

                    Library
                  </button>
                  <button onClick={()=>setResourceTab('recommended')}
                    style={{ padding:'0.5rem 1.1rem', borderRadius:'50px', border:'1.5px solid', borderColor: resourceTab === 'recommended' ? 'var(--jungle-deep)' : '#E5E5E5', background: resourceTab === 'recommended' ? 'var(--jungle-deep)' : 'white', color: resourceTab === 'recommended' ? 'white' : '#888', fontSize:'0.82rem', fontWeight:700, cursor:'pointer', transition:'all 0.2s' }}>
                    Recommended
                  </button>
                </div>
