                    style={{ padding:'0.7rem 0.9rem', marginBottom:'1.2rem', width:'100%', borderRadius:'12px', border:'2px solid #E5E5E5', fontSize:'0.95rem', fontFamily:'DM Sans, sans-serif', boxSizing:'border-box', transition:'border-color 0.2s' }}
                    onFocus={(e)=>e.target.style.borderColor='var(--jungle-mid)'} onBlur={(e)=>e.target.style.borderColor='#E5E5E5'}
                  />

                  <button onClick={createClass} disabled={!newClassName.trim() || !newSchoolName.trim() || creatingClass}
                    style={{ width:'100%', padding:'0.75rem', borderRadius:'50px', border:'none', background:(newClassName.trim()&&newSchoolName.trim()&&!creatingClass)?'linear-gradient(135deg, var(--sunset-orange), var(--earth-clay))':'#CCC', color:'white', fontSize:'0.95rem', fontWeight:700, cursor:(newClassName.trim()&&newSchoolName.trim()&&!creatingClass)?'pointer':'not-allowed', textTransform:'uppercase', letterSpacing:'0.08em', transition:'all 0.3s ease' }}>
                    {creatingClass ? 'Creating...' : '+ Create Class'}
                  </button>
                  {classCreated && (
                    <div className="fade-in" style={{ marginTop:'8px', fontSize:'0.8rem', color:'#2e7d32', fontWeight:600 }}>&#10003; Class created successfully.</div>
                  )}
                </div>

                {/* Resource Hub feature block */}
                <div style={{ position:'relative', background:'linear-gradient(135deg, #0F3D2E 0%, #165A42 100%)', borderRadius:'20px', padding:'1.75rem 1.75rem', boxShadow:'0 8px 32px rgba(15,61,46,0.35)', marginBottom:'1.25rem', display:'flex', justifyContent:'space-between', alignItems:'center', gap:'1.5rem' }}>
                  {hasRecommendations && (
                    <div style={{ position:'absolute', top:'10px', right:'10px', background:'rgba(255,255,255,0.18)', color:'#fff', border:'1px solid rgba(255,255,255,0.35)', borderRadius:'20px', padding:'0.35rem 0.8rem', fontSize:'0.75rem', fontWeight:500, letterSpacing:'0.3px' }}>Recommendations Available</div>
                  )}
                  <div style={{ flex:1 }}>
                    <p style={{ fontSize:'0.68rem', fontWeight:700, color:'rgba(255,255,255,0.55)', textTransform:'uppercase', letterSpacing:'0.12em', marginBottom:'0.4rem' }}>Resource Hub</p>
                    <h3 className="heading-display" style={{ fontSize:'1.25rem', color:'white', marginBottom:'0.4rem', lineHeight:1.25 }}>Curriculum-aligned teaching resources for your classes.</h3>
                  </div>
                  <button onClick={()=>setCurrentScreen('resourceHub')}
                    style={{ padding:'0.85rem 1.5rem', borderRadius:'50px', border:'none', background:'white', color:'#0F3D2E', fontSize:'0.88rem', fontWeight:700, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0, boxShadow:'0 4px 14px rgba(0,0,0,0.2)', letterSpacing:'0.01em' }}>
                    Explore Resources
                  </button>
                </div>

                <div>
                  <h3 className="heading-display" style={{ fontSize:'1.1rem', color:'var(--jungle-deep)', marginBottom:'0.7rem' }}>
                    Your Classes <span style={{ fontFamily:'DM Sans, sans-serif', fontWeight:600, fontSize:'0.78rem', color:'var(--jungle-light)', textTransform:'none', letterSpacing:0 }}>({teacherClasses.filter(c => c.teacherEmail === teacherEmail && !c.archived).length})</span>
                  </h3>
                  {teacherClasses.filter(c => c.teacherEmail === teacherEmail && !c.archived).length === 0 ? (
                    <div style={{ background:'#F5F3EE', borderRadius:'14px', padding:'1.2rem', textAlign:'center' }}>
                      <p style={{ color:'#999', fontSize:'0.85rem', fontStyle:'italic' }}>No classes yet. Create one above to get started.</p>
                    </div>
                  ) : (
                    <div style={{ display:'flex', flexDirection:'column', gap:'0.7rem' }}>
                      {teacherClasses.filter(c => c.teacherEmail === teacherEmail && !c.archived).map((cls, i) => (

                              onMouseLeave={(e)=>e.currentTarget.style.background='transparent'}>
                              <p style={{ fontFamily:'monospace', fontWeight:700, fontSize:'0.9rem', color:'var(--jungle-mid)', letterSpacing:'0.05em', marginBottom:'0.15rem' }}>{cls.classCode}</p>

                            </div>
                            <span style={{ color:'var(--jungle-mid)', fontSize:'1.1rem', fontWeight:700 }}>></span>
                          </div>
                        </div>
                      ))}

                </div>

                <button onClick={()=>setCurrentScreen('home')} style={{ display:'block', width:'100%', background:'none', border:'none', color:'#999', fontSize:'0.82rem', cursor:'pointer', marginTop:'1.8rem', padding:'0.4rem' }}> Back to Home</button>

                <div onClick={(e) => e.stopPropagation()} style={{ background:'white', borderRadius:'24px', padding:'2.5rem', textAlign:'center', boxShadow:'0 24px 60px rgba(0,0,0,0.3)', minWidth:'320px' }}>
                  <h3 style={{ fontSize:'1rem', fontWeight:600, color:'#888', marginBottom:'1rem', textTransform:'uppercase', letterSpacing:'0.1em' }}>Class Code</h3>
                  <div style={{ fontFamily:'monospace', fontSize:'4rem', fontWeight:700, color:'var(--jungle-deep)', letterSpacing:'0.3em', marginBottom:'1.5rem', lineHeight:1.2 }}>
                    {classCodeModal}
                  </div>
                  <button onClick={() => { setClassCodeFullscreen(true); }} style={{ width:'100%', background:'linear-gradient(135deg, var(--jungle-mid), var(--jungle-light))', color:'white', border:'none', padding:'0.85rem', borderRadius:'12px', fontSize:'0.95rem', fontWeight:700, cursor:'pointer', marginBottom:'0.7rem', textTransform:'uppercase', letterSpacing:'0.05em' }}>
                     Full Screen Mode
                  </button>
                  <button onClick={() => setClassCodeModal(null)} style={{ width:'100%', background:'#F5F3EE', color:'#666', border:'none', padding:'0.75rem', borderRadius:'12px', fontSize:'0.85rem', fontWeight:600, cursor:'pointer' }}>
                    Close

            {classCodeFullscreen && (
              <div style={{ position:'fixed', inset:0, background:'#0A2F1F', zIndex:300, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>

      }

      if (currentScreen === 'resourceHub') {
        const filteredResources = teacherResources.filter(r => {
          if (filterStage && !(r.stage || []).includes(filterStage)) return false;
          if (filterTopic && !(r.topics || []).includes(filterTopic)) return false;
          if (filterFocusArea && !(r.focusAreas || []).includes(filterFocusArea)) return false;
          return true;
        });

        const allStages     = [...new Set(teacherResources.flatMap(r => r.stage     || []))].sort();
        const allTopics     = [...new Set(teacherResources.flatMap(r => r.topics    || []))].sort();
        const allFocusAreas = [...new Set(teacherResources.flatMap(r => r.focusAreas|| []))].sort();

        const selectStyle = { padding:'0.5rem 0.75rem', borderRadius:'10px', border:'1.5px solid #E5E5E5', fontSize:'0.82rem', fontFamily:'DM Sans, sans-serif', background:'white', cursor:'pointer' };

        const tagStyle = (color) => ({
          display:'inline-block', fontSize:'0.68rem', fontWeight:600,
          padding:'0.15rem 0.45rem', borderRadius:'5px', marginRight:'0.25rem', marginBottom:'0.2rem',
          background: color === 'green' ? '#F0FDF4' : color === 'blue' ? '#EFF6FF' : '#FFF7ED',
          color: color === 'green' ? '#16A34A' : color === 'blue' ? '#2563EB' : '#C2410C'
        });

        return (
          <div style={{ position:'fixed', inset:0, background:'var(--mist-light)', display:'flex', flexDirection:'column' }}>
            {/* Header */}
            <div style={{ background:'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)', padding:'1rem 1.5rem', boxShadow:'0 4px 20px rgba(0,0,0,0.1)', display:'flex', justifyContent:'space-between', alignItems:'center', flexShrink:0 }}>
              <div style={{ display:'flex', alignItems:'center', gap:'0.8rem' }}>
                <button onClick={()=>setCurrentScreen('teacherDashboard')} style={{ background:'rgba(255,255,255,0.15)', border:'1px solid rgba(255,255,255,0.3)', color:'white', width:'34px', height:'34px', borderRadius:'50%', cursor:'pointer', fontSize:'1.1rem', display:'flex', alignItems:'center', justifyContent:'center' }}>&#8592;</button>
                <div>
                  <h1 className="heading-display" style={{ fontSize:'clamp(1.1rem, 2.8vw, 1.45rem)', color:'white', lineHeight:1.2 }}>Resource Hub</h1>
                  <p style={{ color:'rgba(255,255,255,0.7)', fontSize:'0.75rem' }}>Curriculum-aligned teaching resources</p>
                </div>
              </div>
            </div>
            <div style={{ flex:1, overflowY:'auto', padding:'1.5rem' }}>
              <div style={{ maxWidth:'820px', margin:'0 auto' }}>

                {/* Tab Switcher */}
                <div style={{ display:'flex', gap:'0.5rem', marginBottom:'1.25rem' }}>
                  <button onClick={()=>setResourceTab('library')}
                    style={{ padding:'0.5rem 1.1rem', borderRadius:'50px', border:'1.5px solid', borderColor: resourceTab === 'library' ? 'var(--jungle-deep)' : '#E5E5E5', background: resourceTab === 'library' ? 'var(--jungle-deep)' : 'white', color: resourceTab === 'library' ? 'white' : '#888', fontSize:'0.82rem', fontWeight:700, cursor:'pointer', transition:'all 0.2s' }}>
                    Library
                  </button>
                  <button onClick={()=>setResourceTab('recommended')}
                    style={{ padding:'0.5rem 1.1rem', borderRadius:'50px', border:'1.5px solid', borderColor: resourceTab === 'recommended' ? 'var(--jungle-deep)' : '#E5E5E5', background: resourceTab === 'recommended' ? 'var(--jungle-deep)' : 'white', color: resourceTab === 'recommended' ? 'white' : '#888', fontSize:'0.82rem', fontWeight:700, cursor:'pointer', transition:'all 0.2s' }}>
                    Recommended
                  </button>
                </div>

                {resourceTab === 'recommended' ? (
                  Object.keys(recommendationsByClass).length === 0 ? (
                    <p style={{ color:'#bbb', fontSize:'0.85rem', fontStyle:'italic', textAlign:'center', padding:'2rem 0' }}>No recommendations available. Submit a class session to generate recommendations.</p>
                  ) : (() => {
                    const sortedRecommendations = Object.entries(recommendationsByClass)
                      .sort((a, b) => {
                        const aFocus = Math.min(
                          a[1].classData.focusAverages?.behaviour ?? 100,
                          a[1].classData.focusAverages?.scientificLanguage ?? 100,
                          a[1].classData.focusAverages?.dataEvidence ?? 100
                        );
                        const bFocus = Math.min(
                          b[1].classData.focusAverages?.behaviour ?? 100,
                          b[1].classData.focusAverages?.scientificLanguage ?? 100,
                          b[1].classData.focusAverages?.dataEvidence ?? 100
                        );
                        return aFocus - bFocus;
                      });
                    return sortedRecommendations.map(([classId, data]) => (
                      <div key={classId} style={{ marginBottom:'2rem' }}>
                        <div style={{ marginBottom:'0.75rem', paddingBottom:'0.5rem', borderBottom:'1.5px solid #E5E5E5' }}>
                          <h4 style={{ fontWeight:700, color:'var(--jungle-deep)', fontSize:'0.95rem', marginBottom:'0.15rem' }}>{data.classData.className || classId} {data.classData.stage ? `— ${data.classData.stage}` : ''}</h4>
                          <p style={{ fontSize:'0.78rem', color:'#888' }}>Focus: <strong style={{ color:'var(--jungle-mid)' }}>{data.classData.weakestFocusArea}</strong> &nbsp;·&nbsp; Band: <strong style={{ color:'var(--jungle-mid)', textTransform:'capitalize' }}>{data.classData.difficultyBand}</strong></p>
                        </div>
                        <div style={{ background:'#F4F8F6', padding:'0.85rem 1.1rem', borderRadius:'10px', marginBottom:'1rem', fontSize:'0.85rem', color:'#1B5E20' }}>
                          <div style={{ marginBottom:'0.35rem' }}><strong>Quiz Average:</strong> {data.classData.quizAverage ?? 0}%</div>
                          <div style={{ marginBottom:'0.35rem' }}><strong>Area of Growth:</strong> {data.classData.weakestFocusArea}</div>
                          <div style={{ opacity:0.85 }}>
                            Behaviour: {data.classData.focusAverages?.behaviour ?? 0}% |
                            Writing: {data.classData.focusAverages?.scientificLanguage ?? 0}% |
                            Detail: {data.classData.focusAverages?.dataEvidence ?? 0}%
                          </div>
                        </div>
                        <div style={{ display:'flex', flexDirection:'column', gap:'1rem' }}>
                          {data.resources.map(r => (
                            <div key={r.id} style={{ border:'1px solid #E0EFE6', borderLeft:'4px solid #2E7D32', background:'#FCFEFD', borderRadius:'8px', padding:'0.5rem', marginBottom:'1rem' }}>
                              <div className="fade-in" style={{ background:'white', borderRadius:'16px', padding:'1.25rem 1.5rem', boxShadow:'0 4px 16px rgba(0,0,0,0.07)', display:'grid', gridTemplateColumns:'1fr 220px', gap:'1.25rem', alignItems:'start' }}>
                                <div>
                                  <p style={{ fontWeight:700, color:'var(--jungle-deep)', fontSize:'1rem', marginBottom:'0.15rem' }}>{r.title}</p>
                                  {r.type && <span style={{ fontSize:'0.7rem', color:'#999', textTransform:'capitalize', marginBottom:'0.5rem', display:'inline-block' }}>{r.type}</span>}
                                  {r.description && <p style={{ color:'#666', fontSize:'0.82rem', lineHeight:1.55, marginBottom:'0.7rem' }}>{r.description}</p>}
                                  <div style={{ display:'flex', flexWrap:'wrap', gap:'0.1rem', marginBottom:'0.4rem' }}>
                                    {(r.stage      || []).map(s => <span key={s} style={tagStyle('green')}>{s}</span>)}
                                    {(r.topics     || []).map(t => <span key={t} style={tagStyle('blue')}>{t}</span>)}
                                    {(r.focusAreas || []).map(f => <span key={f} style={tagStyle('orange')}>{f.replace(/_/g,' ')}</span>)}
                                  </div>
                                  {(r.syllabusLinks || []).length > 0 && (
                                    <div style={{ display:'flex', flexWrap:'wrap', gap:'0.25rem', marginTop:'0.25rem' }}>
                                      {(r.syllabusLinks || []).map(l => (
                                        <span key={l.code} title={l.description?.replace(/\\'9[67]/g, '').replace(/\\b7/g, '')} style={{ fontSize:'0.68rem', fontWeight:700, color:'var(--jungle-mid)', background:'#F0FDF4', padding:'0.15rem 0.45rem', borderRadius:'5px', cursor:'default' }}>{l.code}</span>
                                      ))}
                                    </div>
                                  )}
                                </div>
                                <div style={{ display:'flex', flexDirection:'column', gap:'0.75rem' }}>
                                  {renderResourceGraphic(r.type)}
                                  <a href={r.url} target="_blank" rel="noopener noreferrer"
                                    style={{ display:'block', width:'100%', padding:'0.65rem 0', borderRadius:'10px', background:'linear-gradient(135deg, var(--jungle-deep), var(--jungle-mid))', color:'white', fontSize:'0.85rem', fontWeight:700, textDecoration:'none', textAlign:'center', boxSizing:'border-box' }}>
                                    Open Resource
                                  </a>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ));
                  })()
                ) : (
                  <>
                    {/* Filters */}
                    <div style={{ display:'flex', gap:'0.75rem', flexWrap:'wrap', marginBottom:'1.25rem', alignItems:'center' }}>
                      <select value={filterStage} onChange={e=>setFilterStage(e.target.value)} style={selectStyle}>
                        <option value="">All Stages</option>
                        {allStages.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                      <select value={filterTopic} onChange={e=>setFilterTopic(e.target.value)} style={selectStyle}>
                        <option value="">All Topics</option>
                        {allTopics.map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                      <select value={filterFocusArea} onChange={e=>setFilterFocusArea(e.target.value)} style={selectStyle}>
                        <option value="">All Focus Areas</option>
                        {allFocusAreas.map(f => <option key={f} value={f}>{f.replace(/_/g,' ')}</option>)}
                      </select>
                      {(filterStage || filterTopic || filterFocusArea) && (
                        <button onClick={()=>{ setFilterStage(''); setFilterTopic(''); setFilterFocusArea(''); }}
                          style={{ padding:'0.5rem 0.75rem', borderRadius:'10px', border:'1.5px solid #E5E5E5', background:'white', color:'#888', fontSize:'0.78rem', fontWeight:600, cursor:'pointer' }}>
                          Clear filters
                        </button>
                      )}
                    </div>

                    {/* Loading / Empty / List */}
                    {resourceLoading ? (
                      <p style={{ color:'#aaa', fontSize:'0.85rem', fontStyle:'italic', textAlign:'center', padding:'2rem 0' }}>Loading resources...</p>
                    ) : filteredResources.length === 0 ? (
                      <p style={{ color:'#bbb', fontSize:'0.85rem', fontStyle:'italic', textAlign:'center', padding:'2rem 0' }}>No resources available for the selected filters.</p>
                    ) : (
                      <div style={{ display:'flex', flexDirection:'column', gap:'1rem' }}>
                        {filteredResources.map(r => (
                          <div key={r.id} className="fade-in" style={{ background:'white', borderRadius:'16px', padding:'1.25rem 1.5rem', boxShadow:'0 4px 16px rgba(0,0,0,0.07)', display:'grid', gridTemplateColumns:'1fr 220px', gap:'1.25rem', alignItems:'start' }}>

                            {/* Left column — 70% */}
                            <div>
                              <p style={{ fontWeight:700, color:'var(--jungle-deep)', fontSize:'1rem', marginBottom:'0.15rem' }}>{r.title}</p>
                              {r.type && <span style={{ fontSize:'0.7rem', color:'#999', textTransform:'capitalize', marginBottom:'0.5rem', display:'inline-block' }}>{r.type}</span>}
                              {r.description && <p style={{ color:'#666', fontSize:'0.82rem', lineHeight:1.55, marginBottom:'0.7rem' }}>{r.description}</p>}
                              <div style={{ display:'flex', flexWrap:'wrap', gap:'0.1rem', marginBottom:'0.4rem' }}>
                                {(r.stage      || []).map(s => <span key={s} style={tagStyle('green')}>{s}</span>)}
                                {(r.topics     || []).map(t => <span key={t} style={tagStyle('blue')}>{t}</span>)}
                                {(r.focusAreas || []).map(f => <span key={f} style={tagStyle('orange')}>{f.replace(/_/g,' ')}</span>)}
                              </div>
                              {(r.syllabusLinks || []).length > 0 && (
                                <div style={{ display:'flex', flexWrap:'wrap', gap:'0.25rem', marginTop:'0.25rem' }}>
                                  {(r.syllabusLinks || []).map(l => (
                                    <span key={l.code} title={l.description?.replace(/\\'9[67]/g, '').replace(/\\b7/g, '')} style={{ fontSize:'0.68rem', fontWeight:700, color:'var(--jungle-mid)', background:'#F0FDF4', padding:'0.15rem 0.45rem', borderRadius:'5px', cursor:'default' }}>{l.code}</span>
                                  ))}
                                </div>
                              )}
                            </div>

                            {/* Right column — 30% */}
                            <div style={{ display:'flex', flexDirection:'column', gap:'0.75rem' }}>
                              {/* Resource Type Graphic */}
                              {renderResourceGraphic(r.type)}
                              {/* Open button */}
                              <a href={r.url} target="_blank" rel="noopener noreferrer"
                                style={{ display:'block', width:'100%', padding:'0.65rem 0', borderRadius:'10px', background:'linear-gradient(135deg, var(--jungle-deep), var(--jungle-mid))', color:'white', fontSize:'0.85rem', fontWeight:700, textDecoration:'none', textAlign:'center', boxSizing:'border-box' }}>
                                Open Resource
                              </a>
                            </div>

                          </div>
                        ))}
                      </div>
                    )}
                  </>
                )}

              </div>
            </div>
          </div>
        );
      }

      if (currentScreen === 'classDetails' && selectedClass) {
        const cls = teacherClasses.find(c => c.classCode === selectedClass);
        if (!cls) { setCurrentScreen('teacherDashboard'); return null; }

        // All student data now comes from Firestore via the live listener
        const totalStudents = firestoreStudents.length;
        const avgPoints = totalStudents > 0 ? Math.round(firestoreStudents.reduce((sum, s) => sum + (s.totalPoints || 0), 0) / totalStudents) : 0;
        const totalBadges = firestoreStudents.reduce((sum, s) => sum + (s.badges ? s.badges.length : 0), 0);
        const completedCount = firestoreStudents.filter(s => s.completed).length;
        const completedStudents = firestoreStudents.filter(s => s.completed);
        const avgQuizPercentage = completedStudents.length > 0 
          ? Math.round(completedStudents.reduce((sum, s) => sum + (s.quizPercentage || 0), 0) / completedStudents.length) 
          : 0;

        const downloadCSV = () => {
          const header = ['Name','Points','Badges Earned','Quiz Score','Completed','Last Active','Observations'];
          const rows = firestoreStudents.map(s => {
            const lastBadge = s.badges && s.badges.length > 0 ? s.badges[s.badges.length - 1] : null;
            // Quiz score: aggregate first-attempt correctness across all badges
            let totalQ = 0, correctQ = 0;
            (s.badges || []).forEach(b => {
              if (b.quizResults) {
                b.quizResults.forEach(r => { totalQ++; if (r.correctOnFirstAttempt) correctQ++; });
              }
            });
            const quizScoreStr = totalQ > 0 ? `${Math.round((correctQ / totalQ) * 100)}%` : '—';
            // Observations: one label per animal
            const obsStr = (s.badges || [])
              .filter(b => b.observation)
              .map(b => `${b.animal}: ${b.observation}`)
              .join(' | ');
            return [
              s.name,
              s.totalPoints || 0,
              s.badges ? s.badges.length : 0,
              quizScoreStr,
              s.completed ? 'Yes' : 'No',
              s.completedAt ? s.completedAt.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : (lastBadge && lastBadge.timestamp ? new Date(lastBadge.timestamp).toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }) : '—'),
              obsStr || '—'
            ];
          });
          const csv = [header, ...rows].map(row => row.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\\\\n');
          const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `${cls.className}-${cls.classCode}-results.csv`; a.click();
          URL.revokeObjectURL(url);
        };

        const resetClass = async () => {
          if (!window.confirm(`Reset all student data for ${cls.className}? This cannot be undone.`)) return;
          try {
            const snapshot = await window.db.collection('classes').doc(selectedClass).collection('students').get();
            const batch = window.db.batch();
            snapshot.docs.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
          } catch (err) {
            alert('Failed to reset class data. Please check your connection.');
          }
        };

        const archiveClass = async () => {
          if (!window.confirm(`Archive ${cls.className}? It will be hidden from your active classes.`)) return;
          try {
            await window.db.collection('teachers').doc(teacherEmail)
              .collection('classes').doc(selectedClass)
              .update({ archived: true });
            setCurrentScreen('teacherDashboard');
          } catch (err) {
            console.error('Failed to archive class:', err);
            alert('Failed to archive class. Please try again.');
          }
        };

        const handleSubmitAll = async () => {
          const incompleteCount = firestoreStudents.filter(s => s.status !== 'complete').length;
          if (incompleteCount === 0) { alert('All students are already marked complete.'); return; }
          if (!window.confirm(`Mark ${incompleteCount} incomplete student${incompleteCount !== 1 ? 's' : ''} as complete? This cannot be undone.`)) return;
          setSubmittingAll(true);
          try {
            const snapshot = await window.db.collection('classes').doc(selectedClass).collection('students').get();
            const batch = window.db.batch();

            // ---------- AGGREGATE CLASS PERFORMANCE ----------
            let studentCount = 0;
            let quizTotalSum = 0;
            let behaviourSum = 0;
            let detailSum = 0;
            let literacySum = 0;
            let badgeCount = 0;

            snapshot.forEach(doc => {
              const data = doc.data();
              if (typeof data.quizPercentage === 'number') {
                quizTotalSum += data.quizPercentage;
              }
              studentCount++;
              if (Array.isArray(data.badges)) {
                data.badges.forEach(badge => {
                  const obs = badge.observationScore;
                  if (obs && typeof obs === 'object') {
                    behaviourSum += ((obs.behaviour || 0) / 5) * 100;
                    detailSum += ((obs.detail || 0) / 5) * 100;
                    literacySum += ((obs.writing || 0) / 5) * 100;
                  } else {
                    if (typeof badge.behaviourScore === 'number') behaviourSum += (badge.behaviourScore / 15) * 100;
                    if (typeof badge.detailScore === 'number') detailSum += (badge.detailScore / 15) * 100;
                    if (typeof badge.literacyScore === 'number') literacySum += (badge.literacyScore / 15) * 100;
                  }
                  badgeCount++;
                });
              }
            });

            const quizAverage = studentCount > 0 ? Math.round(quizTotalSum / studentCount) : 0;
            const behaviourAverage = badgeCount > 0 ? Math.round(behaviourSum / badgeCount) : 0;
            const detailAverage = badgeCount > 0 ? Math.round(detailSum / badgeCount) : 0;
            const literacyAverage = badgeCount > 0 ? Math.round(literacySum / badgeCount) : 0;

            let weakestFocusArea = 'Behaviour';
            let lowestValue = behaviourAverage;
            if (detailAverage < lowestValue) { lowestValue = detailAverage; weakestFocusArea = 'Scientific Language'; }
            if (literacyAverage < lowestValue) { lowestValue = literacyAverage; weakestFocusArea = 'Data & Evidence'; }

            let difficultyBand = 'intervention';
            if (quizAverage >= 80) { difficultyBand = 'extension'; }
            else if (quizAverage >= 60) { difficultyBand = 'consolidation'; }
            // ---------- END AGGREGATE ----------

            snapshot.docs.forEach(doc => {
              if ((doc.data().status || 'incomplete') !== 'complete') {
                batch.update(doc.ref, {
                  status: 'complete',
                  completed: true,
                  completedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              }
            });

            console.log("CLASS ID BEING UPDATED:", selectedClass);
            console.log("SNAPSHOT SIZE:", snapshot.size);
            const classRef = window.db.collection('classes').doc(selectedClass);
            batch.set(classRef, {
              sessionClosed: true,
              quizAverage: quizAverage,
              focusAverages: {
                behaviour: behaviourAverage,
                scientificLanguage: detailAverage,
                dataEvidence: literacyAverage
              },
              weakestFocusArea: weakestFocusArea,
              difficultyBand: difficultyBand,
              submittedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            console.log("AGGREGATES:", {
              quizAverage,
              behaviourAverage,
              detailAverage,
              literacyAverage,
              weakestFocusArea,
              difficultyBand
            });

            await batch.commit();
            console.log("BATCH COMMITTED");
            setSubmitSuccess(true);
            setTimeout(() => setSubmitSuccess(false), 2500);
          } catch (err) {
            console.error('Submit all failed:', err);
            alert('Failed to submit all. Please check your connection and try again.');
          } finally {
            setSubmittingAll(false);
          }
        };

        return (
          <div style={{ position:'fixed', inset:0, background:'var(--mist-light)', display:'flex', flexDirection:'column' }}>
            <div style={{ background:'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)', padding:'1rem 1.5rem', boxShadow:'0 4px 20px rgba(0,0,0,0.1)', flexShrink:0 }}>
              <div style={{ maxWidth:'720px', margin:'0 auto', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div style={{ display:'flex', alignItems:'center', gap:'0.7rem' }}>
                  <button onClick={()=>setCurrentScreen('teacherDashboard')} style={{ background:'rgba(255,255,255,0.15)', border:'1px solid rgba(255,255,255,0.3)', color:'white', width:'34px', height:'34px', borderRadius:'50%', cursor:'pointer', fontSize:'1.1rem', display:'flex', alignItems:'center', justifyContent:'center' }}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6" /></svg></button>
                  <div>
                    <h1 className="heading-display" style={{ fontSize:'clamp(1.1rem, 2.8vw, 1.45rem)', color:'white', lineHeight:1.2 }}>{cls.className?.replace(/\\b7/g, '')}</h1>
                    <p style={{ color:'rgba(255,255,255,0.7)', fontSize:'0.75rem' }}>{cls.yearGroup} · Code: <span style={{ fontFamily:'monospace', fontWeight:700 }}>{cls.classCode}</span></p>
                  </div>
                </div>
                <div style={{ display:'flex', alignItems:'center', gap:'0.5rem' }}>
                  {!firestoreLoading && (
                    <div style={{ display:'flex', alignItems:'center', gap:'0.3rem', background:'rgba(46,125,85,0.3)', border:'1px solid rgba(46,125,85,0.5)', borderRadius:'14px', padding:'0.25rem 0.55rem' }}>
                      <div style={{ width:'7px', height:'7px', borderRadius:'50%', background:'#34d399', boxShadow:'0 0 6px rgba(52,211,153,0.6)' }} />
                      <span style={{ color:'#34d399', fontSize:'0.68rem', fontWeight:600 }}>LIVE</span>
                    </div>
                  )}
                  <button onClick={downloadCSV} disabled={firestoreLoading} style={{ background:'rgba(255,255,255,0.18)', border:'1px solid rgba(255,255,255,0.35)', color:'white', padding:'0.45rem 0.85rem', borderRadius:'20px', cursor:firestoreLoading?'not-allowed':'pointer', fontSize:'0.78rem', fontWeight:600, display:'flex', alignItems:'center', gap:'0.35rem', opacity:firestoreLoading?0.5:1 }}>
                     CSV
                  </button>
                </div>
              </div>
            </div>

            {firestoreLoading ? (
              <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'1rem' }}>
                <div style={{ width:'40px', height:'40px', border:'3px solid rgba(26,82,56,0.15)', borderTop:'3px solid var(--jungle-mid)', borderRadius:'50%', animation:'spin 0.7s linear infinite' }} />
                <p style={{ color:'#888', fontSize:'0.85rem' }}>Fetching student data...</p>
              </div>
            ) : (
              <>
                <div style={{ flexShrink:0, padding:'1rem 1.5rem 0' }}>
                  <div style={{ maxWidth:'720px', margin:'0 auto', display:'grid', gridTemplateColumns:'repeat(5, 1fr)', gap:'0.7rem' }}>
                    {[
                      { label:'Students', value:totalStudents, icon:'' },
                      { label:'Avg Points', value:avgPoints, icon:'' },
                      { label:'Total Badges', value:totalBadges, icon:'' },
                      { label:'Completed', value:completedCount, icon:'' },
                      { label:'Avg Quiz %', value:`${avgQuizPercentage}%`, icon:'', highlight:true }
                    ].map(stat => (
                      <div key={stat.label} style={{ background: stat.highlight ? 'linear-gradient(135deg, var(--jungle-mid), var(--jungle-light))' : 'white', borderRadius:'12px', padding:'0.7rem 0.5rem', textAlign:'center', boxShadow:'0 2px 8px rgba(0,0,0,0.06)' }}>
                        <div style={{ fontSize:'1.3rem', marginBottom:'0.15rem' }}>{stat.icon}</div>
                        <div style={{ fontWeight:700, color: stat.highlight ? 'white' : 'var(--jungle-deep)', fontSize:'1.1rem', lineHeight:1.2 }}>{stat.value}</div>
                        <div style={{ color: stat.highlight ? 'rgba(255,255,255,0.85)' : '#999', fontSize:'0.68rem', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.04em' }}>{stat.label}</div>
                      </div>
                    ))}
                  </div>
                </div>

                <div style={{ flex:1, overflowY:'auto', padding:'1rem 1.5rem 1.5rem' }}>
                  <div style={{ maxWidth:'720px', margin:'0 auto' }}>

                    {/* Class Insights */}
                    {(() => {
                      const students = firestoreStudents;
                      if (students.length === 0) return null;

                      // Most visited animals
                      const animalCounts = {};
                      students.forEach(s => {
                        (s.badges || []).forEach(b => {
                          if (b.animal) animalCounts[b.animal] = (animalCounts[b.animal] || 0) + 1;
                        });
                      });
                      const topAnimals = Object.entries(animalCounts).sort((a,b) => b[1]-a[1]).slice(0,6);
                      const maxAnimalCount = topAnimals.length > 0 ? topAnimals[0][1] : 1;

                      // Quiz distribution
                      const quizBuckets = {'0–25':0,'26–50':0,'51–75':0,'76–100':0};
                      students.forEach(s => {
                        const q = s.quizPercentage || 0;
                        if (q <= 25) quizBuckets['0–25']++;
                        else if (q <= 50) quizBuckets['26–50']++;
                        else if (q <= 75) quizBuckets['51–75']++;
                        else quizBuckets['76–100']++;
                      });
                      const maxQuizBucket = Math.max(...Object.values(quizBuckets), 1);

                      // Writing radar averages (from badges)
                      let totB = 0, totD = 0, totW = 0, cnt = 0;
                      students.forEach(s => {
                        (s.badges || []).forEach(b => {
                          if (b.observationScore && typeof b.observationScore === 'object') {
                            totB += b.observationScore.behaviour || 0;
                            totD += b.observationScore.detail || 0;
                            totW += b.observationScore.writing || 0;
                            cnt++;
                          }
                        });
                      });
                      const avgB = cnt ? +(totB/cnt).toFixed(1) : 0;
                      const avgD = cnt ? +(totD/cnt).toFixed(1) : 0;
                      const avgW = cnt ? +(totW/cnt).toFixed(1) : 0;

                      // SVG radar helpers
                      const cx = 80, cy = 80, r = 58;
                      const axes = [
                        { label:'Behaviour', val: avgB/5, angle: -90 },
                        { label:'Detail',    val: avgD/5, angle: 30  },
                        { label:'Writing',   val: avgW/5, angle: 150 },
                      ];
                      const pt = (ratio, angle) => {
                        const a = (angle * Math.PI) / 180;
                        return [cx + ratio * r * Math.cos(a), cy + ratio * r * Math.sin(a)];
                      };
                      const gridLevels = [0.25, 0.5, 0.75, 1];
                      const dataPoints = axes.map(ax => pt(ax.val, ax.angle));
                      const dataPath = dataPoints.map((p,i) => `${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ') + 'Z';

                      return (
                        <div style={{ marginBottom:'1rem' }}>
                          <h3 style={{ fontSize:'1rem', fontWeight:700, color:'var(--jungle-deep)', marginBottom:'0.75rem' }}>📊 Class Insights</h3>

                            {/* Most Visited Animals */}
                            <div style={{ background:'white', borderRadius:'12px', padding:'1.1rem 1.2rem', boxShadow:'0 2px 8px rgba(0,0,0,0.06)', marginBottom:'0.75rem' }}>
                              <p style={{ fontSize:'0.72rem', fontWeight:700, color:'#888', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:'0.75rem' }}>Most Visited Animals</p>
                              {topAnimals.length === 0
                                ? <p style={{ fontSize:'0.78rem', color:'#bbb' }}>No data yet</p>
                                : topAnimals.map(([name, count]) => (
                                  <div key={name} style={{ marginBottom:'0.5rem' }}>
                                    <div style={{ display:'flex', justifyContent:'space-between', fontSize:'0.78rem', color:'#555', marginBottom:'0.2rem' }}>
                                      <span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:'80%' }}>{name}</span>
                                      <span style={{ fontWeight:700, color:'var(--jungle-mid)', flexShrink:0 }}>{count}</span>
                                    </div>
                                    <div style={{ height:'7px', borderRadius:'4px', background:'#EEE', overflow:'hidden' }}>
                                      <div style={{ height:'100%', width:`${(count/maxAnimalCount)*100}%`, background:'linear-gradient(90deg, var(--jungle-mid), var(--jungle-light))', borderRadius:'4px', transition:'width 0.4s' }} />
                                    </div>
                                  </div>
                                ))
                              }
                            </div>

                            {/* Quiz Distribution */}
                            <div style={{ background:'white', borderRadius:'12px', padding:'1.1rem 1.2rem', boxShadow:'0 2px 8px rgba(0,0,0,0.06)', marginBottom:'0.75rem' }}>
                              <p style={{ fontSize:'0.72rem', fontWeight:700, color:'#888', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:'0.75rem' }}>Quiz Distribution</p>
                              <div style={{ display:'flex', alignItems:'flex-end', gap:'0.6rem', height:'110px', paddingBottom:'0.2rem' }}>
                                {Object.entries(quizBuckets).map(([label, val]) => (
                                  <div key={label} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:'0.25rem' }}>
                                    <span style={{ fontSize:'0.72rem', fontWeight:700, color:'var(--jungle-mid)' }}>{val}</span>
                                    <div style={{ width:'100%', height:`${Math.max((val/maxQuizBucket)*80, val > 0 ? 6 : 0)}px`, background:'linear-gradient(180deg, var(--jungle-light), var(--jungle-mid))', borderRadius:'4px 4px 0 0', transition:'height 0.4s' }} />
                                    <span style={{ fontSize:'0.65rem', color:'#999', textAlign:'center', lineHeight:1.2 }}>{label}</span>
                                  </div>
                                ))}
                              </div>
                            </div>

                            {/* Writing Radar */}
                            <div style={{ background:'white', borderRadius:'12px', padding:'1.1rem 1.2rem', boxShadow:'0 2px 8px rgba(0,0,0,0.06)', marginBottom:'0.75rem', display:'flex', flexDirection:'column', alignItems:'center' }}>
                              <p style={{ fontSize:'0.72rem', fontWeight:700, color:'#888', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:'0.5rem', alignSelf:'flex-start' }}>Writing Scores</p>
                              {cnt === 0
                                ? <p style={{ fontSize:'0.78rem', color:'#bbb', textAlign:'center', marginTop:'0.5rem' }}>No data yet</p>
                                : <svg viewBox="0 0 160 160" style={{ width:'100%', maxWidth:'220px' }}>
                                    {/* Grid */}
                                    {gridLevels.map(lvl => {
                                      const pts = axes.map(ax => pt(lvl, ax.angle));
                                      return <polygon key={lvl} points={pts.map(p=>p.join(',')).join(' ')} fill="none" stroke="#E5E5E5" strokeWidth="0.8" />;
                                    })}
                                    {/* Axis lines */}
                                    {axes.map(ax => {
                                      const [x,y] = pt(1, ax.angle);
                                      return <line key={ax.label} x1={cx} y1={cy} x2={x} y2={y} stroke="#E5E5E5" strokeWidth="0.8" />;
                                    })}
                                    {/* Data */}
                                    <path d={dataPath} fill="rgba(46,125,85,0.2)" stroke="var(--jungle-mid)" strokeWidth="1.5" />
                                    {dataPoints.map((p,i) => <circle key={i} cx={p[0]} cy={p[1]} r="3" fill="var(--jungle-mid)" />)}
                                    {/* Labels */}
                                    {axes.map(ax => {
                                      const [lx, ly] = pt(1.28, ax.angle);
                                      return (
                                        <text key={ax.label} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="8.5" fill="#555" fontFamily="DM Sans, sans-serif">
                                          {ax.label}
                                        </text>
                                      );
                                    })}
                                    {/* Score labels */}
                                    {axes.map((ax, i) => (
                                      <text key={`v${i}`} x={dataPoints[i][0]} y={dataPoints[i][1]-5} textAnchor="middle" fontSize="7.5" fill="var(--jungle-deep)" fontWeight="bold" fontFamily="DM Sans, sans-serif">
                                        {[avgB,avgD,avgW][i]}
                                      </text>
                                    ))}
                                  </svg>
                              }
                            </div>

                            {/* Strength / Focus / Teaching Actions */}
                            {cnt > 0 && (() => {
                              const stage = adminClassData?.stage ? parseInt(adminClassData.stage) : 4;
                              const domainList = [
                                { key:'behaviour', label:'Behaviour', icon:'🧠', avg: avgB, color:'#059669', desc:'identifying what animals do' },
                                { key:'detail',    label:'Detail',    icon:'🔍', avg: avgD, color:'#0284C7', desc:'using supporting ideas and evidence' },
                                { key:'writing',   label:'Writing',   icon:'✏️', avg: avgW, color:'#7C3AED', desc:'constructing clear sentences' },
                              ];
                              const sorted = [...domainList].sort((a,b) => b.avg - a.avg);
                              const strongest = sorted[0];
                              const weakest   = sorted[sorted.length - 1];

                              const stagePrefix = stage <= 2
                                ? 'Students are building observation skills.'
                                : stage === 3
                                ? 'Students are developing observation and explanation skills.'
                                : stage === 5
                                ? 'Students should explain their observations using clear reasoning.'
                                : 'Students should describe observations and begin to explain them.';

                              const actions = {
                                behaviour: stage <= 2
                                  ? 'Encourage students to say what the animal is doing — any word is a great start.'
                                  : stage === 5
                                  ? 'Help students link observations to scientific concepts such as adaptation or survival.'
                                  : 'Help students identify and name specific behaviours they can see at each exhibit.',
                                detail: stage <= 2
                                  ? 'Ask students to add one more thing they noticed — a colour, size, or sound.'
                                  : stage === 5
                                  ? 'Prompt students to include specific evidence and explain the significance of each detail.'
                                  : 'Encourage students to include specific features, sounds, or environmental details.',
                                writing: stage <= 2
                                  ? 'Support students to write a full sentence — "The koala was sleeping." is excellent.'
                                  : stage === 5
                                  ? 'Model extended response structure: observation → explanation → link to survival or ecosystem.'
                                  : 'Encourage full sentences with capital letters, punctuation, and at least one clear idea.',
                              };

                              // Common issues scan
                              let noExplanationCount = 0, noBehaviourCount = 0, lowDetailCount = 0, obsCount = 0;
                              students.forEach(s => (s.badges || []).forEach(b => {
                                const obs = b.observationScore;
                                if (!obs || typeof obs !== 'object') return;
                                obsCount++;
                                if ((obs.behaviour || 0) <= 2) noBehaviourCount++;
                                if ((obs.detail    || 0) <= 2) lowDetailCount++;
                                if (!obs.extractedEvidence?.hasExplanation) noExplanationCount++;
                              }));
                              const noBehPct  = obsCount ? Math.round((noBehaviourCount  / obsCount) * 100) : 0;
                              const lowDetPct = obsCount ? Math.round((lowDetailCount    / obsCount) * 100) : 0;
                              const noExpPct  = obsCount ? Math.round((noExplanationCount / obsCount) * 100) : 0;

                              return (
                                <>
                                  {/* Domain averages */}
                                  <div style={{ background:'white', borderRadius:'12px', padding:'1.1rem 1.2rem', boxShadow:'0 2px 8px rgba(0,0,0,0.06)', marginBottom:'0.75rem' }}>
                                    <p style={{ fontSize:'0.72rem', fontWeight:700, color:'#888', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:'0.75rem' }}>Domain Averages</p>
                                    {domainList.map(d => (
                                      <div key={d.key} style={{ marginBottom:'0.55rem' }}>
                                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'0.2rem' }}>
                                          <span style={{ fontSize:'0.78rem', color:'#555' }}>{d.icon} {d.label}</span>
                                          <span style={{ fontSize:'0.78rem', fontWeight:700, color: d.color }}>{d.avg}/5</span>
                                        </div>
                                        <div style={{ height:'7px', borderRadius:'4px', background:'#F0F0F0', overflow:'hidden' }}>
                                          <div style={{ height:'100%', width:`${(d.avg/5)*100}%`, background: d.color, borderRadius:'4px', transition:'width 0.4s' }} />
                                        </div>
                                      </div>
                                    ))}
                                  </div>

                                  {/* Strength + Focus */}
                                  <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0.6rem', marginBottom:'0.75rem' }}>
                                    <div style={{ background:'#F0FDF4', border:'1px solid #BBF7D0', borderRadius:'12px', padding:'0.9rem 1rem' }}>
                                      <p style={{ fontSize:'0.65rem', fontWeight:700, color:'#15803D', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:'0.3rem' }}>✅ Strength</p>
                                      <p style={{ fontSize:'0.8rem', fontWeight:700, color:'#14532D', margin:'0 0 0.2rem' }}>{strongest.icon} {strongest.label} ({strongest.avg}/5)</p>
                                      <p style={{ fontSize:'0.72rem', color:'#166534', margin:0, lineHeight:1.4 }}>Students are performing well at {strongest.desc}.</p>
                                    </div>
                                    <div style={{ background:'#FFF7ED', border:'1px solid #FED7AA', borderRadius:'12px', padding:'0.9rem 1rem' }}>
                                      <p style={{ fontSize:'0.65rem', fontWeight:700, color:'#C2410C', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:'0.3rem' }}>⚠️ Focus Area</p>
                                      <p style={{ fontSize:'0.8rem', fontWeight:700, color:'#7C2D12', margin:'0 0 0.2rem' }}>{weakest.icon} {weakest.label} ({weakest.avg}/5)</p>
                                      <p style={{ fontSize:'0.72rem', color:'#9A3412', margin:0, lineHeight:1.4 }}>Students need to improve {weakest.desc}.</p>
                                    </div>
                                  </div>

                                  {/* Teaching action */}
                                  <div style={{ background:'linear-gradient(135deg, #EFF6FF, #DBEAFE)', border:'1px solid #BFDBFE', borderRadius:'12px', padding:'0.9rem 1.1rem', marginBottom:'0.75rem' }}>
                                    <p style={{ fontSize:'0.65rem', fontWeight:700, color:'#1D4ED8', textTransform:'uppercase', letterSpacing:'0.05em', marginBottom:'0.3rem' }}>💡 Suggested Next Step</p>
                                    <p style={{ fontSize:'0.75rem', color:'#1E3A5F', margin:'0 0 0.3rem', lineHeight:1.5, fontStyle:'italic' }}>{stagePrefix}</p>
                                    <p style={{ fontSize:'0.78rem', color:'#1E40AF', fontWeight:600, margin:0, lineHeight:1.5 }}>{actions[weakest.key]}</p>
                                  </div>

                                  {/* Common issues */}
                                  {obsCount >= 3 && (
                                    <div style={{ background:'white', borderRadius:'12px', padding:'0.9rem 1.1rem', boxShadow:'0 2px 8px rgba(0,0,0,0.06)', marginBottom:'0.75rem' }}>
                                      <p style={{ fontSize:'0.72rem', fontWeight:700, color:'#888', textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:'0.5rem' }}>Common Issues</p>
                                      {(() => {
                                        const issues = [
                                          { pct: noBehPct,  text: 'of responses showed low behaviour identification', show: noBehPct  > 20 },
                                          { pct: lowDetPct, text: 'of responses showed low supporting detail',        show: lowDetPct > 20 },
                                          { pct: noExpPct,  text: 'of responses contained no explanation language',   show: noExpPct  > 30 && stage >= 4 },
                                        ].filter(i => i.show);
                                        if (issues.length === 0) return (
                                          <p style={{ fontSize:'0.75rem', color:'#16A34A', fontWeight:600, margin:0 }}>✓ No significant common issues detected</p>
                                        );
                                        return issues.map((item, i) => (
                                          <div key={i} style={{ display:'flex', alignItems:'center', gap:'0.5rem', marginBottom:'0.3rem' }}>
                                            <span style={{ fontSize:'0.78rem', fontWeight:700, color:'#DC2626', minWidth:'36px' }}>{item.pct}%</span>
                                            <span style={{ fontSize:'0.75rem', color:'#555', lineHeight:1.4 }}>{item.text}</span>
                                          </div>
                                        ));
                                      })()}
                                    </div>
                                  )}
                                </>
                              );
                            })()}

                        </div>
                      );
                    })()}

                    {/* Student Groups */}
                    {(() => {
                      const students = firestoreStudents;
                      if (students.length === 0) return null;

                      // Build per-student average from all their observation scores
                      const studentStats = students.map(s => {
                        let totB = 0, totD = 0, totW = 0, n = 0;
                        (s.badges || []).forEach(b => {
                          const obs = b.observationScore;
                          if (!obs || typeof obs !== 'object') return;
                          totB += obs.behaviour || 0;
                          totD += obs.detail    || 0;
                          totW += obs.writing   || 0;
                          n++;
                        });
                        if (n === 0) return null;
                        const avgB = totB / n, avgD = totD / n, avgW = totW / n;
                        const avg  = (avgB + avgD + avgW) / 3;
                        return { name: s.name, avg, avgB, avgD, avgW };
                      }).filter(Boolean);

                      if (studentStats.length === 0) return null;

                      // Overall groups
                      const support    = studentStats.filter(s => s.avg < 2.5);
                      const developing = studentStats.filter(s => s.avg >= 2.5 && s.avg <= 3.5);
                      const proficient = studentStats.filter(s => s.avg > 3.5);

                      // Domain-specific groups
                      const lowBGroup = studentStats.filter(s => s.avgB < 3);
                      const lowDGroup = studentStats.filter(s => s.avgD < 3);
                      const lowWGroup = studentStats.filter(s => s.avgW < 3);

                      const overallGroups = [
                        { key:'support',    label:'Support',    dot:'🔴', count: support.length,    students: support,    bg:'#FEF2F2', border:'#FECACA', labelColor:'#991B1B', tip:'Work with these students on identifying behaviour and adding simple detail.' },
                        { key:'developing', label:'Developing', dot:'🟡', count: developing.length, students: developing, bg:'#FFFBEB', border:'#FDE68A', labelColor:'#92400E', tip:'Encourage adding more specific detail and clearer explanations.' },
                        { key:'proficient', label:'Proficient', dot:'🟢', count: proficient.length, students: proficient, bg:'#F0FDF4', border:'#BBF7D0', labelColor:'#14532D', tip:'Extend by asking students to explain significance and use scientific reasoning.' },
                      ];
                      const domainGroups = [
                        { key:'lowB', label:'Needs Behaviour Support', icon:'🧠', count: lowBGroup.length, students: lowBGroup, color:'#059669' },
                        { key:'lowD', label:'Needs Detail Support',    icon:'🔍', count: lowDGroup.length, students: lowDGroup, color:'#0284C7' },
                        { key:'lowW', label:'Needs Writing Support',   icon:'✏️', count: lowWGroup.length, students: lowWGroup, color:'#7C3AED' },
                      ].filter(g => g.count > 0);

                      const NameList = ({ students }) => (
                        <div style={{ marginTop:'0.5rem', display:'flex', flexWrap:'wrap', gap:'0.3rem' }}>

                                                      <label style={{ fontSize:'0.62rem', color:'#6B7280', display:'block', marginBottom:'0.1rem' }}>{label}</label>
                                                      <select value={form[key] ?? ''} onChange={e => setOverrideForms(prev => ({ ...prev, [bKey]: { ...prev[bKey], [key]: e.target.value } }))}
                                                        style={{ width:'100%', padding:'0.22rem 0.3rem', borderRadius:'4px', border:'1px solid #D1D5DB', fontSize:'0.75rem', background:'white' }}>
                                                        <option value="">–</option>
                                                        {[1,2,3,4,5].map(n => <option key={n} value={n}>{n}/5</option>)}
                                                      </select>
                                                    </div>
                                                  ))}
                                                </div>
                                                <select value={form.reason || ''} onChange={e => setOverrideForms(prev => ({ ...prev, [bKey]: { ...prev[bKey], reason: e.target.value } }))}
                                                  style={{ width:'100%', marginBottom:'0.35rem', padding:'0.22rem 0.3rem', borderRadius:'4px', border:'1px solid #D1D5DB', fontSize:'0.73rem', background:'white' }}>
                                                  <option value="">Select reason…</option>
                                                  <option value="adjusted for fairness">Adjusted for fairness</option>
                                                  <option value="misinterpreted response">Misinterpreted response</option>
                                                  <option value="other">Other</option>
                                                </select>
                                                <input type="text" value={form.note || ''} onChange={e => setOverrideForms(prev => ({ ...prev, [bKey]: { ...prev[bKey], note: e.target.value } }))} placeholder="Note (optional)"
                                                  style={{ width:'100%', marginBottom:'0.35rem', padding:'0.25rem 0.35rem', borderRadius:'4px', border:'1px solid #D1D5DB', fontSize:'0.73rem', boxSizing:'border-box' }} />
                                              </>
                                            )}
                                            <label style={{ display:'flex', alignItems:'center', gap:'0.35rem', fontSize:'0.7rem', color:'#374151', cursor:'pointer', marginBottom:'0.35rem' }}>
                                              <input type="checkbox" checked={form.flagged || false} onChange={e => setOverrideForms(prev => ({ ...prev, [bKey]: { ...prev[bKey], flagged: e.target.checked } }))} />
                                              Flag for review
                                            </label>
                                            <div style={{ display:'flex', gap:'0.35rem' }}>
                                              <button onClick={async () => {
                                                setOverrideSaving(bKey);
                                                const result = await saveOverride(observationsModal.name, b.animalId, { ...form, active: !form.flagOnly });
                                                setOverrideSaving(null);
                                                if (result.ok) setOverrideForms(prev => ({ ...prev, [bKey]: { ...prev[bKey], open: false } }));
                                              }} disabled={overrideSaving === bKey}
                                                style={{ flex:1, padding:'0.28rem', borderRadius:'4px', border:'none', background:'var(--jungle-mid)', color:'white', fontSize:'0.72rem', fontWeight:700, cursor:'pointer' }}>
                                                {overrideSaving === bKey ? 'Saving…' : 'Save'}
                                              </button>
                                              <button onClick={() => setOverrideForms(prev => ({ ...prev, [bKey]: { ...prev[bKey], open: false } }))}
                                                style={{ padding:'0.28rem 0.5rem', borderRadius:'4px', border:'1px solid #D1D5DB', background:'white', fontSize:'0.72rem', color:'#6B7280', cursor:'pointer' }}>
                                                Cancel
                                              </button>
                                            </div>
                                          </div>
                                        )}
                                      </div>
                                    );
                                  })()}
                                </div>
                              )}
                            </div>
                          );
                        })()}
                      </div>
                    ))}
                    {(observationsModal.badges || []).filter(b => b.observationScore || (b.observation && b.observation.trim())).length === 0 && (
                      <p style={{ fontSize:'0.85rem', color:'#aaa', textAlign:'center', padding:'1rem 0' }}>No observations recorded yet.</p>
                    )}
                  </div>
                </div>
              </div>
            )}
            {selectedConservation && (
              <div onClick={() => setSelectedConservation(null)} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.45)', zIndex:100, display:'flex', alignItems:'center', justifyContent:'center', padding:'1.5rem' }}>
                <div onClick={(e) => e.stopPropagation()} style={{ background:'white', borderRadius:'18px', width:'100%', maxWidth:'480px', boxShadow:'0 24px 60px rgba(0,0,0,0.25)' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'1.2rem 1.4rem 0.8rem', borderBottom:'1px solid #F0EDE8' }}>
                    <div>
                      <h3 style={{ fontSize:'1.1rem', fontWeight:700, color:'var(--jungle-deep)', margin:0 }}>🌱 Conservation Statement</h3>
                      <p style={{ fontSize:'0.78rem', color:'#888', margin:'0.15rem 0 0' }}>{selectedConservation.name}</p>
                    </div>
                    <button onClick={() => setSelectedConservation(null)} style={{ background:'none', border:'none', fontSize:'1.4rem', color:'#aaa', cursor:'pointer', lineHeight:1, padding:'0.2rem 0.4rem' }}>x</button>
                  </div>
                  <div style={{ padding:'1rem 1.4rem 1.4rem' }}>
                    <div style={{ borderLeft:'3px solid #34A85A', background:'#F4FAF6', borderRadius:'0 10px 10px 0', padding:'0.85rem 1rem' }}>
                      <p style={{ fontSize:'0.88rem', color:'#333', lineHeight:1.65, margin:0 }}>{selectedConservation.text}</p>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TarongaTracka />);
  </script>
</body>
</html>
