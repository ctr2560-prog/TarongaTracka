<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Taronga Tracka v2.2 - Animal Discovery</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --jungle-deep: #0A2F1F;
      --jungle-mid: #1A5238;
      --jungle-light: #2E7D55;
      --safari-gold: #D4A574;
      --sunset-orange: #E86A33;
      --earth-clay: #8B5A3C;
      --mist-light: #F5F3EE;
      --discovery-blue: #4A9FD8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      background: var(--mist-light);
      touch-action: pan-y;
      overscroll-behavior: contain;
    }

    .heading-display {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.08em;
    }

    .serif-accent {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes fall {
      to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
    .animate-scale-in   { animation: scaleIn 0.6s ease-out forwards; }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TarongaTracka = () => {
      // ---------- LOAD/SAVE PROGRESS ----------
      const loadProgress = () => {
        try {
          const saved = localStorage.getItem('tarongaTrackaProgress');
          if (saved) return JSON.parse(saved);
        } catch (err) {
          console.log('Error loading progress:', err);
        }
        return null;
      };

      const savedProgress = loadProgress();

      const [currentScreen, setCurrentScreen] = useState(savedProgress?.currentScreen || 'home');
      const [userLocation, setUserLocation] = useState(null);
      const [locationEnabled, setLocationEnabled] = useState(savedProgress?.locationEnabled || false);
      const [foundAnimals, setFoundAnimals] = useState(new Set(savedProgress?.foundAnimals || []));
      const [currentAnimal, setCurrentAnimal] = useState(null);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [showResult, setShowResult] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);
      const [observation, setObservation] = useState('');
      const [totalPoints, setTotalPoints] = useState(savedProgress?.totalPoints || 0);
      const [badges, setBadges] = useState(savedProgress?.badges || []);
      const [isProcessingAnswer, setIsProcessingAnswer] = useState(false);

      // IMPORTANT: GPS watcher must never force navigation after the first entry.
      const geoWatchIdRef = useRef(null);
      const hasEnteredMapRef = useRef(false);

      useEffect(() => {
        const progress = {
          currentScreen,
          locationEnabled,
          foundAnimals: Array.from(foundAnimals),
          totalPoints,
          badges
        };
        localStorage.setItem('tarongaTrackaProgress', JSON.stringify(progress));
      }, [currentScreen, foundAnimals, totalPoints, badges, locationEnabled]);

      // Cleanup geolocation watcher on unmount
      useEffect(() => {
        return () => {
          if (geoWatchIdRef.current !== null) {
            navigator.geolocation.clearWatch(geoWatchIdRef.current);
            geoWatchIdRef.current = null;
          }
        };
      }, []);

      // Prevent browser back button during quiz/observation (optional)
      useEffect(() => {
        if (currentScreen === 'animal' || currentScreen === 'observation') {
          const handleBackButton = (e) => {
            e.preventDefault();
            if (window.confirm('Leave and go back to map?')) {
              setCurrentScreen('map');
            } else {
              window.history.pushState(null, '', window.location.href);
            }
          };

          window.history.pushState(null, '', window.location.href);
          window.addEventListener('popstate', handleBackButton);

          return () => window.removeEventListener('popstate', handleBackButton);
        }
      }, [currentScreen]);

      // ---------- DATA ----------
      const animals = [
        { 
          id: 'chimpanzee',
          name: 'Chimpanzee',
          scientificName: 'Pan troglodytes',
          image: 'images/chimpanzee.jpg',
          latitude: -33.8428,
          longitude: 151.2401,
          radius: 50,
          color: '#8B5A3C',
          questions: [
            { q: 'What do chimpanzees use tools for?',
              options: ['Cracking nuts and fishing for termites', 'Building houses', 'Playing music', 'Swimming'],
              correct: 0,
              fact: 'Chimpanzees use sticks to fish for termites and stones to crack nuts.' },
            { q: 'How similar is chimpanzee DNA to human DNA?',
              options: ['50%', '75%', '98-99%', '100%'],
              correct: 2,
              fact: 'Chimpanzees share around 98–99% of their DNA with humans.' },
            { q: 'What is a group of chimpanzees called?',
              options: ['A pack', 'A community', 'A herd', 'A school'],
              correct: 1,
              fact: 'A group of chimpanzees is called a community.' }
          ],
          observationPrompt: 'Observe the chimpanzees for 2 minutes. What behaviors did you see?',
          pointValue: 50
        },
        { 
          id: 'gorilla',
          name: 'Western Lowland Gorilla',
          scientificName: 'Gorilla gorilla gorilla',
          image: 'images/gorilla.jpg',
          latitude: -33.8443,
          longitude: 151.2413,
          radius: 50,
          color: '#2E2E2E',
          questions: [
            { q: 'What is the alpha male gorilla called?',
              options: ['King Kong', 'Silverback', 'Alpha', 'Chief'],
              correct: 1,
              fact: 'The leader is called a silverback due to the silver hair on his back.' },
            { q: 'What percentage of a gorilla\'s diet is plant-based?',
              options: ['50%', '75%', '95%+', '100%'],
              correct: 2,
              fact: 'Gorillas are mostly herbivores — over 95% of their diet is plants.' },
            { q: 'How do gorillas communicate?',
              options: ['Only through sounds', 'Vocalizations, gestures, and body language', 'Telepathy', 'Writing'],
              correct: 1,
              fact: 'Gorillas use sounds, facial expressions, and body language to communicate.' }
          ],
          observationPrompt: 'Watch the gorillas carefully. Describe their social interactions.',
          pointValue: 50
        },
        { 
          id: 'lion',
          name: 'African Lion',
          scientificName: 'Panthera leo',
          image: 'images/lion.jpg',
          latitude: -33.8427,
          longitude: 151.2393,
          radius: 50,
          color: '#D4A574',
          questions: [
            { q: 'How far can a lion\'s roar be heard?',
              options: ['500 meters', '2 kilometers', '8 kilometers', '20 kilometers'],
              correct: 2,
              fact: 'A lion’s roar can be heard up to about 8 km away.' },
            { q: 'Who does most of the hunting in a lion pride?',
              options: ['Male lions', 'Female lions', 'Cubs', 'All equally'],
              correct: 1,
              fact: 'Female lions do most of the hunting and work together as a team.' },
            { q: 'How many hours a day do lions typically rest?',
              options: ['5 hours', '10 hours', '16-20 hours', '24 hours'],
              correct: 2,
              fact: 'Lions can rest 16–20 hours a day to conserve energy.' }
          ],
          observationPrompt: 'Watch the lions. Describe their behavior and social interactions.',
          pointValue: 50
        },
        { 
          id: 'giraffe',
          name: 'Giraffe',
          scientificName: 'Giraffa camelopardalis',
          image: 'images/giraffe.jpg',
          latitude: -33.8431,
          longitude: 151.2404,
          radius: 50,
          color: '#E86A33',
          questions: [
            { q: 'How do giraffes sleep?',
              options: ['Standing up for short periods', 'Lying down for 8 hours', 'They never sleep', 'Hanging from trees'],
              correct: 0,
              fact: 'Giraffes often sleep standing and only for short periods.' },
            { q: 'What is unique about a giraffe\'s tongue?',
              options: ['It\'s blue-black and up to 50cm long', 'It glows in the dark', 'It\'s forked like a snake', 'It\'s covered in scales'],
              correct: 0,
              fact: 'A giraffe’s tongue can be very long and dark to help protect from sun.' },
            { q: 'How do giraffes drink water?',
              options: ['Using their long tongue', 'Through their nose', 'By spreading their front legs apart', 'They don\'t drink water'],
              correct: 2,
              fact: 'They spread their front legs to reach down and drink.' }
          ],
          observationPrompt: 'Observe how the giraffes move and eat. What feeding behaviors do you notice?',
          pointValue: 50
        },
        { 
          id: 'koala',
          name: 'Koala',
          scientificName: 'Phascolarctos cinereus',
          image: 'images/koala.jpg',
          latitude: -34.2068,
          longitude: 150.5799,
          radius: 50,
          color: '#7A8B6F',
          questions: [
            { q: 'Without intervention, by what year could koalas become extinct in NSW?',
              options: ['2030', '2040', '2050', '2060'],
              correct: 2,
              fact: 'Some projections warn koalas could disappear from parts of NSW by around 2050 without action.' },
            { q: 'Which adaptation helps koalas climb and grip tree trunks effectively?',
              options: ['Sharp claws and opposable toes', 'Long tails for balance', 'Webbed feet for swimming', 'Flexible spines for jumping'],
              correct: 0,
              fact: 'Koalas have sharp claws and opposable toes for gripping.' },
            { q: 'Why do koalas spend up to 18–20 hours a day sleeping?',
              options: ['They are nocturnal predators', 'Their fur causes them to overheat', 'They are avoiding competition', 'Their diet is low in energy, requiring energy conservation'],
              correct: 3,
              fact: 'Eucalyptus leaves are low in energy, so koalas conserve energy by resting.' }
          ],
          observationPrompt: 'Watch the koala carefully. What position is it in?',
          pointValue: 50
        },
        { 
          id: 'tiger',
          name: 'Sumatran Tiger',
          scientificName: 'Panthera tigris sumatrae',
          image: 'images/tiger.jpg',
          latitude: -33.8433,
          longitude: 151.2394,
          radius: 50,
          color: '#E86A33',
          questions: [
            { q: 'How many Sumatran tigers are left in the wild?',
              options: ['Over 10,000', '5,000-7,000', 'Fewer than 400', 'They are extinct'],
              correct: 2,
              fact: 'Estimates often place the wild population at fewer than 400.' },
            { q: 'What makes Sumatran tigers different from other tigers?',
              options: ['They are the smallest tiger subspecies', 'They are the largest', 'They can fly', 'They are herbivores'],
              correct: 0,
              fact: 'Sumatran tigers are the smallest tiger subspecies.' },
            { q: 'Why are Sumatran tigers endangered?',
              options: ['Climate change only', 'Habitat loss and poaching', 'Disease', 'Natural predators'],
              correct: 1,
              fact: 'Major threats include habitat loss and poaching.' }
          ],
          observationPrompt: 'Watch the tiger\'s behavior. Describe how it moves.',
          pointValue: 50
        }
      ];

      // ---------- HELPERS ----------
      const calculateDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
      };

      // ✅ FIXED: no more forcing map every GPS update
      const enableLocation = () => {
        // Mobile video: attempt play only on user gesture (button click)
        const video = document.querySelector('video');
        if (video) {
          try {
            video.muted = true;
            video.playsInline = true;
            video.play().catch(() => {});
          } catch (_) {}
        }

        if (!('geolocation' in navigator)) {
          alert('Geolocation not supported on this device.');
          return;
        }

        if (geoWatchIdRef.current !== null) return; // already watching

        geoWatchIdRef.current = navigator.geolocation.watchPosition(
          (position) => {
            setUserLocation({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy
            });

            setLocationEnabled(true);

            // ✅ Only move to map ONE time (from home)
            if (!hasEnteredMapRef.current) {
              hasEnteredMapRef.current = true;
              setCurrentScreen(prev => (prev === 'home' ? 'map' : prev));
            }
          },
          (error) => {
            console.error('Geo error:', error);
            alert('Unable to get location. Please enable location services.');
            if (geoWatchIdRef.current !== null) {
              navigator.geolocation.clearWatch(geoWatchIdRef.current);
              geoWatchIdRef.current = null;
            }
          },
          { enableHighAccuracy: true, maximumAge: 5000 }
        );
      };

      const checkAnimalProximity = (animal) => {
        if (!userLocation) return { nearby: false, distance: null };

        const distance = calculateDistance(
          userLocation.latitude,
          userLocation.longitude,
          animal.latitude,
          animal.longitude
        );

        // TESTING MODE (always nearby)
        return { nearby: true, distance: Math.round(distance) };
      };

      const discoverAnimal = (animal, event) => {
        if (event) event.stopPropagation();
        if (foundAnimals.has(animal.id)) return;

        const { nearby } = checkAnimalProximity(animal);
        if (!nearby) return;

        setCurrentAnimal(animal);
        setQuizAnswers({});
        setCurrentQuestionIndex(0);
        setShowResult(false);
        setIsCorrect(false);
        setObservation('');
        setIsProcessingAnswer(false);
        setCurrentScreen('animal');

        setTimeout(() => window.scrollTo({ top: 0, behavior: 'instant' }), 0);
      };

      const handleQuizAnswer = (questionIndex, answerIndex) => {
        if (isProcessingAnswer) return;

        setIsProcessingAnswer(true);

        const question = currentAnimal.questions[questionIndex];
        const correct = answerIndex === question.correct;

        setIsCorrect(correct);
        setShowResult(true);

        if (correct) {
          setQuizAnswers(prev => ({ ...prev, [questionIndex]: answerIndex }));

          // Optional sound (make sure the file exists)
          // Example path: images/sound-chimpanzee.mp3
          const audio = new Audio(`images/sound-${currentAnimal.id}.mp3`);
          audio.play().catch(() => {});
        }
      };

      const handleNextQuestion = () => {
        setIsProcessingAnswer(false);
        setShowResult(false);

        if (currentQuestionIndex < currentAnimal.questions.length - 1) {
          setCurrentQuestionIndex(i => i + 1);
        } else {
          setCurrentScreen('observation');
        }
      };

      const submitObservation = () => {
        const wc = observation.trim().split(/\s+/).filter(Boolean).length;
        if (wc < 10) {
          alert(`Your observation needs at least 10 words. You have ${wc}.`);
          return;
        }

        // Quiz points
        let correctCount = 0;
        currentAnimal.questions.forEach((q, i) => {
          if (quizAnswers[i] === q.correct) correctCount++;
        });
        const quizPoints = correctCount * 10;

        // Observation scoring
        const text = observation.trim();
        const lower = text.toLowerCase();

        const behaviorWords = [
          'sleeping','eating','walking','climbing','jumping','playing','sitting',
          'running','resting','moving','looking','watching','grooming','scratching',
          'lying','standing','hanging','swinging','chewing','drinking','hiding',
          'stretching','yawning','sniffing','touching','holding','grabbing'
        ];

        let behaviorCount = 0;
        behaviorWords.forEach(w => { if (lower.includes(w)) behaviorCount++; });
        const behaviorBonus = Math.min(behaviorCount * 5, 25);

        const detailWords = [
          'fur','color','eyes','ears','tail','paws','claws','nose','mouth',
          'teeth','stripes','spots','pattern','size','big','small','long',
          'short','thick','thin','soft','rough','dark','light','brown',
          'black','white','orange','grey','gray','quietly','slowly','quickly'
        ];

        let detailCount = 0;
        detailWords.forEach(w => { if (lower.includes(w)) detailCount++; });
        const detailBonus = Math.min(detailCount * 3, 15);

        let literacyBonus = 0;
        if (/^[A-Z]/.test(text)) literacyBonus += 3;
        if (/[.!?]$/.test(text)) literacyBonus += 2;

        const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
        if (sentences.length >= 2) literacyBonus += 3;

        const uniqueWords = new Set(lower.split(/\s+/).filter(Boolean));
        const wordCount = lower.split(/\s+/).filter(Boolean).length;
        if (wordCount > 0 && uniqueWords.size / wordCount > 0.6) literacyBonus += 2;

        const baseObservationPoints = 30;

        const totalEarned =
          quizPoints +
          baseObservationPoints +
          behaviorBonus +
          detailBonus +
          literacyBonus +
          currentAnimal.pointValue;

        setTotalPoints(p => p + totalEarned);
        setFoundAnimals(prev => new Set([...prev, currentAnimal.id]));

        setBadges(prev => ([
          ...prev,
          {
            animalId: currentAnimal.id,
            animal: currentAnimal.name,
            points: totalEarned,
            behaviorScore: behaviorBonus,
            detailScore: detailBonus,
            literacyScore: literacyBonus,
            timestamp: new Date().toISOString()
          }
        ]));

        // Badge screen
        setCurrentScreen('badge');
      };

      // ---------- SCREENS ----------
      // HOME
      if (currentScreen === 'home') {
        return (
          <div style={{
            position: 'relative',
            width: '100%',
            height: '100vh',
            overflow: 'hidden',
            background: 'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)'
          }}>
            {/* Video Background (mobile safe config) */}
            <video
              autoPlay
              loop
              muted
              playsInline
              webkit-playsinline="true"
              preload="metadata"
              style={{
                position: 'absolute',
                top: 0,
                left: 0,
                width: '100%',
                height: '100%',
                objectFit: 'cover',
                zIndex: 0
              }}
            >
              <source src="images/background-video.mp4" type="video/mp4" />
            </video>

            {/* Overlay */}
            <div style={{
              position: 'absolute',
              top: 0, left: 0,
              width: '100%',
              height: '100%',
              background: 'linear-gradient(135deg, rgba(10,47,31,0.9) 0%, rgba(46,125,85,0.85) 100%)',
              zIndex: 1
            }} />

            <div style={{
              position: 'relative',
              zIndex: 2,
              height: '100%',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              padding: '2rem'
            }}>
              <div style={{
                textAlign: 'center',
                color: 'white',
                maxWidth: '600px',
                animation: 'fadeInUp 1s ease-out'
              }}>
                <div style={{
                  width: '140px',
                  height: '140px',
                  margin: '0 auto 2rem',
                  background: 'rgba(255,255,255,0.15)',
                  borderRadius: '50%',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  backdropFilter: 'blur(10px)'
                }}>
                  <img
                    src="images/logo.png"
                    alt="Taronga Tracka"
                    style={{ width: '80px', height: 'auto' }}
                    onError={(e) => { e.target.style.display = 'none'; }}
                  />
                </div>

                <h1 className="heading-display" style={{
                  fontSize: 'clamp(2.5rem, 6vw, 4rem)',
                  marginBottom: '1rem',
                  color: 'var(--safari-gold)'
                }}>
                  TARONGA TRACKA
                </h1>

                <p style={{
                  fontSize: 'clamp(1.1rem, 2.5vw, 1.3rem)',
                  marginBottom: '2.5rem',
                  lineHeight: 1.6,
                  opacity: 0.9
                }}>
                  Embark on a journey to discover amazing animals and earn badges along the way!
                </p>

                <button
                  onClick={() => {
                    enableLocation();
                  }}
                  style={{
                    background: 'linear-gradient(135deg, var(--sunset-orange), var(--earth-clay))',
                    color: 'white',
                    border: 'none',
                    padding: '1.2rem 2.5rem',
                    fontSize: '1.2rem',
                    fontWeight: 700,
                    borderRadius: '50px',
                    cursor: 'pointer',
                    textTransform: 'uppercase',
                    letterSpacing: '0.1em',
                    boxShadow: '0 8px 24px rgba(232,106,51,0.4)',
                    transition: 'all 0.3s ease'
                  }}
                >
                  Start Your Adventure
                </button>

                {!locationEnabled && (
                  <p style={{
                    fontSize: '0.9rem',
                    marginTop: '1.5rem',
                    opacity: 0.7
                  }}>
                    Location access required for animal discovery
                  </p>
                )}
              </div>
            </div>
          </div>
        );
      }

      // MAP
      if (currentScreen === 'map') {
        return (
          <div style={{ position: 'relative', minHeight: '100vh' }}>
            <div style={{
              background: 'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)',
              padding: '1.5rem',
              textAlign: 'center',
              boxShadow: '0 4px 20px rgba(0,0,0,0.1)'
            }}>
              <h1 className="heading-display" style={{ fontSize: '2rem', color: 'white' }}>
                Animal Discovery Map
              </h1>
              <p style={{ color: 'rgba(255,255,255,0.8)', marginTop: '0.5rem' }}>
                Find animals by getting close to their habitats
              </p>
            </div>

            {/* ... (rest of the file continues exactly as in the repo) ... */}
