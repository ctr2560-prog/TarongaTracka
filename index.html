<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taronga Tracka</title>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ee;
    }
    button {
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

function TarongaTracka() {

  /* -----------------------------
     STATE
  ----------------------------- */
  const saved = JSON.parse(localStorage.getItem("trackaSave") || "{}");

  const [screen, setScreen] = useState(saved.screen || "home");
  const [currentAnimal, setCurrentAnimal] = useState(saved.currentAnimal || null);
  const [questionIndex, setQuestionIndex] = useState(0);
  const [showResult, setShowResult] = useState(false);
  const [isCorrect, setIsCorrect] = useState(false);
  const [observation, setObservation] = useState("");
  const [found, setFound] = useState(saved.found || []);
  const [points, setPoints] = useState(saved.points || 0);

  /* -----------------------------
     SAVE STATE (FIXED)
  ----------------------------- */
  useEffect(() => {
    localStorage.setItem("trackaSave", JSON.stringify({
      screen,
      currentAnimal,
      found,
      points
    }));
  }, [screen, currentAnimal, found, points]);

  /* -----------------------------
     DATA
  ----------------------------- */
  const animals = [
    {
      id: "chimpanzee",
      name: "Chimpanzee",
      image: "images/chimpanzee.jpg",
      questions: [
        {
          q: "What do chimpanzees use tools for?",
          options: ["Cracking nuts", "Cooking food", "Building houses", "Swimming"],
          correct: 0
        }
      ],
      observationPrompt: "Describe what the chimpanzee is doing."
    },
    {
      id: "koala",
      name: "Koala",
      image: "images/koala.jpg",
      questions: [
        {
          q: "Why do koalas sleep so much?",
          options: ["They are lazy", "Low-energy diet", "Cold weather", "Avoid predators"],
          correct: 1
        }
      ],
      observationPrompt: "Describe the koala’s position and behaviour."
    }
  ];

  /* -----------------------------
     VIDEO PLAY (MOBILE SAFE)
  ----------------------------- */
  function startExperience() {
    const video = document.getElementById("bg-video");
    if (video) video.play().catch(() => {});
    setScreen("map");
  }

  /* -----------------------------
     QUIZ HANDLERS
  ----------------------------- */
  function answerQuestion(index) {
    const correct = index === currentAnimal.questions[questionIndex].correct;
    setIsCorrect(correct);
    setShowResult(true);
  }

  function nextStep() {
    setShowResult(false);
    if (questionIndex < currentAnimal.questions.length - 1) {
      setQuestionIndex(questionIndex + 1);
    } else {
      setScreen("observation");
    }
  }

  function submitObservation() {
    if (observation.trim().split(/\s+/).length < 10) {
      alert("Write at least 10 words");
      return;
    }
    setFound([...found, currentAnimal.id]);
    setPoints(points + 100);
    setScreen("badge");
  }

  /* -----------------------------
     SCREENS
  ----------------------------- */

  /* HOME */
  if (screen === "home") {
    return (
      <div style={{ position:"relative", height:"100vh" }}>
        <video
          id="bg-video"
          muted
          loop
          playsInline
          preload="auto"
          poster="images/video-poster.jpg"
          style={{
            position:"absolute",
            inset:0,
            width:"100%",
            height:"100%",
            objectFit:"cover"
          }}
        >
          <source src="images/background-video.mp4" type="video/mp4" />
        </video>

        <div style={{
          position:"relative",
          zIndex:1,
          height:"100%",
          display:"flex",
          flexDirection:"column",
          justifyContent:"center",
          alignItems:"center",
          background:"rgba(0,0,0,0.5)",
          color:"white"
        }}>
          <h1>Taronga Tracka</h1>
          <button onClick={startExperience} style={{ padding:"1rem 2rem" }}>
            Begin Exploration
          </button>
        </div>
      </div>
    );
  }

  /* MAP */
  if (screen === "map") {
    return (
      <div style={{ padding:"2rem" }}>
        <h2>Discover Animals</h2>
        <p>Points: {points}</p>

        {animals.map(a => (
          <div key={a.id}
            style={{
              margin:"1rem 0",
              padding:"1rem",
              background:"#fff",
              borderRadius:"10px"
            }}
            onClick={() => {
              if (!found.includes(a.id)) {
                setCurrentAnimal(a);
                setQuestionIndex(0);
                setScreen("quiz");
              }
            }}
          >
            {a.name} {found.includes(a.id) && "✓"}
          </div>
        ))}
      </div>
    );
  }

  /* QUIZ */
  if (screen === "quiz" && currentAnimal) {
    const q = currentAnimal.questions[questionIndex];
    return (
      <div style={{ padding:"2rem" }}>
        <h2>{currentAnimal.name}</h2>
        <p>{q.q}</p>

        {q.options.map((o,i) => (
          <button key={i} onClick={() => answerQuestion(i)} style={{ display:"block", margin:"0.5rem 0" }}>
            {o}
          </button>
        ))}

        {showResult && (
          <div>
            <h3>{isCorrect ? "Correct!" : "Try again"}</h3>
            {isCorrect && <button onClick={nextStep}>Continue</button>}
            {!isCorrect && <button onClick={() => setShowResult(false)}>Retry</button>}
          </div>
        )}
      </div>
    );
  }

  /* OBSERVATION */
  if (screen === "observation") {
    return (
      <div style={{ padding:"2rem" }}>
        <h2>Observation</h2>
        <p>{currentAnimal.observationPrompt}</p>
        <textarea
          value={observation}
          onChange={e => setObservation(e.target.value)}
          style={{ width:"100%", height:"150px" }}
        />
        <button onClick={submitObservation}>Submit</button>
      </div>
    );
  }

  /* BADGE */
  if (screen === "badge") {
    return (
      <div style={{ padding:"2rem", textAlign:"center" }}>
        <h1>Badge Earned!</h1>
        <img src={`images/badge-${currentAnimal.id}.png`} style={{ width:"150px" }} />
        <p>+100 points</p>
        <button onClick={() => setScreen("map")}>Continue</button>
      </div>
    );
  }

  return null;
}

ReactDOM.render(<TarongaTracka />, document.getElementById("root"));
</script>

</body>
</html>
