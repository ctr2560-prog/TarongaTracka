    :root {

    * {

    }

    body {
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      background: var(--mist-light);

    .serif-accent {

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .animate-scale-in {
      animation: scaleIn 0.6s ease-out forwards;
    }

    /* Crossfade animation for background images */
    @keyframes imageFade {
      0% { opacity: 1; }
      16.66% { opacity: 1; }
      19.66% { opacity: 0; }
      97% { opacity: 0; }
      100% { opacity: 1; }
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;

    .bg-image:nth-child(1) { animation-delay: 0s; }

    const { useState, useEffect } = React;

    const TarongaTracka = () => {
      console.log('=== TARONGA TRACKA v2.2 LOADED ===');
      console.log('If you see old version, clear cache: Command + Shift + R');
      console.log('Component loading...');
      
      // DIAGNOSTIC: Alert to confirm this is the right file
      React.useEffect(() => {
        setTimeout(() => {
          alert('VERSION 2.2 LOADED - FILE IS CORRECT');

      // Load saved progress from localStorage
      const loadProgress = () => {
        try {
          const saved = localStorage.getItem('tarongaTrackaProgress');

      const [currentScreen, setCurrentScreen] = useState(savedProgress?.currentScreen || 'home');

              fact: 'Sumatran tigers are the smallest tiger subspecies! This helps them move through dense rainforest.'

      ];

      const calculateDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        return R * c;
      };

      const enableLocation = () => {
        // Try to play video on user interaction (required for mobile)
        const video = document.querySelector('video');
        if (video) {
          video.play().then(() => {
            console.log('Video playing after user interaction');
          }).catch(err => {
            console.log('Video play still failed:', err);
          });
        }
        
        if ('geolocation' in navigator) {
          navigator.geolocation.watchPosition(
            (position) => {
              setUserLocation({
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy
              });
              setLocationEnabled(true);
              setCurrentScreen('map');
            },
            (error) => {
              alert('Unable to get location. Please enable location services.');
            },
            { enableHighAccuracy: true, maximumAge: 5000 }
          );
        }
      };

      const checkAnimalProximity = (animal) => {
        if (!userLocation) return { nearby: false, distance: null };
        
        const distance = calculateDistance(
          userLocation.latitude,
          userLocation.longitude,
          animal.latitude,
          animal.longitude
        );
        
        return {
          nearby: true, // TESTING MODE - all animals nearby
          distance: Math.round(distance)
        };
      };

      const discoverAnimal = (animal, event) => {
        if (event) {
          event.stopPropagation();
        }

        if (foundAnimals.has(animal.id)) {
          return;
        }

        const { nearby } = checkAnimalProximity(animal);
        if (!nearby) {
          return;
        }

        setCurrentAnimal(animal);
        setQuizAnswers({});
        setCurrentQuestionIndex(0);
        setShowResult(false);
        setObservation('');
        setCurrentScreen('animal');
        
        // Scroll to top after state update
        setTimeout(() => {
          window.scrollTo({ top: 0, behavior: 'instant' });
        }, 0);
      };

      const handleQuizAnswer = (questionIndex, answerIndex) => {
        if (isProcessingAnswer) {
          console.log('Already processing answer, ignoring click');
          return;
        }
        
        setIsProcessingAnswer(true);
        console.log('Processing answer:', answerIndex);
        
        const question = currentAnimal.questions[questionIndex];
        const correct = answerIndex === question.correct;
        
        setIsCorrect(correct);
        setShowResult(true);
        
        if (correct) {
          // Play animal sound
          const audio = new Audio(`images/sound-${currentAnimal.id}.mp3`);
          audio.play().catch(err => console.log('Audio play failed:', err));
          
          // Store correct answer
          setQuizAnswers({
            ...quizAnswers,
            [questionIndex]: answerIndex
          });
        }
        
        // NO AUTOMATIC NAVIGATION - user must click button
      };
      
      const handleNextQuestion = () => {
        console.log('handleNextQuestion called');
        setIsProcessingAnswer(false);
        setShowResult(false);
        if (currentQuestionIndex < currentAnimal.questions.length - 1) {
          console.log('Moving to next question:', currentQuestionIndex + 1);
          setCurrentQuestionIndex(currentQuestionIndex + 1);
        } else {
          console.log('All questions done, going to observation');
          setCurrentScreen('observation');
        }
      };

      const submitObservation = () => {
        const wordCount = observation.trim().split(/\s+/).length;
        
        if (wordCount < 10) {
          alert('Your observation needs at least 10 words. You have ' + wordCount + ' words.');
          return;
        }

        // Base points from quiz
        let correctCount = 0;
        currentAnimal.questions.forEach((q, i) => {
          if (quizAnswers[i] === q.correct) correctCount++;
        });
        const quizPoints = correctCount * 10;
        
        // Calculate observation quality points
        const text = observation.trim();
        const words = text.toLowerCase();
        let observationScore = 30; // Base observation points
        
        // DESCRIPTIVE CONTENT - reward what the animal is DOING (max 25 points)
        const behaviorWords = [
          'sleeping', 'eating', 'walking', 'climbing', 'jumping', 'playing', 'sitting',
          'running', 'resting', 'moving', 'looking', 'watching', 'grooming', 'scratching',
          'lying', 'standing', 'hanging', 'swinging', 'chewing', 'drinking', 'hiding',
          'stretching', 'yawning', 'sniffing', 'touching', 'holding', 'grabbing'
        ];
        
        let behaviorCount = 0;
        behaviorWords.forEach(word => {
          if (words.includes(word)) behaviorCount++;
        });
        const behaviorBonus = Math.min(behaviorCount * 5, 25); // 5 points per behavior, max 25
        
        // DETAIL - reward describing features (max 15 points)
        const detailWords = [
          'fur', 'color', 'eyes', 'ears', 'tail', 'paws', 'claws', 'nose', 'mouth',
          'teeth', 'stripes', 'spots', 'pattern', 'size', 'big', 'small', 'long',
          'short', 'thick', 'thin', 'soft', 'rough', 'dark', 'light', 'brown', 
          'black', 'white', 'orange', 'grey', 'gray', 'quietly', 'slowly', 'quickly'
        ];
        
        let detailCount = 0;
        detailWords.forEach(word => {
          if (words.includes(word)) detailCount++;
        });
        const detailBonus = Math.min(detailCount * 3, 15); // 3 points per detail, max 15
        
        // LITERACY - reward good writing (max 10 points)
        let literacyBonus = 0;
        
        // Capital at start
        if (/^[A-Z]/.test(text)) literacyBonus += 3;
        
        // Ends with punctuation
        if (/[.!?]$/.test(text)) literacyBonus += 2;
        
        // Multiple sentences
        const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
        if (sentences.length >= 2) literacyBonus += 3;
        
        // Decent word variety
        const uniqueWords = new Set(words.split(/\s+/));
        if (uniqueWords.size / wordCount > 0.6) literacyBonus += 2;
        
        const totalEarned = quizPoints + observationScore + behaviorBonus + detailBonus + literacyBonus + currentAnimal.pointValue;

        console.log('Submitting observation. Points:', totalEarned);
        
        setTotalPoints(totalPoints + totalEarned);
        setFoundAnimals(new Set([...foundAnimals, currentAnimal.id]));
        setBadges([...badges, {
          animal: currentAnimal.name,
          emoji: currentAnimal.emoji,
          points: totalEarned,
          behaviorScore: behaviorBonus,
          detailScore: detailBonus,
          literacyScore: literacyBonus,
          timestamp: new Date()
        }]);

        console.log('Badge created. Navigating to badge screen...');
        
        // Play animal sound on badge earned
        const audio = new Audio(`sounds/${currentAnimal.id}.mp3`);
        audio.play().catch(err => console.log('Sound play failed:', err));

        setCurrentScreen('badge');
      };

                  }}
                  onFocus={(e) => e.target.style.borderColor = currentAnimal.color}
                  onBlur={(e) => e.target.style.borderColor = '#E5E5E5'}
                />
                <div style={{
                  marginTop: '1rem',
                  fontSize: '1rem',
                  color: wordCount >= 10 ? 'var(--jungle-light)' : '#E86A33',
                  fontWeight: 600
                }}>
                  {wordCount}/10 words {wordCount >= 10 ? '✓' : ''}
                </div>

                <button
                  onClick={submitObservation}
                  disabled={wordCount < 10}
                  style={{
                    width: '100%',
                    padding: '1.5rem',
                    borderRadius: '50px',
                    border: 'none',
                    background: wordCount >= 10
                      ? 'linear-gradient(135deg, var(--sunset-orange), var(--earth-clay))'
                      : '#CCC',
                    color: 'white',
                    fontSize: '1.3rem',
                    fontWeight: 700,
                    cursor: wordCount >= 10 ? 'pointer' : 'not-allowed',
                    transition: 'all 0.3s ease',
                    textTransform: 'uppercase',
                    letterSpacing: '0.1em',
                    marginTop: '2rem',
                    boxShadow: wordCount >= 10 
                      ? '0 8px 24px rgba(232,106,51,0.4)' 
                      : 'none'
                  }}
                  onMouseEnter={(e) => {
                    if (wordCount >= 10) {
                      e.target.style.transform = 'translateY(-2px)';
                      e.target.style.boxShadow = '0 12px 32px rgba(232,106,51,0.5)';
                    }
                  }}
                  onMouseLeave={(e) => {
                    e.target.style.transform = 'translateY(0)';
                    e.target.style.boxShadow = wordCount >= 10 
                      ? '0 8px 24px rgba(232,106,51,0.4)' 
                      : 'none';
                  }}
                >
                  {wordCount < 10 ? 'Write More to Continue' : '🏆 Submit & Earn Badge'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // BADGE COLLECTION SCREEN
      if (currentScreen === 'collection') {
        return (
          <div style={{
            position: 'fixed',
            top: 0,
            left: 0,
            width: '100vw',
            height: '100vh',
            background: 'linear-gradient(135deg, var(--jungle-deep) 0%, var(--jungle-mid) 100%)',
            overflow: 'auto',
            padding: '1rem'
          }}>
            {/* Header */}
            <div style={{
              maxWidth: '900px',
              margin: '0 auto 2rem',
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              padding: '1rem'
            }}>
              <button
                onClick={() => setCurrentScreen('map')}
                style={{
                  background: 'rgba(255,255,255,0.2)',
                  border: 'none',
                  color: 'white',
                  padding: '0.6rem 1.2rem',
                  borderRadius: '20px',
                  cursor: 'pointer',
                  fontSize: '0.9rem',
                  fontWeight: 600
                }}
              >
                ← Back
              </button>
              <h1 className="heading-display" style={{
                fontSize: 'clamp(1.8rem, 4vw, 2.5rem)',
                color: 'white'
              }}>
                BADGE COLLECTION
              </h1>
              <div style={{ width: '80px' }}></div>
            </div>

            {/* Badges Grid */}
            <div style={{
              maxWidth: '900px',
              margin: '0 auto',
              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fill, minmax(150px, 1fr))',
              gap: '1.5rem',
              padding: '1rem'
            }}>
              {animals.map(animal => {
                const earned = foundAnimals.has(animal.id);
                const badge = badges.find(b => b.animal === animal.name);
                
                return (
                  <div
                    key={animal.id}
                    style={{
                      background: earned ? 'white' : 'rgba(255,255,255,0.1)',
                      borderRadius: '16px',
                      padding: '1.5rem',
                      textAlign: 'center',
                      opacity: earned ? 1 : 0.4,
                      boxShadow: earned ? '0 8px 24px rgba(0,0,0,0.2)' : 'none'
                    }}
                  >
                    {/* Badge Image */}
                    <div style={{
                      width: '100px',
                      height: '100px',
                      margin: '0 auto 1rem',
                      backgroundImage: earned ? `url(images/badge-${animal.id}.png)` : 'none',
                      backgroundColor: earned ? 'transparent' : 'rgba(255,255,255,0.1)',
                      backgroundSize: 'contain',
                      backgroundRepeat: 'no-repeat',
                      backgroundPosition: 'center',
                      borderRadius: '50%',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      fontSize: '3rem'
                    }}>
                      {!earned && '🔒'}
                    </div>
                    
                    <h3 style={{
                      fontSize: '1.1rem',
                      fontWeight: 700,
                      color: earned ? 'var(--jungle-deep)' : 'white',
                      marginBottom: '0.5rem'
                    }}>
                      {animal.name}
                    </h3>
                    
                    {earned && badge && (
                      <div>
                        <p style={{
                          fontSize: '1.5rem',
                          fontWeight: 700,
                          color: 'var(--sunset-orange)',
                          marginBottom: '0.3rem'
                        }}>
                          {badge.points} pts
                        </p>
                        {badge.behaviorScore !== undefined && (
                          <p style={{
                            fontSize: '0.7rem',
                            color: '#666',
                            lineHeight: 1.3
                          }}>
                            Behavior: +{badge.behaviorScore}<br/>
                            Detail: +{badge.detailScore}<br/>
                            Writing: +{badge.literacyScore}
                          </p>
                        )}
                      </div>
                    )}
                    
                    {!earned && (
                      <p style={{
                        fontSize: '0.85rem',
                        color: 'rgba(255,255,255,0.6)'
                      }}>
                        Not yet discovered
                      </p>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Total Points */}
            <div style={{
              maxWidth: '900px',
              margin: '2rem auto',
              background: 'rgba(255,255,255,0.1)',
              borderRadius: '20px',
              padding: '1.5rem',
              textAlign: 'center'
            }}>
              <div style={{
                fontSize: '3rem',
                fontWeight: 700,
                color: 'var(--safari-gold)',
                marginBottom: '0.5rem'
              }}>
                ⭐ {totalPoints}
              </div>
              <div style={{
                fontSize: '1.2rem',
                color: 'white',
                fontWeight: 600,
                marginBottom: '1rem'
              }}>
                Total Points
              </div>
              
              {/* Reset Button */}
              <button
                onClick={() => {
                  if (window.confirm('Are you sure you want to reset all progress? This cannot be undone!')) {
                    localStorage.removeItem('tarongaTrackaProgress');
                    window.location.reload();
                  }
                }}
                style={{
                  background: 'rgba(239, 68, 68, 0.8)',
                  color: 'white',
                  border: 'none',
                  padding: '0.6rem 1.2rem',
                  borderRadius: '20px',
                  cursor: 'pointer',
                  fontSize: '0.85rem',
                  fontWeight: 600
                }}
              >
                🔄 Reset Progress
              </button>
            </div>
          </div>
        );
      }

      // BADGE EARNED SCREEN
      if (currentScreen === 'badge') {
        console.log('Badge screen rendering. Badges:', badges);
        const lastBadge = badges[badges.length - 1];
        
        if (!lastBadge) {
          console.error('No badge found!');
          return <div style={{padding: '2rem', color: 'white'}}>Error: No badge data</div>;
        }

        return (
          <div style={{
            position: 'fixed',
            top: 0,
            left: 0,
            width: '100vw',
            height: '100vh',
            background: 'linear-gradient(135deg, var(--sunset-orange) 0%, var(--earth-clay) 50%, var(--jungle-mid) 100%)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: 'clamp(1rem, 5vw, 2rem)',
            overflow: 'hidden'
          }}>
            <div className="animate-scale-in" style={{
              background: 'white',
              borderRadius: '24px',
              padding: 'clamp(1.5rem, 4vh, 2.5rem)',
              maxWidth: '500px',
              width: '100%',
              textAlign: 'center',
              boxShadow: '0 20px 60px rgba(0,0,0,0.3)',
              display: 'flex',
              flexDirection: 'column',
              justifyContent: 'center'
            }}>
              {/* Badge Image with fallback emoji */}
              <div style={{
                height: 'clamp(100px, 25vh, 150px)',
                width: 'clamp(100px, 25vh, 150px)',
                margin: '0 auto clamp(1rem, 2vh, 1.5rem)',
                backgroundImage: `url(images/badge-${lastBadge.animal.toLowerCase().replace(/\s+/g, '-')}.png)`,
                backgroundSize: 'contain',
                backgroundRepeat: 'no-repeat',
                backgroundPosition: 'center',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                fontSize: '5rem'
              }}>
                {/* Fallback emoji - only shows if image fails to load */}
                <span style={{filter: 'drop-shadow(0 4px 8px rgba(0,0,0,0.2))'}}>{lastBadge.emoji}</span>
              </div>
              
              <h2 className="heading-display" style={{
                fontSize: 'clamp(1.8rem, 4vh, 2.5rem)',
                color: 'var(--jungle-deep)',
                marginBottom: '0.3rem'
              }}>
                BADGE EARNED!
              </h2>
              
              <p className="serif-accent" style={{
                fontSize: 'clamp(1rem, 2.5vh, 1.3rem)',
                color: 'var(--sunset-orange)',
                marginBottom: 'clamp(0.8rem, 1.5vh, 1rem)'
              }}>
                {lastBadge.animal}
              </p>

              <div style={{
                background: 'linear-gradient(135deg, #FFF9E6 0%, #FFE6B3 100%)',
                borderRadius: '16px',
                padding: 'clamp(1rem, 2vh, 1.5rem)',
                marginBottom: 'clamp(0.8rem, 1.5vh, 1rem)'
              }}>
                <div style={{
                  fontSize: 'clamp(2rem, 5vh, 3rem)',
                  fontWeight: 700,
                  color: 'var(--earth-clay)',
                  marginBottom: '0.3rem'
                }}>
                  +{lastBadge.points}
                </div>
                <div style={{
                  color: '#666',
                  fontSize: 'clamp(0.8rem, 1.8vh, 0.95rem)'
                }}>
                  Points
                </div>
              </div>

              <div style={{
                background: '#F5F3EE',
                borderRadius: '16px',
                padding: 'clamp(1rem, 2vh, 1.5rem)',
                marginBottom: 'clamp(0.8rem, 1.5vh, 1rem)'
              }}>
                <div style={{
                  color: '#666',
                  fontSize: 'clamp(0.8rem, 1.8vh, 0.9rem)',
                  marginBottom: '0.3rem'
                }}>
                  Total Progress
                </div>
                <div style={{
                  fontSize: 'clamp(1.3rem, 2.8vh, 1.8rem)',
                  fontWeight: 700,
                  color: 'var(--jungle-deep)',
                  marginBottom: '0.3rem'
                }}>
                  {foundAnimals.size}/{animals.length} Animals
                </div>
                <div style={{
                  fontSize: 'clamp(1.2rem, 2.5vh, 1.5rem)',
                  fontWeight: 700,
                  color: 'var(--sunset-orange)'
                }}>
                  ⭐ {totalPoints} Points
                </div>
              </div>

              <button
                onClick={() => setCurrentScreen('map')}
                style={{
                  background: 'linear-gradient(135deg, var(--sunset-orange), var(--earth-clay))',
                  color: 'white',
                  border: 'none',
                  padding: 'clamp(0.8rem, 1.5vh, 1rem) 2rem',
                  fontSize: 'clamp(1rem, 2vh, 1.2rem)',
                  fontWeight: 700,
                  borderRadius: '50px',
                  cursor: 'pointer',
                  textTransform: 'uppercase'
                }}
              >
                Continue Exploring
              </button>
            </div>
          </div>
        );
      }

      return null;
    };

    ReactDOM.render(<TarongaTracka />, document.getElementById('root'));
  </script>

  <style>
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.6;
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }
  </style>
</body>
</html>
